Just like diplomas, where you got it from matters… kinda.</figcaption></figure><figure class="slide" id="slide-16" data-thumb="thumbs/016.webp" style="--ar:1.7761"><div class="frame"><img src="slides/016.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 16 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 16</span>Technical INterview
Demonstrate to us RIGHT NOW that you know what you say you know
Programming interviews are infamous for this.</figcaption></figure><figure class="slide" id="slide-17" data-thumb="thumbs/017.webp" style="--ar:1.7761"><div class="frame"><img src="slides/017.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 17 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 17</span>Technical INterview-Logic Problems
I walk one mile south, one mile west, and one mile north.  I’m exactly back where I started. Where am I?
There are 25 horses.  What is the minimum number of races needed so you can identify the fastest 3 horses?  You can race up to 5 horses at a time, but you do not have a watch.
There are 12 men on an island. 11 weigh exactly the same amount, but one of them is slightly lighter or heavier. You must figure out which. The island has no escapes, but there is a seesaw. The exciting catch? You can only use it three times.
A cat hides in five boxes numbered 1 to 5 and placed in a row close to each other.Each night the cat must jump to an adjacent box.Each morning, you open a box to catch the cat. The cat knows which box you will open.It plans its jump accordingly to escape you.How can you catch the cat and win the game of hide and seek?
There is a lightbulb inside a closet. The door is closed, and you cannot see if the light is on or off through the door. However, you know the light is off to start. Outside of the closet, there are three light switches.One of the door light switches controls the lightbulb in the closet. You can flip the switches however you want, but once you open the door, you can no longer touch the switches.
https://www.youtube.com/c/MindYourDecisions/featured</figcaption></figure><figure class="slide" id="slide-18" data-thumb="thumbs/018.webp" style="--ar:1.7761"><div class="frame"><img src="slides/018.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 18 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 18</span>Resume Writing</figcaption></figure><figure class="slide" id="slide-19" data-thumb="thumbs/019.webp" style="--ar:1.7761"><div class="frame"><img src="slides/019.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 19 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 19</span>Tips
Action Verbs: https://www.themuse.com/advice/185-powerful-verbs-that-will-make-your-resume-awesome
Stats and Numbers
Show how you added Value to a company
Resume Programs are helpful https://novoresume.com/?noRedirect=true</figcaption></figure><figure class="slide" id="slide-20" data-thumb="thumbs/020.webp" style="--ar:1.7761"><div class="frame"><img src="slides/020.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 20 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 20</span>Linked In</figcaption></figure><figure class="slide" id="slide-21" data-thumb="thumbs/021.webp" style="--ar:1.7761"><div class="frame"><img src="slides/021.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 21 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 21</span>Tips
You should add a picture, either a professional looking headshot, or potentially a picture of you doing something you enjoy that employers might connect with.  (hiking, with dogs, first competition)
Treat LinkedIn as sort of a CV, you&#x27;re not limited to a page, so fill out your experience with more details than you would put on your resume.  In the future you can reference this, and pick and choose which details you&#x27;d like to include depending on the job you&#x27;re applying for.
Add your technical expertise there.  I think there are even some quick 10 question linkedin evaluations you can do to show that you know the bare minimum.
Get a few more connections.  Just go down the suggestions and connect with anyone you genuinely know.  Don&#x27;t worry too much about rejection on linkedin.</figcaption></figure><figure class="slide" id="slide-22" data-thumb="thumbs/022.webp" style="--ar:1.7761"><div class="frame"><img src="slides/022.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 22 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 22</span>THe Interview</figcaption></figure><figure class="slide" id="slide-23" data-thumb="thumbs/023.webp" style="--ar:1.7761"><div class="frame"><img src="slides/023.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 23 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 23</span>What to Bring
Bring a pen and paper to take notes on
Bring pre-prepared GOOD questions to ask your interviewers
Bring a water bottle
Bring a Folder containing
1 resume/CV (cover letter optional)for each person that will be at the interview.  This includes yourself.  E.g. 4 person panel, bring 5 copies
Wear Nice Clothes
Good rule of thumb is to dress one step higher than what you would wear to work there.
If in doubt, overdress, better to be overdressed and look eager than to underdress and look like you don’t care about the job</figcaption></figure><figure class="slide" id="slide-24" data-thumb="thumbs/024.webp" style="--ar:1.7761"><div class="frame"><img src="slides/024.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 24 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 24</span>Tips
PRAAAACTICE PRACTICE PRACTICE
Do mock interviews
Wear and use all the stuff you&#x27;ll actually wear and use in the actual interview
For example if you practice in comfortable clothes and on your computer over zoom, You might not realize how much you play with your collar, play with your water bottle, and fiddle with your pen when you&#x27;re nervous and thinking
If you&#x27;re doing your interview over zoom make sure all your computer stuff works ahead of time
A slow well considered answer is better than a rushed answer
If you need a slight break, a sip of water will give you a second
BREATHE!!!!</figcaption></figure><figure class="slide" id="slide-25" data-thumb="thumbs/025.webp" style="--ar:1.7761"><div class="frame"><img src="slides/025.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 25 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 25</span>Salary Negotiation</figcaption></figure><figure class="slide" id="slide-26" data-thumb="thumbs/026.webp" style="--ar:1.7761"><div class="frame"><img src="slides/026.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 26 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 26</span>Tips
To be able to negotiate salary effectively is like haggling at a market. If you&#x27;re willing to walk away, you&#x27;re going to do a lot better.
Rule #1 be willing to walk away if you can.
If you&#x27;re currently living at home, and the job market is fairly competitive walking away if things don&#x27;t go your way isn&#x27;t too painful.
Your ability to walk away is determined by your savings, your spouse&#x27;s income, and maybe other job offers
If you’re unemployed, and need to pay bills this limits your bargaining power
Rule #2 is whoever gives a number first loses
When someone throws out a number it sets the expectation. If you give a number first and it&#x27;s lower than what they were thinking, they&#x27;ll just agree and you&#x27;ll have lost out on potential income.
This part ties into rule 3
If they give their number first, you can counter with a reasonable increase
Rule #3 highballing strategy
This is a psych trick/sales technique
It&#x27;s a form of anchoring, unfortunately anchoring goes both ways since if you already work for the company. That&#x27;s why your biggest raises come when you switch companies
Let&#x27;s say they want to pay you 70k a year and you want 80k
If you counter their 70k with 80k they&#x27;ll counter with 75k maybe
If you counter with the highest reasonable #. For example 90k. 80k will sound much more attractive to them.</figcaption></figure><figure class="slide" id="slide-27" data-thumb="thumbs/027.webp" style="--ar:1.7761"><div class="frame"><img src="slides/027.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 27 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 27</span>Retention Offers and How to Handle Them
Its always a good time to ask for more money when you’re planning on quitting anyways
Who knows they might offer you something that makes you happy to work there again.
Don’t stay at a company you told you’re leaving
They may just use the time you gave them by staying to find your replacement
Entertain their offer, try to get more money than your current offer from your new employer.
Take that offer, and ask your new employer if they can match or beat it.</figcaption></figure><figure class="slide" id="slide-28" data-thumb="thumbs/028.webp" style="--ar:1.7761"><div class="frame"><img src="slides/028.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 28 of 28"></div><figcaption class="slide-text"><span class="slide-no">Slide 28</span>Other Stuff From Cat
