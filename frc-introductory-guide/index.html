HISTORY
FIRST — For Inspiration and Recognition of Science and Technology — was founded by inventor Dean Kamen in 1989. His vision: create a world where science and technology are celebrated as cool, important, and life-changing.
1989
Dean Kamen founds FIRST with Woodie Flowers. Mission: inspire youth toward science &amp; technology.
1992
First FRC competition held at Memorial High School gym, Manchester NH. ~28 teams, wired robots, one event.
1993
Transition to wireless radio control. Competition moves to Nashua High School. First use of &#x27;Maize Craze&#x27; game.
1995
FIRST outgrows single-event format. Regional system introduced. First FIRST Championship held at EPCOT Center, Orlando.
2002
FIRST begins international expansion. Canadian teams begin joining in growing numbers.
2011
Competition splits into two tracks: District Events (MI, MAR, PNW, NE) and Regional Events.
2017
Championship splits into two events: Houston, TX and Detroit, MI to accommodate explosive team growth.
2024
33rd year of FRC. 3,468 teams from 28 countries, 86,700+ students, 27,700+ mentors worldwide.</figcaption></figure><figure class="slide" id="slide-3" data-thumb="thumbs/003.webp" style="--ar:1.7761"><div class="frame"><img src="slides/003.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 3 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 3</span>Core Values: Gracious Professionalism &amp; Coopertition
CULTURE
Gracious Professionalism®
Coined by Dr. Woodie Flowers
(MIT professor, FIRST co-founder)
The principle that teams compete hard and try to win, but always treat other teams, referees, and spectators with respect and kindness — even rivals.
What it looks like in practice:
• Helping a competitor repair their robot before a match
• Sharing parts, tools, or knowledge with any team
• Cheering for great play — including by opponents
• No trash talk, no gloating, no excuses
&quot;It&#x27;s a way of doing your best work while treating others well.&quot; — Woodie Flowers
Coopertition®
A FIRST-invented word:
Cooperation + Competition
The idea that teams can and should cooperate with their competitors while still competing hard. Sharing innovations helps everyone grow — making the whole FRC community stronger.
Examples of Coopertition:
• Open Alliance teams publish full CAD &amp; code
• Teams sharing design whitepapers on Chief Delphi
• Veteran teams mentoring rookies at competitions
• Game rules with Coopertition bonus points
&quot;Powered by FIRST&quot; refers to the entire mentorship ecosystem built on this principle.</figcaption></figure><figure class="slide" id="slide-4" data-thumb="thumbs/004.webp" style="--ar:1.7761"><div class="frame"><img src="slides/004.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 4 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 4</span>&quot;The Hardest Fun&quot; &amp; More Than Robots
CULTURE
FRC was famously called &#x27;the hardest fun you&#x27;ll ever have.&#x27; The program is intentionally challenging — 6-week build season, 120-lb robots, tight rules. But it&#x27;s also transformational. 89% of FRC alumni declare a STEM major.
The Hardest Fun
Six weeks from kickoff to ship day. Real engineering constraints, real deadlines, real pressure. Teams often work nights and weekends. The challenge is the point — students learn more from failure than any classroom.
More Than Robots
FRC is explicitly not just about building robots. It&#x27;s about teamwork, communication, fundraising, outreach, public speaking, and mentorship. The Chairman&#x27;s Award (now Impact Award) often outranks the winning alliance.
Scholarship Impact
$80M+ in scholarships offered annually to FRC participants. 92% of FIRST alumni are more likely to attend college. 99% improve in teamwork. Female FRC alumni are 5.3× more likely to major in Computer Science.
Season Structure
Pre-season (Sep–Jan): fundraising, training, outreach. Kickoff (Jan): game revealed simultaneously worldwide. Build Season (Jan–Feb/Mar): 6 weeks. Competition Season (Mar–Apr): regionals/districts. Championship (Apr): Houston, TX.</figcaption></figure><figure class="slide" id="slide-5" data-thumb="thumbs/005.webp" style="--ar:1.7761"><div class="frame"><img src="slides/005.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 5 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 5</span>Game History
Every FRC season from 1992 to 2026 — what teams built, what they played, and what changed the sport</figcaption></figure><figure class="slide" id="slide-6" data-thumb="thumbs/006.webp" style="--ar:1.7761"><div class="frame"><img src="slides/006.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 6 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 6</span>Era 1: The Founding Years (1992–2002)
GAME HISTORY
1992
(Unnamed)
The very first FRC competition. 28 teams, one gym in Manchester NH. Wired tether control. No official game name.
1993
Maize Craze
Teams collected yellow rubber balls. Transition to wireless radios. Still a single event.
1994
Rug Rage
Teams pushed carpet squares to score. First hints of pushing matches and defensive play.
1995
Tower Power
First regional + championship system. Championship held at EPCOT Center, Orlando. 100+ teams.
1996
Ramp N&#x27; Roll
Teams built ramps and drove onto each other&#x27;s platforms. Cooperative elements appeared.
1997
Hexagon Havoc
Robots scored balls into hexagonal goals. Alliance structures refined.
1998
Toroid Terror
Rubber rings scored on pegs. First hint of complex game piece manipulation.
1999
Ladder Logic
Robots climbed ladders and balanced on platforms for bonus points.
2000
Double Trouble
Balls scored into double-sided goals. First &#x27;ball shooter&#x27; designs emerge.
2001
Co-opertition FIRST
Game literally named for the value. Cross-alliance cooperation explicitly rewarded in scoring.
2002
Zone Zeal
Robots scored in color-coded zones. 24 regionals, 1,000+ teams competing worldwide.</figcaption></figure><figure class="slide" id="slide-7" data-thumb="thumbs/007.webp" style="--ar:1.7761"><div class="frame"><img src="slides/007.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 7 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 7</span>Era 2: The Growth Years (2003–2012)
GAME HISTORY
2003
Stack Attack
Robots stacked storage bins as high as possible. Strategy around counterstacking opponents was key.
2004
FIRST Frenzy
Balls, hanging from bars, moving goals. First widespread elevator and hopper designs.
2005
Triple Play
Robots placed tetras (tetrahedra) on top of goals. Spatial reasoning and fast cycle times rewarded.
2006
Aim High
Teams shot foam balls into elevated goals. First major widespread SHOOTER meta in FRC history.
2007
Rack &#x27;N&#x27; Roll
Teams placed inner tubes on racks in FIRST logo shapes. Arm and gripper mechanisms emerged.Rambot’s first competition.
2008
FIRST Overdrive
Robots raced around a track moving giant balls over/under an overpass. Defense-heavy meta.
2009
Lunacy
Played on low-friction plastic — robots slid everywhere to celebrate moon landing anniversary. Widely disliked.
2010
Breakaway
Teams kicked soccer balls into goals through tunnels and over bumps. Robots balanced on towers.
2011
LOGO MOTION
Teams hung tubes to form FIRST logo. 254 wins their first World Championship. Minibot tower climb end-game.
2012
Rebound Rumble
Basketball shooting into tiered hoops. Alliance cooperation rewarded. First major &#x27;balance the bridge&#x27; end-game.</figcaption></figure><figure class="slide" id="slide-8" data-thumb="thumbs/008.webp" style="--ar:1.7761"><div class="frame"><img src="slides/008.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 8 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 8</span>Era 3: The Modern Era (2013–2020)
GAME HISTORY
2013
Ultimate Ascent
Flying disc (frisbee) scoring into tiered goals. End-game pyramid climbing. High-skill shooter meta.
2014
Aerial Assist
Alliance-based passing game. Teams assisted each other to score. 254&#x27;s legendary Barrage wins worlds.
2015
Recycle Rush
Stacking totes, capping with recycling bins. No defense allowed. 1678 wins worlds. Divisive game design.
2016
FIRST Stronghold
Capture-the-flag style. Teams crossed defenses, shot boulders into towers. Heavily defense-oriented.
2017
FIRST Steamworks
Gears into airships, steam pressure, climbing ropes. 254 wins. Swerve drive adoption accelerates.
2018
FIRST Power Up
Cubes on switches/scales, vault power-ups. 254 wins again. Brushless motor era begins (NEO, Falcon).
2019
Destination Deep Space
Hatch panels and cargo balls into rockets/ships. 2910 wins. Autonomous sandstorm blind period added.
2020
Infinite Recharge
Star Wars themed ball-shooting game. Events ran Feb–Mar before COVID-19 cancelled the championship.</figcaption></figure><figure class="slide" id="slide-9" data-thumb="thumbs/009.webp" style="--ar:1.7761"><div class="frame"><img src="slides/009.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 9 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 9</span>Era 4: The Swerve &amp; Vision Era (2021–2026)
GAME HISTORY
2021
Infinite Recharge
(At Home)
COVID year. Teams competed with at-home skill challenges — no in-person events. Remote scouting &amp; design culture grows.
2022
Rapid React
2-ball shooting into hub, hangar climbing (low/mid/high/traversal bars). 254 wins. Swerve now majority of top teams.
2023
Charged Up
Cones &amp; cubes on grid. End-game charging station balance. Vision-based auto alignment becomes standard at top level.
2024
Crescendo
Notes (rings) into speaker &amp; amp. Microphone/trap end-game. 1690 Orbit wins. AprilTag field-relative auto dominates.
2025
Reefscape
Coral (PVC) and algae (ball) scored on reef structure. Deep cage climbing. 2910 wins. Complex multi-state auto routines.
2026
REBUILT™
New game announced Jan 10, 2026. FIRST revisits a classic-style game — balls into goals, tower climbing. Retro design.
⚡  The Modern Shift: Swerve drive became near-universal at the top level post-2020. AprilTag vision, path-following autonomous (PathPlanner, Choreo), and continuous logging (AdvantageKit) now define elite robot design.</figcaption></figure><figure class="slide" id="slide-10" data-thumb="thumbs/010.webp" style="--ar:1.7761"><div class="frame"><img src="slides/010.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 10 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 10</span>Legendary Teams
The dynasties, the innovators, and the robots that defined FRC competition</figcaption></figure><figure class="slide" id="slide-11" data-thumb="thumbs/011.webp" style="--ar:1.7761"><div class="frame"><img src="slides/011.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 11 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 11</span>Team 254 — The Cheesy Poofs

Davis

10-Year
Einstein Streak

Code &amp; CAD
Based in Davis, CA, Citrus Circuits is one of the most consistently elite teams in FRC history. From 2013–2022, they made Einstein (the World Championship finals field) for 10 consecutive years — an unprecedented streak ended only in 2023. They also release their full robot code to GitHub every season, giving back to the community.
2015
Recycle Rush Bot
Won World Championship in the notorious no-defense game. Precise tote stacking mechanism.
2016
Stronghold Bot
On Einstein. Defense-heavy meta; tough WCD. 10-year Einstein streak began in 2013.
2019
Deep Space Bot
Einstein appearance. Vision-based hatch panel &amp; cargo auto alignment — ahead of its time.
2023
Tangerine Tumbler
Cone/cube roller + arm. Top 5 at Championship. Full open-source code release on GitHub.
2024
Nik
Hook-based chain hang. Flywheel note shooter.
2025
SubLime
Coral/algae dual-use end-effector. Deep cage climb. Won 3 regionals. Open-source code released.</figcaption></figure><figure class="slide" id="slide-13" data-thumb="thumbs/013.webp" style="--ar:1.7761"><div class="frame"><img src="slides/013.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 13 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 13</span>Other All-Time Great Teams

Open Alliance
How the top teams share their designs — and what makes them impossible to beat</figcaption></figure><figure class="slide" id="slide-19" data-thumb="thumbs/019.webp" style="--ar:1.7761"><div class="frame"><img src="slides/019.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 19 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 19</span>What the Top Teams Do Differently
COMPETITIVE META
At the elite level, every top team uses swerve, vision-based autonomous, and continuous data logging. The gap is not in hardware — it&#x27;s in software maturity, driver practice, and scouting depth.
⚙️  Swerve Drive (Universal)
SDS MK4i or MK5n with Kraken X60 motors is the near-universal standard. Any team not running swerve is at a mobility disadvantage in most modern games.
📷  AprilTag Vision Localization
Limelight 3/4 or PhotonVision cameras on all corners of the robot. Full field-relative positioning updated 50+ times per second. Enables repeatable, precise auto paths.
🔄  PathPlanner / Choreo Auto
Pre-planned autonomous paths with time-optimal trajectories. Top teams run 3–5 game piece autos with 95%+ consistency. Auto points often decide playoff seeding.
📊  AdvantageKit Logging
Pioneered by 6328 Mechanical Advantage. Replays every robot action from logs for debugging. Teams that use it find and fix issues 10× faster. Now used by hundreds of teams.
🎯  Continuous Scouting Systems
1678-style scouting apps tracking OPR, cycle time, auto performance, and endgame per robot. Alliance selections at high-level events are data-driven, not eyeballed.
🤝  Gracious Mentor Networks
Top teams have engineers from FAANG companies, aerospace firms, and universities as active mentors. The mentor network is often the biggest competitive advantage of all.</figcaption></figure><figure class="slide" id="slide-20" data-thumb="thumbs/020.webp" style="--ar:1.7761"><div class="frame"><img src="slides/020.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 20 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 20</span>The Open Alliance &amp; Reference Robot Releases

REFERENCE ROBOT
118everybot.org  ·  Released annually within 1–2 weeks of Kickoff  ·  Full CAD, BOM, code &amp; documentation
What Is Everybot?
Every year since 2014, Team 118 Robonauts builds and fully documents a complete competitive robot that any team can replicate with:
• Kit of Parts / AM14U chassis
• Basic hand tools only (no CNC required)
• ~$1,400 total budget in 2025
• A basic 3D printer for select parts
2025 Everybot (Reefscape) included: coral into L1 trough, algae processing, and a deep cage climb — all on a KitBot chassis.
AndyMark officially co-distributes Everybot parts as a bundle, making it even easier for teams to source the exact hardware needed.
Why Every Team Should Know It
For rookie / low-resource teams:
A proven, complete, competition-ready robot with full instructions. No guessing, no reinventing the wheel. Field a competitive robot your first year.
For experienced teams:
Everybot shows what&#x27;s achievable with KoP + simple tools. Great for game analysis early in build season — see what the &#x27;floor&#x27; of competitive play looks like and design above it.
Everybot is also a fallback insurance policy. If your fancy custom robot breaks down mid-season, knowing you could deploy an Everybot gives you a safety net.</figcaption></figure><figure class="slide" id="slide-22" data-thumb="thumbs/022.webp" style="--ar:1.7761"><div class="frame"><img src="slides/022.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 22 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 22</span>Reference Designs: REV ION, WCP, &amp; Elite Concepts

revrobotics.com/ion
REV&#x27;s yearly reference robot built entirely on the REV ION ecosystem (MAXTube structure, NEO/Vortex motors, SPARK controllers, PDH). Full CAD on OnShape, full code on GitHub. Designed to showcase how all REV components work together. Particularly useful for teams committed to the REV ecosystem — direct drop-in designs for mechanisms.

SUPPLIER
REV is the official control system partner for FRC and the primary sponsor of team electrical infrastructure. Their ecosystem is highly integrated — all REV devices talk to each other over CAN bus with minimal setup.
Motors &amp; Controllers
NEO Brushless V1.1 — ~$35 — Compact, 6,000 RPM, extremely popular intake/mechanism motor
NEO 550 — ~$28 — Tiny brushless for small mechanisms (wrist, rollers, small intakes)
NEO Vortex — ~$90 — High-power brushless with Hall-effect encoder. Pairs with SPARK Flex

Control System
Power Distribution Hub (PDH) — ~$80 — 24 smart breaker slots, CAN reporting per channel
REV Control Hub — FTC device, not FRC legal (FRC uses roboRIO)
Radio Power Module — ~$40 — Provides conditioned power &amp; brownout protection for radio
MAXPlanetary Gearbox — ~$85+ — Modular planetary system. 3:1–100:1 ratios. Very reliable
EasySwerve Module — New, ~$350/module — Lower-cost REV swerve. Good for budget teams
Structure (REV ION System)
MAXTube 2×1 — ~$25/5ft — Pre-punched 0.5&quot; hole pattern on all 4 sides. Fast prototyping
MAXTube Endcaps &amp; Connectors — Snap together without tools. Hex shaft compatible
MAXPattens — 2D pattern plates that attach to MAXTube for mechanism mounting
Best for: Rookie to intermediate teams wanting a unified structural + electrical ecosystem

SUPPLIER
SDS built their entire company on one product: the best swerve modules in FRC. Their MK4i has been the dominant module for 3+ seasons, and the new MK5n represents the next evolution with inverted motor layout and wider tread.
MK4i (Inverted)
~$340–$380/module + motors
The &#x27;standard&#x27; competition swerve module for 2022–2025. Inverted motor layout keeps CG low. 4 gear ratio options (L1–L4). Compatible with NEO V1.1, NEO Vortex, or Kraken X60 drive. Kraken X60 + CANcoder is the most common competition config.
Best config: Drive: Kraken X60 | Steer: Kraken X44 or NEO Vortex | Encoder: CANcoder
MK5n (Next-Gen)
~$370–$420/module + motors
Released 2024–2025. Smallest SDS inverted-motor module. 5&quot; × 7.5&quot; footprint. Fully gear-driven steering (no belt, more robust). Enclosed bevel gears protect from carpet debris. Wider neoprene wheel tread. Quick-change gear ratio with just a pinion swap.
Best config: Drive: Kraken X60 | Steer: Kraken X44 | Encoder: CANcoder or Redux Canandmag
MK4 (Non-inverted)
~$290–$320/module + motors
The original SDS module that started the swerve revolution. Motor sits upright on top. Still widely used and fully competitive. Great choice for teams on budget who can find them second-hand. Compatible with same motors as MK4i.
Best config: Budget option — find used MK4s in FRC buy/sell groups ($150–200/module used)

TOOLS &amp; SOFTWARE
The FRC community builds and maintains dozens of free tools that rival or exceed professional software. These are the essential ones every competitive team should know.
PathPlanner
pathplanner.dev
GUI-based autonomous path planning for swerve + tank. Drag-and-drop waypoints on the actual field image. Generates time-optimal, holonomic-aware trajectories. Created by a single FRC student (mjansen4857). The most widely-used auto tool in competitive FRC. Java/Python/C++ support.
Choreo
choreo.autos
WPILib-integrated time-optimal trajectory generator. Similar to PathPlanner but mathematically optimizes every constraint simultaneously (motor physics, swerve kinematics). Now officially in WPILib docs. Preferred by teams wanting physics-accurate trajectories that squeeze every millisecond from auto.
AdvantageKit + AdvantageScope
github.com/Mechanical-Advantage
AdvantageKit: logging framework that records every robot input/output, enabling full match replay. AdvantageScope: visualization tool to watch robot telemetry, pose on field, mechanism states from logs. Pioneered by 6328. Used by 500+ teams. Has essentially become the expected standard at the competitive level.
Elastic Dashboard
github.com/Gold872/elastic-dashboard
Modern replacement for Shuffleboard. Lower latency, customizable widgets, swerve visualization, cleaner UI. Created by FRC student Gold872. Drag-and-drop telemetry panels, live PID tuning, field positioning widgets. Widely adopted by teams upgrading from basic Shuffleboard setups.
RECA (Robot Efficiency Calc.)
reca.lc
The AMB Design Spreadsheet but in web form. Input motor, gear ratio, load — get speed, force, current draw, efficiency. Essential for gearbox ratio selection for arms, elevators, and intakes. Prevents underpowered or overpowered mechanisms before you build anything.
MKCad (OnShape Library)
mkcad.org
Community-maintained OnShape parts library with every FRC COTS part: motors, gearboxes, wheels, electronics, structural tubing, swerve modules, and more. Auto-updated every season. Essential for any team using OnShape for CAD — insert any part directly into your robot assembly in seconds.</figcaption></figure><figure class="slide" id="slide-34" data-thumb="thumbs/034.webp" style="--ar:1.7761"><div class="frame"><img src="slides/034.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 34 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 34</span>Community Platforms &amp; Analysis Resources
RESOURCES
Beyond the main tools, these platforms are where FRC strategy, scouting, and community knowledge actually lives. Knowing them gives your team a significant analytical edge.
The Compass Alliance
thecompassalliance.org
Self-described &#x27;one-stop shop&#x27; for FRC resources. Curated links to strategy guides, technical documents, game analysis worksheets, award preparation guides. Run by a group of FRC mentors dedicated to helping teams across all experience levels. Great starting point for new teams.
LYNK Library of Knowledge
docs.lynkrobotics.org
Organized catalog of community-contributed FRC resources by category: Design, Programming, Strategy, Business, Community. Direct links to whitepapers from 1678, 3847, 971, and others. Think of it as a curated, searchable index of Chief Delphi&#x27;s best content without the noise.
NASA Robotics Alliance Project
robotics.nasa.gov/frc-resources
Official NASA resource list for FRC. Direct links to Everybot, 254&#x27;s resources, 971&#x27;s workshops, team handbook templates, and the NASA design guide — all on NASA-maintained infrastructure so it won&#x27;t disappear. Especially valuable for teams seeking NASA sponsorship resources.
Spectrum 3847 Resources
spectrum3847.org/resources
Nearly 200 slides covering FRC mechanical design from physics fundamentals to COTS parts. Separate guides for pneumatics, electrical wiring, robot maintenance, and beginner swerve. Updated regularly. One of the single most valuable free mechanical education resources in FRC.
Statbotics.io
statbotics.io
EPA (Expected Points Added) analytics platform. More accurate than OPR for ranking teams — accounts for alliance quality. Historical data back to 2002. Use it for: finding underrated pick list candidates, comparing teams across different events, and understanding which robots actually contributed to scores.
FRC Discord Server
discord.gg/frc
The real-time FRC community hub. Channels for every topic: game analysis, programming help, supplier deals, team intros, open alliance discussion. Fastest way to get help during build season. Moderators include FRC alumni from top teams. Active all year round, not just during season.</figcaption></figure><figure class="slide" id="slide-35" data-thumb="thumbs/035.webp" style="--ar:1.7761"><div class="frame"><img src="slides/035.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 35 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 35</span>Training Resource: FRCdesign.org
TRAINING
frcdesign.org  ·  Free  ·  Community-built  ·  Onshape-based  ·  From beginner to competition-ready robot design
Learning Course
Structured curriculum: from zero CAD experience to modeling a full competition robot
Uses Onshape (free, browser-based) — no license needed
Projects escalate from basic sketches → mechanisms → full robot assemblies
Exercises are FRC-specific: tube structures, shafts, bearings, gearboxes
Comparable to a semester-long CAD course — compressed into self-paced modules
Start here if your students have never used CAD before
Design Fundamentals Wiki
Reference guide (not a course): explains concepts for competitive robot design
Topics: game analysis, design principles, iteration, tolerancing, packaging
Complements the learning course — return to it during build season for decisions
Includes mechanism theory, not just CAD: how to think about your robot first
Written by FRC students and alumni who&#x27;ve competed at the highest levels
Mechanism Examples
Hand-picked mechanism designs with detailed breakdown of why they work
Not just a collection — each example explains design intent and tradeoffs
Elevators, arms, intakes, shooters, climbers — all with CAD walkthroughs
Updated each season with relevant examples from that year&#x27;s game
Great for build season: &#x27;we need an intake&#x27; → look at examples → understand options
Onshape Featurescripts
FRC-specific Onshape scripts that automate repetitive CAD tasks
Examples: punch tube holes on a pattern, generate belt/chain routing paths
MKCad integration: pull any COTS part directly into your assembly
Saves hours of manual work per week during crunch build season
Shared via Onshape&#x27;s public library — install once, use forever

TRAINING
WPILib is the official software framework for FRC robots. Understanding it deeply is the single biggest competitive advantage in programming — most teams only scratch the surface.
WPILib — docs.wpilib.org
The official FRC programming library and documentation. Java, C++, and Python supported. The documentation covers:
Core topics:
• Command-Based Programming (the standard architecture)
• Subsystem &amp; Command structure — RobotContainer pattern
• Control theory: PID, feedforward, state-space
• Kinematics &amp; odometry (swerve, differential)
• Vision integration (AprilTag, PhotonVision)
• PathPlanner &amp; Choreo integration guides
• Robot simulation framework
2025 additions:
• Elastic Dashboard integration
• Annotation-based logging (Java)
• WPIcal AprilTag calibration tool
• Java Units library refactor
Zero to Robot (WPILib)
docs.wpilib.org/zero-to-robot
Step-by-step series: install tools → wire robot → deploy first code → control a motor → use sensors. The official onboarding path. Every new programmer should start here before touching any custom code.
6328 Mechanical Advantage Code
github.com/Mechanical-Advantage
The most-studied open-source FRC code in history. Their AdvantageKit-based robot code is a masterclass in clean architecture, simulation support, and logging. Read it even if you don&#x27;t use it.
REV Hardware Client + Phoenix Tuner X
revrobotics.com / ctr-electronics.com
Device configuration and calibration tools from REV and CTRE. Use Phoenix Tuner X to zero CANcoders for swerve, set CAN IDs, and run motor tests. Use REV Hardware Client to update SPARK firmware and configure motor settings.
The Compass Alliance — Programming
thecompassalliance.org/programming
Curated programming guide links: control loops, odometry, vision, auto, command-based structure. Links to whitepapers from top teams. Especially good for mentors coming from industry trying to understand FRC-specific conventions.

TRAINING
Great mechanical design is as learnable as programming. These are the most respected mechanical education resources in FRC — from beginner to competition-winning design principles.
Spectrum 3847 Design Slides
Team 3847, Houston TX
spectrum3847.org/resources
200-slide comprehensive FRC mechanical design course. Topics: physics for robotics, gear ratios, chain/belt power transmission, linear motion, materials, tolerancing, mechanism types, and COTS parts in depth. Has been widely used as a formal in-team training curriculum for 8+ years. Also includes separate: Pneumatics Guide, Electrical Guide, Robot Maintenance Guide, and Beginner Swerve Guide.
1678 Citrus Circuits Design Training
Team 1678, Davis CA
citruscircuits.org/resources
Workshop slides from one of FRC&#x27;s most admired teams. Covers mechanism design thinking, design for reliability, &#x27;simple robots that win&#x27; philosophy, and CAD principles. Available on their website. Especially valuable for the &#x27;design philosophy&#x27; content that is hard to find elsewhere.
Dan Gelbart Prototyping Series
R&amp;D Engineer / Prototyping Expert
youtube.com - &#x27;Dan Gelbart Prototyping&#x27;
18-part YouTube series on rapid prototyping techniques. While not FRC-specific, it&#x27;s been recommended by mentors at 971, 254, and dozens of top teams. Covers tooling, materials, and methods achievable in a team shop. Life-changing for teams that feel limited by their tools — the constraint is creativity, not the shop.
RECA.lc — Mechanism Calculator
Community-built free tool
reca.lc
Web-based mechanism calculator (replaces the AMB Design Spreadsheet). Select a mechanism type (arm, elevator, flywheel, linear drive), input your constraints (motor, ratio, load, distance), and get performance predictions: speed, current draw, time-to-target. Essential for ratio selection before ordering any hardware.</figcaption></figure><figure class="slide" id="slide-38" data-thumb="thumbs/038.webp" style="--ar:1.7761"><div class="frame"><img src="slides/038.webp" width="1920" height="1081" loading="lazy" decoding="async" alt="Slide 38 of 38"></div><figcaption class="slide-text"><span class="slide-no">Slide 38</span>&quot;FIRST is more than robots.
