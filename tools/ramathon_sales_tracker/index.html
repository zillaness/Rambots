<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramathon Sales</title>
<style>
  :root {
    /* Rambots brand tokens (from src/styles.css) */
    --rb-red: #a31f36;
    --rb-red-700: #83182c;
    --rb-red-100: #f7e3e7;
    --rb-yellow: #f4a81c;
    --rb-yellow-100: #fef4de;
    --rb-ink: #1c1a1b;
    --rb-gray-700: #4a4446;
    --rb-gray-600: #635b5e;
    --rb-gray-500: #7c7477;
    --rb-gray-300: #cfc9cb;
    --rb-gray-200: #e5e1e2;
    --rb-gray-100: #f2eff0;
    --rb-gray-050: #faf8f8;
    --rb-paper: #ffffff;
    --rb-success: #2e7d4f;
    --rb-success-700: #1f5c39;
    --rb-font-sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
    --rb-shadow-sm: 0 1px 2px rgba(28, 26, 27, 0.08), 0 1px 3px rgba(28, 26, 27, 0.06);
    --rb-shadow-md: 0 4px 12px rgba(28, 26, 27, 0.10);
    --rb-shadow-lg: 0 12px 32px rgba(28, 26, 27, 0.14);

    --top-h: 76px;
    --panel-w: clamp(320px, 30vw, 460px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--rb-font-sans);
    color: var(--rb-ink);
    background: var(--rb-gray-100);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 4px solid var(--rb-yellow); outline-offset: 2px; }

  /* ---- Top bar ---------------------------------------------------------- */
  .top {
    height: var(--top-h);
    background: var(--rb-red);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;

  .brand span { color: #fff; font-weight: 500; letter-spacing: 0; }
  .station {

    font-size: 16px;
    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 20vw;
  }
  .spacer { flex: 1; }
  .tbtn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.65);
    color: #fff;
    border-radius: 12px;
    height: 54px;
    padding: 0 16px;
    font-size: 18px;
    font-weight: 700;
  }
  .undo {
    background: var(--rb-yellow);
    color: var(--rb-ink);

    height: 62px;

  .layout {

  /* ---- Home: one huge half per category -------------------------------- */

  .cat {

  /* ---- Category screen -------------------------------------------------- */
  .cat-head { display: flex; align-items: center; gap: 16px; }
  .back {
    height: 66px;
    padding: 0 26px;

  .items { flex: 1; display: grid; gap: 14px; min-height: 0; grid-auto-rows: 1fr; }
  .items.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .items.cols-1 { grid-template-columns: 1fr; }

  .item {

  .item .i-name { font-size: clamp(24px, 2.7vw, 46px); font-weight: 700; line-height: 1.1; }

  /* ---- Toast ------------------------------------------------------------ */
  .toast {
    position: fixed;
    left: 50%;

    font-weight: 700;
    padding: 18px 28px;
    border-radius: 16px;
    border: 4px solid var(--rb-ink);
    box-shadow: var(--rb-shadow-lg);
    width: max-content;
    max-width: min(92vw, 900px);
    text-align: center;
    background: #fff;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.undo { background: var(--rb-yellow); color: var(--rb-ink); }
  .toast.ok { background: var(--rb-success); color: #fff; border-color: var(--rb-success-700); }
  .toast.warn { background: var(--rb-red); color: #fff; border-color: var(--rb-red-700); }

    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 70;

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="assertive"></div>

<script>
'use strict';

/* ==========================================================================
   Items and prices. Edit this block to change prices or reuse the tracker
   at another event. "tiers" items price by quantity within one customer.
   ========================================================================== */
const CATEGORIES = [
  {
    id: 'clickers', name: 'Fidget Clickers', theme: 'yellow',
    hint: '1 = 4 tix · 2 = 7 · 3 = 10',
    items: [
      {
        id: 'clicker', name: 'Fidget clicker', style: 'accent',
        // price(n) = floor(n / 3) * 10 + [0, 4, 7][n % 3]  ->  4, 7, 10, 14, 17, 20 ...
        tiers: [0, 4, 7], bundle: { size: 3, price: 10 },
        priceText: 'Tap = +1 clicker',
        note: '1 = 4 tix · 2 = 7 · 3 = 10 · stacks: 4 = 14 · 5 = 17 · 6 = 20',
      },
    ],
  },
  {
    id: 'copters', name: 'Pull Copters', theme: 'red',
    hint: 'Full kit = 5 tix · add-ons 1 to 3',
    items: [
      { id: 'kit', name: 'Full kit', price: 5, style: 'primary', note: 'Launcher + propeller + ripcord' },
      { id: 'kit_toroidal', name: 'Kit w/ toroidal', price: 6, style: 'primary', note: 'Launcher + toroidal + ripcord' },
      { id: 'launcher', name: 'Launcher only', price: 3, style: 'outline', note: 'Rare: spares, group buys' },
      { id: 'propeller', name: 'Extra propeller', price: 1, style: 'accent' },
      { id: 'toroidal', name: 'Toroidal propeller', price: 2, style: 'accent' },
      { id: 'ripcord', name: 'Extra ripcord', price: 1, style: 'accent' },
    ],
  },
  {
    id: 'plinko', name: 'Plinko', theme: 'ink', defaultOn: false,
    hint: '1 tix per game',
    items: [
      { id: 'plinko', name: 'Plinko game', price: 1, style: 'ink' },
    ],
  },
];

const AGES = [
  { id: 'kid', label: 'Kid', sub: '12 and under' },
  { id: 'teen', label: 'Teen', sub: '13 to 17' },
  { id: 'adult', label: 'Adult', sub: '18+' },
];
const GENDERS = [
  { id: 'm', label: 'Male' },
  { id: 'f', label: 'Female' },
];

const STORAGE_KEY = 'rambots_ramathon_sales_v1';

/* ==========================================================================
   Lookups and pricing
   ========================================================================== */
const ITEMS = {};
CATEGORIES.forEach(cat => cat.items.forEach(it => { ITEMS[it.id] = Object.assign({ cat: cat.id }, it); }));
const catById = id => CATEGORIES.find(c => c.id === id);

function linePrice(itemId, qty) {
  const it = ITEMS[itemId];
  if (!it || qty <= 0) return 0;
  if (it.tiers) {
    const size = it.bundle.size;
    return Math.floor(qty / size) * it.bundle.price + it.tiers[qty % size];
  }
  return it.price * qty;
}
const customerTotal = c => c.lines.reduce((sum, l) => sum + linePrice(l.item, l.qty), 0);
const unitsOf = c => c.lines.reduce((sum, l) => sum + l.qty, 0);
const qtyOf = (c, itemId) => { const l = c && c.lines.find(x => x.item === itemId); return l ? l.qty : 0; };
const catUnits = (c, catId) => c ? c.lines.filter(l => ITEMS[l.item].cat === catId).reduce((s, l) => s + l.qty, 0) : 0;

/* ==========================================================================
   State, persistence, undo
   ========================================================================== */
let storageOK = true;
let otherTab = false;

function defaultState() {
  const cats = {};
  CATEGORIES.forEach(c => { cats[c.id] = c.defaultOn !== false; });
  return {
    settings: { station: 'Laptop 1', cats, demographics: true },
    customers: [],
    currentId: null,
    nextNo: 1,
    lastExport: null,
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    const base = defaultState();
    const savedSettings = saved.settings || {};
    const cats = Object.assign({}, base.settings.cats, savedSettings.cats || {});
    saved.settings = Object.assign({}, base.settings, savedSettings, { cats });
    return Object.assign(base, saved);
  } catch (e) {
    storageOK = false;
    return defaultState();
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
}

let state = load();
save();

const view = { screen: 'home', modal: null, pulse: null };
const undoStack = [];
const UNDO_LIMIT = 200;

function snapshot() {
  return JSON.stringify({ customers: state.customers, currentId: state.currentId, nextNo: state.nextNo });
}

// Every data change goes through commit() so it can be undone. fn returns the
// human description of the change, which the Undo button and toast show.
function commit(fn) {
  const snap = snapshot();
  const label = fn();
  if (!label) return null;
  undoStack.push({ snap, label });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  save();
  return label;
}

function undo() {
  const u = undoStack.pop();
  if (!u) { toast('Nothing to undo', 'info'); return; }
  Object.assign(state, JSON.parse(u.snap));
  view.pulse = null;
  save();
  render();
  toast('Undid: ' + u.label, 'undo');
}

const now = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const current = () => state.customers.find(c => c.id === state.currentId) || null;

function ensureCurrent() {
  let c = current();
  if (!c) {
    c = {
      id: uid(), no: state.nextNo++, station: state.settings.station,
      openedAt: now(), closedAt: null, lines: [], age: null, gender: null, voided: false,
    };
    state.customers.push(c);
    state.currentId = c.id;
  }
  return c;
}

/* ==========================================================================
   Actions
   ========================================================================== */
function addItem(itemId, n) {
  const it = ITEMS[itemId];
  const before = current() ? customerTotal(current()) : 0;
  commit(() => {
    const c = ensureCurrent();
    const line = c.lines.find(l => l.item === itemId);
    if (line) line.qty += n; else c.lines.push({ item: itemId, qty: n });
    return `+${n} ${it.name} (+${customerTotal(c) - before} tix)`;
  });
  view.pulse = itemId;
  render();
}

function removeOne(itemId) {
  const c = current();
  if (!c) return;
  const it = ITEMS[itemId];
  const before = customerTotal(c);
  commit(() => {
    const line = c.lines.find(l => l.item === itemId);
    if (!line) return null;
    line.qty -= 1;
    if (line.qty <= 0) c.lines = c.lines.filter(l => l !== line);
    return `−1 ${it.name} (−${before - customerTotal(c)} tix)`;
  });
  view.pulse = itemId;
  render();
}

function setQty(itemId, q) {
  const it = ITEMS[itemId];
  const old = qtyOf(current(), itemId);
  if (q === old) { render(); return; }
  commit(() => {
    const c = ensureCurrent();
    const line = c.lines.find(l => l.item === itemId);
    if (q <= 0) c.lines = c.lines.filter(l => l.item !== itemId);
    else if (line) line.qty = q;
    else c.lines.push({ item: itemId, qty: q });
    return `${it.name}: ${old} → ${q}`;
  });
  view.pulse = itemId;
  render();
}

function setDemo(field, val) {
  const c = current();
  if (!c || !c.lines.length) return;
  const list = field === 'age' ? AGES : GENDERS;
  const name = field === 'age' ? 'Age' : 'Gender';
  commit(() => {
    if (c[field] === val) { c[field] = null; return `${name} cleared`; }
    c[field] = val;
    return `${name}: ${list.find(x => x.id === val).label}`;
  });
  render();
}

function finish() {
  const c = current();
  if (!c || !c.lines.length) return;
  const total = customerTotal(c);
  commit(() => {
    c.closedAt = now();
    state.currentId = null;
    return `Finished customer #${c.no} (${total} tix)`;
  });
  view.screen = 'home';
  view.pulse = null;
  render();
  toast(`Customer #${c.no} saved · ${total} tix`, 'ok');
}

function setVoided(id, voided) {
  const c = state.customers.find(x => x.id === id);
  if (!c) return;
  const label = commit(() => {
    c.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} customer #${c.no}`;
  });
  render();
  toast(label + (voided ? ' · Undo brings it back' : ''), voided ? 'warn' : 'ok');
}

function clearAll() {
  commit(() => {
    state.customers = [];
    state.currentId = null;
    state.nextNo = 1;
    return 'Deleted all sales data';
  });
  view.modal = null;
  view.screen = 'home';
  render();
  toast('All sales deleted · Undo brings them back until you reload', 'warn');
}

/* ==========================================================================
   CSV export (one row per item line; merge laptops by stacking files)
   ========================================================================== */
function pad(n) { return String(n).padStart(2, '0'); }
function localStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function labelOf(list, id) { const x = list.find(v => v.id === id); return x ? x.label : ''; }

function buildCSV() {
  const header = ['station', 'customer_no', 'status', 'opened_at', 'closed_at', 'category', 'item',
    'qty', 'item_tickets', 'customer_total_tickets', 'age', 'gender'];
  const rows = [header];
  state.customers.forEach(c => {
    if (!c.lines.length) return;
    const status = c.voided ? 'voided' : (c.closedAt ? 'sold' : 'open');
    const total = customerTotal(c);
    c.lines.forEach(l => {
      const it = ITEMS[l.item];
      rows.push([c.station, c.no, status, localStamp(c.openedAt), localStamp(c.closedAt),
        catById(it.cat).name, it.name, l.qty, linePrice(l.item, l.qty), total,
        labelOf(AGES, c.age), labelOf(GENDERS, c.gender)]);
    });
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

function exportCSV() {
  const csv = buildCSV();
  const slug = (state.settings.station || 'station').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const d = new Date();
  const name = `ramathon_sales_${slug}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  state.lastExport = now();
  save();
  render();
  toast('Downloaded ' + name, 'ok');
}

/* ==========================================================================
   Rendering
   ========================================================================== */
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const enabledCats = () => CATEGORIES.filter(c => state.settings.cats[c.id]);
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

function render() {
  const cats = enabledCats();
  if (cats.length === 1) view.screen = cats[0].id;
  else if (view.screen !== 'home' && !cats.some(c => c.id === view.screen)) view.screen = 'home';
  const c = current();
  const main = view.screen === 'home' ? homeView(cats, c) : catView(catById(view.screen), c, cats.length > 1);
  app.innerHTML = topBar()
    + `<div class="layout"><main class="main">${main}</main>${panelView(c)}</div>`
    + modalView()
    + bannerView();
  view.pulse = null;
}

function topBar() {
  const last = undoStack[undoStack.length - 1];
  return `<header class="top">
    <div class="brand">RAMBOTS <span>Ramathon Sales</span></div>
    <div class="station" title="Station name (change in Settings)">${esc(state.settings.station)}</div>
    <div class="spacer"></div>
    <button class="tbtn" data-act="open" data-modal="totals">Totals</button>
    <button class="tbtn" data-act="open" data-modal="history">History</button>
    <button class="tbtn" data-act="open" data-modal="settings">Settings</button>
    <button class="undo" data-act="undo" title="Undo (Ctrl+Z)" ${last ? '' : 'disabled'}>
      <span class="u-main">↶ Undo</span>
      <span class="u-sub">${last ? esc(last.label) : 'Nothing to undo'}</span>
    </button>
  </header>`;
}

function homeView(cats, c) {
  return `<div class="home">${cats.map(cat => {
    const n = catUnits(c, cat.id);
    return `<button class="cat theme-${cat.theme}" data-act="cat" data-cat="${cat.id}">
      ${n ? `<span class="badge">${n} in this sale</span>` : ''}
      <span class="c-name">${esc(cat.name)}</span>
      <span class="c-hint">${esc(cat.hint)}</span>
      <span class="c-go">Tap to open</span>
    </button>`;
  }).join('')}</div>`;
}

function catView(cat, c, canBack) {
  const cols = cat.items.length >= 3 ? 'cols-3' : 'cols-1';
  return `<div class="cat-head">
      ${canBack ? '<button class="back" data-act="home">← Back</button>' : ''}
      <div class="cat-title">${esc(cat.name)}</div>
      <div class="spacer"></div>
      <div class="cat-tip">Tap = +1<br>"Type qty" = punch in a number</div>
    </div>
    <div class="items ${cols}">${cat.items.map(it => {
      const q = qtyOf(c, it.id);
      const priceText = it.priceText || `${it.price} tix`;
      return `<div class="tile">
        <button class="item style-${it.style}" data-act="add" data-item="${it.id}">
          ${q ? `<span class="badge">×${q} in sale</span>` : ''}
          <span class="i-name">${esc(it.name)}</span>
          <span class="i-price">${esc(priceText)}</span>
          ${it.note ? `<span class="i-note">${esc(it.note)}</span>` : ''}
        </button>
        <button class="typeqty" data-act="keypad" data-item="${it.id}"># Type qty</button>
      </div>`;
    }).join('')}</div>`;
}

function panelView(c) {
  const lines = c ? c.lines : [];
  const has = lines.length > 0;
  const total = c ? customerTotal(c) : 0;
  const units = c ? unitsOf(c) : 0;
  return `<aside class="panel" aria-label="Current customer">
    <div class="p-head">
      <div class="p-title">${c ? `Customer #${c.no}` : 'Next customer'}</div>
      <div class="p-sub">${has ? `${units} item${units === 1 ? '' : 's'} · tap a number to type` : ''}</div>
    </div>
    <div class="lines">${has ? lines.map(lineView).join('') : '<div class="empty">Tap an item to start a sale</div>'}</div>
    <div class="total"><span class="t-label">Collect</span><span class="t-val">${total} tix</span></div>
    ${state.settings.demographics ? demoView(c, has) : ''}
    <button class="done" data-act="finish" ${has ? '' : 'disabled'}>Done · Next customer<small>or press Enter</small></button>
  </aside>`;
}

function lineView(l) {
  const it = ITEMS[l.item];
  return `<div class="line${view.pulse === l.item ? ' pulse' : ''}">
    <div class="l-info">
      <div class="l-name">${esc(it.name)}</div>
      <div class="l-sub"><b>${linePrice(l.item, l.qty)} tix</b> · ${it.tiers ? 'tier price' : `${it.price} each`}</div>
    </div>
    <div class="l-ctl">
      <button class="step" data-act="minus" data-item="${l.item}" aria-label="Remove one ${esc(it.name)}">−</button>
      <button class="qty" data-act="keypad" data-item="${l.item}" title="Tap to type a quantity">${l.qty}</button>
      <button class="step" data-act="add" data-item="${l.item}" aria-label="Add one ${esc(it.name)}">+</button>
    </div>
  </div>`;
}

function demoView(c, enabled) {
  const chip = (field, opt) => `<button class="chip${c && c[field] === opt.id ? ' on' : ''}" data-act="demo"
      data-field="${field}" data-val="${opt.id}" ${enabled ? '' : 'disabled'}>${esc(opt.label)}${opt.sub ? `<small>${esc(opt.sub)}</small>` : ''}</button>`;
  return `<div class="demo">
    <div class="d-label">Optional · who is it for?</div>
    <div class="chips c3">${AGES.map(a => chip('age', a)).join('')}</div>
    <div class="chips c2">${GENDERS.map(g => chip('gender', g)).join('')}</div>
  </div>`;
}

function bannerView() {
  if (!storageOK) return '<div class="banner">NOT SAVING: this browser is blocking storage. Close this window and open the tracker in a normal (not private) window.</div>';
  if (otherTab) return '<div class="banner">The tracker is open in another tab or window. Close the extra one so sales are not lost.</div>';
  return '';
}

/* ---- Modals ------------------------------------------------------------ */
function modalView() {
  const m = view.modal;
  if (!m) return '';
  let inner = '';
  if (m.type === 'keypad') inner = keypadView(m);
  else if (m.type === 'totals') inner = totalsView();
  else if (m.type === 'history') inner = historyView();
  else if (m.type === 'settings') inner = settingsView();
  else if (m.type === 'confirmClear') inner = confirmClearView();
  return `<div class="overlay" data-act="overlay">${inner}</div>`;
}

function dialogHead(title) {
  return `<div class="d-head"><h2 class="d-title">${title}</h2><button class="close" data-act="close">Close</button></div>`;
}

function keypadView(m) {
  const it = ITEMS[m.item];
  const cur = qtyOf(current(), m.item);
  const q = m.value === '' ? null : parseInt(m.value, 10);
  const price = q == null ? `Currently ${cur} in this sale` : (q === 0 ? 'Removes it from this sale' : `= ${linePrice(m.item, q)} tix`);
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
  return `<div class="dialog narrow" role="dialog" aria-label="Type quantity">
    ${dialogHead('How many ' + esc(it.name) + '?')}
    <div class="kp-display${q == null ? ' placeholder' : ''}">${q == null ? cur : q}</div>
    <div class="kp-price">${esc(price)}</div>
    <div class="keypad">${keys.map(k => {
      const label = k === 'clear' ? 'Clear' : (k === 'back' ? '⌫' : k);
      return `<button class="key${k === 'clear' ? ' small' : ''}" data-act="key" data-key="${k}">${label}</button>`;
    }).join('')}</div>
    <div class="row">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="kpset" ${q == null ? 'disabled' : ''}>Set to ${q == null ? '...' : q}</button>
    </div>
  </div>`;
}

function computeTotals() {
  const sold = state.customers.filter(c => c.closedAt && !c.voided && c.lines.length);
  const byItem = {};
  let tix = 0;
  sold.forEach(c => {
    c.lines.forEach(l => {
      const b = byItem[l.item] || (byItem[l.item] = { units: 0, tix: 0 });
      b.units += l.qty;
      b.tix += linePrice(l.item, l.qty);
    });
    tix += customerTotal(c);
  });
  return { sold, byItem, tix };
}

function totalsView() {
  const { sold, byItem, tix } = computeTotals();
  const open = current();
  const catRows = CATEGORIES.map(cat => {
    const rows = cat.items.filter(it => byItem[it.id]);
    if (!rows.length) return '';
    let u = 0, t = 0;
    const body = rows.map(it => {
      const b = byItem[it.id]; u += b.units; t += b.tix;
      return `<tr><td>${esc(it.name)}</td><td class="num">${b.units}</td><td class="num">${b.tix}</td></tr>`;
    }).join('');
    return body + `<tr class="sub"><td>${esc(cat.name)} total</td><td class="num">${u}</td><td class="num">${t}</td></tr>`;
  }).join('');

  const usedCats = CATEGORIES.filter(cat => cat.items.some(it => byItem[it.id]));
  const demoTable = (title, list, field) => {
    const groups = list.map(o => ({ id: o.id, label: o.label })).concat([{ id: null, label: 'Not tagged' }]);
    const body = groups.map(g => {
      const cs = sold.filter(c => (c[field] || null) === g.id);
      if (!cs.length) return '';
      const cells = usedCats.map(cat => `<td class="num">${cs.reduce((s, c) => s + catUnits(c, cat.id), 0)}</td>`).join('');
      return `<tr><td>${esc(g.label)}</td><td class="num">${cs.length}</td>${cells}<td class="num">${cs.reduce((s, c) => s + customerTotal(c), 0)}</td></tr>`;
    }).join('');
    return `<h3>${title}</h3><table><thead><tr><th>${title}</th><th class="num">Customers</th>${usedCats.map(cat => `<th class="num">${esc(cat.name)}</th>`).join('')}<th class="num">Tix</th></tr></thead><tbody>${body}</tbody></table>`;
  };

  return `<div class="dialog" role="dialog" aria-label="Totals">
    ${dialogHead('Totals · ' + esc(state.settings.station))}
    <div class="big-stats">
      <div class="stat"><div class="s-val">${tix}</div><div class="s-label">Tickets that should be in the box</div></div>
      <div class="stat"><div class="s-val">${sold.length}</div><div class="s-label">Customers</div></div>
    </div>
    ${open && open.lines.length ? `<p class="note">Not counted yet: customer #${open.no} in progress (${customerTotal(open)} tix).</p>` : ''}
    ${sold.length ? `<table><thead><tr><th>Item</th><th class="num">Units</th><th class="num">Tix</th></tr></thead><tbody>${catRows}</tbody></table>
      ${demoTable('Age', AGES, 'age')}
      ${demoTable('Gender', GENDERS, 'gender')}` : '<p class="note">No finished sales yet.</p>'}
    <p class="note">Last export: ${state.lastExport ? fmtTime(state.lastExport) : 'never'}. Export every hour or so as a backup.</p>
    <div class="row"><button class="btn go" data-act="export">Download CSV</button></div>
  </div>`;
}

function historyView() {
  const list = state.customers.filter(c => c.lines.length).slice().reverse();
  const rows = list.map(c => {
    const items = c.lines.map(l => `${ITEMS[l.item].name} ×${l.qty}`).join(', ');
    const tags = [labelOf(AGES, c.age), labelOf(GENDERS, c.gender)].filter(Boolean).join(' · ');
    const isOpen = !c.closedAt;
    const btn = isOpen ? '<span class="note">in progress</span>'
      : (c.voided ? `<button class="btn slim" data-act="restore" data-id="${c.id}">Restore</button>`
        : `<button class="btn slim" data-act="void" data-id="${c.id}">Void</button>`);
    return `<div class="h-row${c.voided ? ' voided' : ''}${isOpen ? ' open' : ''}">
      <div class="h-main">
        <div class="h-top">#${c.no} · ${fmtTime(c.closedAt || c.openedAt)}${tags ? ' · ' + esc(tags) : ''}${c.voided ? ' · VOIDED' : ''}</div>
        <div class="h-items">${esc(items)}</div>
      </div>
      <div class="h-tix">${customerTotal(c)} tix</div>
      ${btn}

  return `<div class="dialog" role="dialog" aria-label="History">
    ${dialogHead('History')}
    <p class="note">Newest first. Void removes a sale from the totals (Undo or Restore brings it back).</p>
    <div class="hist">${rows || '<p class="note">No sales yet.</p>'}</div>
  </div>`;
}

function settingsView() {
  const s = state.settings;
  const n = state.customers.filter(c => c.lines.length).length;
  return `<div class="dialog" role="dialog" aria-label="Settings">
    ${dialogHead('Settings')}
    <div class="field">
      <label for="station-input">Station name (shows on every exported row)</label>
      <input id="station-input" value="${esc(s.station)}" maxlength="40" autocomplete="off">

      <div class="f-label">Data on this laptop</div>

function confirmClearView() {
  const n = state.customers.filter(c => c.lines.length).length;
  return `<div class="dialog narrow" role="dialog" aria-label="Confirm delete">

    <p class="note" style="font-size:19px">This removes all ${n} customers from this laptop. Download the CSV first. Undo can bring them back only until the page is reloaded.</p>
    <div class="row">
      <button class="btn" data-act="open" data-modal="settings">Cancel</button>
      <button class="btn danger" data-act="clear">Delete all ${n}</button>
    </div>

/* ==========================================================================
   Toast
   ========================================================================== */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (kind || 'info');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast ' + (kind || 'info'); }, kind === 'undo' ? 4500 : 3000);
}

/* ==========================================================================
   Input handling
   ========================================================================== */
function keypadPress(k) {
  const m = view.modal;
  if (!m || m.type !== 'keypad') return;
  if (k === 'back') m.value = m.value.slice(0, -1);
  else if (k === 'clear') m.value = '';
  else if (m.value.length < 3) m.value = (m.value + k).replace(/^0+(?=\d)/, '');
  render();
}

function keypadSet() {
  const m = view.modal;
  if (!m || m.type !== 'keypad' || m.value === '') return;
  const q = parseInt(m.value, 10);
  view.modal = null;
  setQty(m.item, q);
}

const actions = {
  undo,
  home: () => { view.screen = 'home'; render(); },
  cat: d => { view.screen = d.cat; render(); },
  add: d => addItem(d.item, 1),
  minus: d => removeOne(d.item),
  keypad: d => { view.modal = { type: 'keypad', item: d.item, value: '' }; render(); },
  key: d => keypadPress(d.key),
  kpset: keypadSet,
  finish,
  demo: d => setDemo(d.field, d.val),
  open: d => { view.modal = { type: d.modal }; render(); },
  close: () => { view.modal = null; render(); },
  overlay: () => { view.modal = null; render(); },
  void: d => setVoided(d.id, true),
  restore: d => setVoided(d.id, false),
  export: exportCSV,
  clearask: () => { view.modal = { type: 'confirmClear' }; render(); },
  clear: clearAll,
  togglecat: d => {
    const cats = state.settings.cats;
    if (cats[d.cat] && enabledCats().length === 1) { toast('Keep at least one thing on sale', 'warn'); return; }
    cats[d.cat] = !cats[d.cat];
    save();
    render();
  },
  toggledemo: () => { state.settings.demographics = !state.settings.demographics; save(); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.act === 'overlay' && e.target !== el) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el.dataset);
  // Drop focus so a stray Enter/Space never re-fires the last button.
  if (document.activeElement && document.activeElement !== document.body
      && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
});

document.addEventListener('change', e => {
  if (e.target.id === 'station-input') {
    state.settings.station = e.target.value.trim() || 'Station';
    const c = current();
    if (c && !c.closedAt) c.station = state.settings.station;
    save();
    render();
    toast('Station name saved', 'ok');
  }
});

document.addEventListener('keydown', e => {
  const inField = e.target.matches && e.target.matches('input, textarea, select');
  const m = view.modal;

  if (m && m.type === 'keypad') {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keypadPress(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); keypadPress('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); keypadSet(); }
    else if (e.key === 'Escape') { e.preventDefault(); actions.close(); }
    return;
  }
  if (inField) {
    if (e.key === 'Enter') e.target.blur();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (m) actions.close();
    else if (view.screen !== 'home') actions.home();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    // Enter finishes the sale; Space does nothing (stops accidental re-clicks).
    e.preventDefault();
    if (e.key === 'Enter' && !m) finish();
  }
});

// Two tabs on one laptop would overwrite each other's sales. Follow the other
// tab's saves and warn loudly.
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try {
    state = Object.assign(defaultState(), JSON.parse(e.newValue));
    otherTab = true;
    render();
  } catch (err) { /* ignore malformed */ }
});

render();
</script>
