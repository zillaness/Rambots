<!doctype html>
<!--

  description: Huge-button, offline tracker for the Rambots Ram-a-thon booths: Clickers (per-design photo buttons) and Copters sales with cash-sale marking and free-card-with-purchase reminders, Balloon Battle queue and matches, Prize Table card redemptions, walk-offs.
  ai_update: Update last_updated and version. Keep the filename index.html so volunteers' links never break. Append a changelog entry at the bottom.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ramathon Sales</title>
<style>
  :root {
    /* Rambots brand tokens (from src/styles.css) */
    --rb-red: #a31f36;
    --rb-red-700: #83182c;
    --rb-red-100: #f7e3e7;
    --rb-yellow: #f4a81c;
    --rb-yellow-100: #fef4de;
    --rb-ink: #1c1a1b;
    --rb-gray-700: #4a4446;
    --rb-gray-600: #635b5e;
    --rb-gray-500: #7c7477;
    --rb-gray-300: #cfc9cb;
    --rb-gray-200: #e5e1e2;
    --rb-gray-100: #f2eff0;
    --rb-gray-050: #faf8f8;
    --rb-paper: #ffffff;
    --rb-success: #2e7d4f;
    --rb-success-700: #1f5c39;
    --rb-font-sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
    --rb-shadow-sm: 0 1px 2px rgba(28, 26, 27, 0.08), 0 1px 3px rgba(28, 26, 27, 0.06);
    --rb-shadow-md: 0 4px 12px rgba(28, 26, 27, 0.10);
    --rb-shadow-lg: 0 12px 32px rgba(28, 26, 27, 0.14);

    --top-h: 76px;
    --panel-w: clamp(320px, 30vw, 460px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--rb-font-sans);
    color: var(--rb-ink);
    background: var(--rb-gray-100);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 4px solid var(--rb-yellow); outline-offset: 2px; }

  /* ---- Top bar ---------------------------------------------------------- */
  .top {
    height: var(--top-h);
    background: var(--rb-red);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .brand { font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: var(--rb-yellow); white-space: nowrap; }
  .brand span { color: #fff; font-weight: 500; letter-spacing: 0; }
  .station {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 20vw;
  }
  .spacer { flex: 1; }
  .tbtn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.65);
    color: #fff;
    border-radius: 12px;
    height: 54px;
    padding: 0 16px;
    font-size: 18px;
    font-weight: 700;
  }
  .undo {
    background: var(--rb-yellow);
    color: var(--rb-ink);
    border: 0;
    border-radius: 12px;
    height: 62px;
    width: 250px;
    padding: 4px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }
  .undo .u-main { font-size: 23px; font-weight: 700; }
  .undo .u-sub { font-size: 13px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Layout ----------------------------------------------------------- */
  .layout {
    display: grid;
    grid-template-columns: 1fr var(--panel-w);
    height: calc(100vh - var(--top-h));
    height: calc(100dvh - var(--top-h));
  }
  .main { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }

  /* ---- Home: one huge tile per booth ----------------------------------- */
  .home { flex: 1; display: grid; gap: 16px; grid-auto-flow: column; grid-auto-columns: 1fr; min-height: 0; }
  .cat {
    border: 0;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    box-shadow: var(--rb-shadow-md);
    position: relative;
    text-align: center;
  }
  .cat .c-name { font-size: clamp(30px, 4.6vw, 84px); font-weight: 700; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
  .cat .c-name.long { font-size: clamp(24px, 3vw, 56px); }
  .cat .c-photo { width: 100%; flex: 1; min-height: 0; max-height: 55%; border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
  .cat .c-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cat .c-photo.contain { background: #fff; }
  .cat .c-photo.contain img { object-fit: contain; }
  .cat .c-hint { font-size: clamp(15px, 1.7vw, 26px); font-weight: 500; }
  .cat .c-go { font-size: clamp(14px, 1.4vw, 20px); opacity: 0.85; }
  .theme-red { background: var(--rb-red); color: #fff; }
  .theme-yellow { background: var(--rb-yellow); color: var(--rb-ink); }
  .theme-ink { background: var(--rb-ink); color: #fff; }
  .theme-paper { background: #fff; color: var(--rb-red); box-shadow: inset 0 0 0 5px var(--rb-red), var(--rb-shadow-md); }
  .cat:active, .item:active, .start:active, .pop:active { transform: scale(0.985); }
  .badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: #fff;
    color: var(--rb-ink);
    border: 2px solid var(--rb-ink);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 18px;
    font-weight: 700;
  }

  /* ---- Category screen -------------------------------------------------- */
  .cat-head { display: flex; align-items: center; gap: 16px; }
  .back {
    height: 66px;
    padding: 0 26px;
    border-radius: 14px;
    border: 3px solid var(--rb-ink);
    background: #fff;
    font-size: 26px;
    font-weight: 700;
  }
  .cat-title { font-size: 32px; font-weight: 700; }
  .cat-tip { font-size: 15px; color: var(--rb-gray-600); text-align: right; }
  .walkoff-btn {
    height: 66px;
    padding: 0 18px;
    border-radius: 14px;
    border: 3px dashed var(--rb-gray-500);
    background: transparent;
    font-size: 18px;
    font-weight: 700;
    color: var(--rb-gray-700);
  }
  .items { flex: 1; display: grid; gap: 14px; min-height: 0; grid-auto-rows: 1fr; }
  .items.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .items.cols-1 { grid-template-columns: 1fr; }
  .tile { position: relative; min-height: 0; display: flex; }
  .item {
    flex: 1;
    min-height: 0;
    border-radius: 20px;
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 18px 62px;
    text-align: center;
    box-shadow: var(--rb-shadow-md);
    position: relative;
  }
  .item .i-name { font-size: clamp(24px, 2.7vw, 46px); font-weight: 700; line-height: 1.1; }
  .item .i-price { font-size: clamp(22px, 2.3vw, 38px); font-weight: 700; }
  .item .i-note { font-size: clamp(14px, 1.2vw, 19px); opacity: 0.88; }
  .items.cols-1 .i-name { font-size: clamp(40px, 6vw, 100px); }
  .items.cols-1 .i-price { font-size: clamp(26px, 3vw, 48px); }
  .items.cols-1 .i-note { font-size: clamp(16px, 1.6vw, 24px); }
  .style-primary { background: var(--rb-red); color: #fff; }
  .style-outline { background: #fff; color: var(--rb-red); box-shadow: inset 0 0 0 5px var(--rb-red), var(--rb-shadow-md); }
  .style-accent { background: var(--rb-yellow); color: var(--rb-ink); }
  .style-ink { background: var(--rb-ink); color: #fff; }
  .items.photos { grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 12px; }
  .photo-item { padding: 8px 8px 10px; gap: 6px; justify-content: flex-start; background: var(--rb-yellow); color: var(--rb-ink); }
  .photo-item .ph {
    flex: 1;
    min-height: 0;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-none { font-size: clamp(36px, 4.5vw, 72px); font-weight: 700; color: var(--rb-gray-300); }
  .photo-item .i-name { font-size: clamp(16px, 1.6vw, 26px); line-height: 1.1; }
  .photo-item .badge { top: 10px; left: 10px; z-index: 1; }
  .photo-item .i-cards { font-size: clamp(16px, 1.6vw, 26px); font-weight: 700; color: var(--rb-red); }
  .prize-item { background: #fff; box-shadow: inset 0 0 0 4px var(--rb-red), var(--rb-shadow-md); }
  .stock {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 16px;
    font-weight: 700;
    background: #fff;
    color: var(--rb-ink);
    border: 2px solid var(--rb-ink);
  }
  .stock.low { background: var(--rb-red); color: #fff; border-color: var(--rb-red); }
  .stock.out { background: var(--rb-ink); color: #fff; }
  /* Sales prompts stay small: one summary line, one Ask line, one row of buttons. */
  .group-row {
    font-size: 15px;
    font-weight: 700;
    background: var(--rb-yellow-100);
    border: 2px solid var(--rb-yellow);
    border-radius: 10px;
    padding: 4px 10px;
  }
  .g-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .g-top small { font-size: 13px; font-weight: 600; color: var(--rb-gray-700); }
  .g-nudge { font-size: 14px; font-weight: 700; color: var(--rb-red); margin-top: 2px; }
  .ask { background: var(--rb-red-100); border: 2px solid var(--rb-red); border-radius: 10px; padding: 5px 10px; }
  .ask-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 700; color: var(--rb-red-700); }
  .ask-text { font-size: 13px; color: var(--rb-gray-700); margin-top: 2px; }
  .ask-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .askbtn {
    flex: 1 1 auto;
    min-height: 38px;
    padding: 0 8px;
    border-radius: 8px;
    border: 2px solid var(--rb-red);
    background: #fff;
    color: var(--rb-red);
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .whybtn { border: 0; background: none; padding: 0; color: var(--rb-red-700); font-size: 13px; font-weight: 600; text-decoration: underline; white-space: nowrap; }
  .cat-copters { background: var(--rb-red); color: #fff; }
  .cat-copters .i-cards { color: var(--rb-yellow); }
  .photo-item .i-note { font-size: clamp(12px, 1.05vw, 15px); opacity: 0.9; }
  .pace {
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    padding: 4px 12px;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    line-height: 1.15;
    max-width: 30vw;
  }
  .pace .pc-main { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .pace .pc-sub { font-size: 13px; white-space: nowrap; color: inherit; opacity: 0.92; }
  .pace.ahead { background: var(--rb-success); }
  .pace.behind { background: var(--rb-yellow); color: var(--rb-ink); }
  td.good { color: var(--rb-success); font-weight: 700; }
  td.bad { color: var(--rb-red); font-weight: 700; }
  table.stats tr.sec td { font-weight: 700; background: var(--rb-gray-050); border-top: 2px solid var(--rb-gray-300); }
  ul.files { margin: 0 0 8px; padding-left: 20px; font-size: 15px; }
  .typeqty {
    position: absolute;
    right: 12px;
    bottom: 12px;
    height: 46px;
    padding: 0 16px;
    border-radius: 10px;
    border: 2px solid var(--rb-ink);
    background: #fff;
    color: var(--rb-ink);
    font-size: 17px;
    font-weight: 700;
  }

  /* ---- Right panel (current customer, or Battle queue) ----------------- */
  .panel {
    background: #fff;
    border-left: 1px solid var(--rb-gray-200);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: auto;
    padding: 16px;
    gap: 12px;
  }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .p-title { font-size: 24px; font-weight: 700; white-space: nowrap; }
  .p-sub { color: var(--rb-gray-600); font-size: 15px; text-align: right; }
  .p-right { display: flex; align-items: center; gap: 8px; }
  .cashbtn { min-width: 44px; height: 40px; border-radius: 10px; border: 2px solid var(--rb-gray-300); background: #fff; font-size: 22px; line-height: 1; padding: 0 6px; opacity: 0.55; }
  .cashbtn.on { border-color: var(--rb-success); background: var(--rb-success); opacity: 1; }
  .cashbtn:disabled { opacity: 0.25; cursor: default; }
  .lines { flex: 1; overflow: auto; min-height: 70px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--rb-gray-500); font-size: 20px; text-align: center; margin: auto; padding: 16px; }
  .line {
    border: 2px solid var(--rb-gray-200);
    border-radius: 14px;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .line.pulse { animation: pulse 600ms ease-out; }
  @keyframes pulse { from { background: var(--rb-yellow-100); border-color: var(--rb-yellow); } to { background: #fff; } }
  .l-info { min-width: 0; }
  .l-name { font-size: 18px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .l-sub { font-size: 15px; color: var(--rb-gray-600); margin-top: 2px; }
  .l-sub b { color: var(--rb-red); font-size: 17px; }
  .l-ctl { display: flex; align-items: center; gap: 6px; }
  .step {
    width: 52px;
    height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-gray-300);
    background: var(--rb-gray-050);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }
  .step.sm { width: 46px; height: 46px; font-size: 24px; }
  .qty {
    min-width: 64px;
    height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-ink);
    background: #fff;
    font-size: 26px;
    font-weight: 700;
  }
  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px solid var(--rb-ink); padding-top: 10px; }
  .t-label { font-size: 22px; font-weight: 700; }
  .t-val { font-size: 46px; font-weight: 700; color: var(--rb-red); }
  .t-val.cash { color: var(--rb-success-700); }
  .bonus { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: var(--rb-yellow-100); border: 2px solid var(--rb-yellow); border-radius: 10px; padding: 3px 10px; margin-top: -6px; }
  .bonus-title { font-size: 16px; font-weight: 700; }
  .bonus-text { font-size: 13px; font-weight: 600; color: var(--rb-gray-700); white-space: nowrap; }
  .box-split { margin-top: -6px; display: flex; flex-direction: column; gap: 2px; font-size: 17px; color: var(--rb-gray-700); }
  .box-split div { display: flex; justify-content: space-between; }
  .box-split b { color: var(--rb-ink); }
  .demo { display: flex; flex-direction: column; gap: 6px; }
  .demo .chip { min-height: 40px; font-size: 16px; }
  .d-label { font-size: 14px; font-weight: 700; color: var(--rb-gray-600); text-transform: uppercase; letter-spacing: 0.04em; }
  .chips { display: grid; gap: 8px; }
  .chips.c2 { grid-template-columns: repeat(2, 1fr); }
  .chips.c3 { grid-template-columns: repeat(3, 1fr); }
  .chips.c4 { grid-template-columns: repeat(4, 1fr); }
  .chips.c5 { grid-template-columns: repeat(5, 1fr); }
  .chip {
    min-height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-gray-300);
    background: #fff;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
    padding: 4px;
  }
  .chip small { display: block; font-size: 12px; font-weight: 500; color: var(--rb-gray-600); }
  .chip.on { background: var(--rb-ink); color: #fff; border-color: var(--rb-ink); }
  .chip.on small { color: #fff; }
  .chip.sm { min-height: 44px; font-size: 15px; }
  .done {
    min-height: 92px;
    border-radius: 16px;
    border: 0;
    background: var(--rb-success);
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
  }
  .done small { display: block; font-size: 14px; font-weight: 500; opacity: 0.9; }

  /* ---- Balloon Battle -------------------------------------------------- */
  .arena { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .now { background: #fff; border-radius: 20px; box-shadow: var(--rb-shadow-md); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .now.fill { flex: 1; min-height: 0; }
  .now-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .now-title { font-size: 28px; font-weight: 700; }
  .timer { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--rb-red); }
  .players { flex: 1; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); min-height: 0; }
  .pcard { border: 3px solid var(--rb-ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .pname { font-size: clamp(28px, 3.2vw, 50px); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  .ptix { font-size: 20px; color: var(--rb-gray-700); }
  .ptix b { color: var(--rb-red); }
  .wrow { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .wrow .wcount { font-size: 30px; min-width: 36px; text-align: center; }
  .huge {
    min-height: 96px;
    border-radius: 18px;
    border: 0;
    font-size: clamp(24px, 2.6vw, 36px);
    font-weight: 700;
    line-height: 1.15;
    padding: 10px 16px;
  }
  .huge small { display: block; font-size: 16px; font-weight: 500; opacity: 0.92; }
  .huge.go { background: var(--rb-success); color: #fff; }
  .huge.red { background: var(--rb-red); color: #fff; }
  .huge.yellow { background: var(--rb-yellow); color: var(--rb-ink); }
  .linkbtn { background: none; border: 0; color: var(--rb-gray-600); font-size: 16px; text-decoration: underline; align-self: center; padding: 8px 12px; }
  .prompt { font-size: clamp(24px, 2.6vw, 38px); font-weight: 700; text-align: center; }
  .pops { flex: 1; display: grid; gap: 14px; min-height: 0; }
  .pops.fit { flex: 1 0 auto; }
  .prompt.sm { font-size: clamp(18px, 1.8vw, 26px); font-weight: 600; text-align: left; }
  .pops.c2 { grid-template-columns: repeat(2, 1fr); }
  .pops.c3 { grid-template-columns: repeat(3, 1fr); }
  .pops.c4 { grid-template-columns: repeat(4, 1fr); }
  .pop {
    border-radius: 18px;
    border: 0;
    background: var(--rb-yellow);
    color: var(--rb-ink);
    font-size: clamp(48px, 7vw, 110px);
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 150px;
    line-height: 1;
    box-shadow: var(--rb-shadow-md);
  }
  .pop small { font-size: clamp(16px, 1.6vw, 24px); font-weight: 600; }
  .pop.win { background: var(--rb-red); color: #fff; font-size: clamp(32px, 4vw, 64px); }
  .pop.sm { min-height: 92px; font-size: clamp(36px, 4vw, 60px); }
  .pop.on { background: var(--rb-ink); color: #fff; }
  .pvp-row { display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 14px; align-items: center; }
  .pvp-name { font-size: clamp(22px, 2.2vw, 32px); font-weight: 700; overflow-wrap: anywhere; }
  .pvp-preview { font-size: 22px; font-weight: 700; text-align: center; color: var(--rb-red); min-height: 30px; }
  .pop.ko { background: var(--rb-gray-100); color: var(--rb-gray-600); }
  .pop.outcome { font-size: clamp(22px, 2.4vw, 36px); padding: 10px; text-align: center; line-height: 1.1; min-height: 120px; }
  .pop.outcome small { font-size: clamp(14px, 1.3vw, 19px); }
  .payout-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; }
  .pb { border-radius: 999px; padding: 4px 12px; background: #fff; border: 2px solid var(--rb-gray-300); }
  .pb small { color: var(--rb-gray-600); }
  .pb.good { border-color: var(--rb-success); }

/* ==========================================================================
   Lookups and pricing
   ========================================================================== */
const ITEMS = {};
CATEGORIES.filter(c => c.items).forEach(cat => cat.items.forEach(it => { ITEMS[it.id] = Object.assign({ cat: cat.id }, it); }));
const catById = id => CATEGORIES.find(c => c.id === id);

function groupPrice(groupId, n) {
  const g = PRICE_GROUPS[groupId];
  if (n <= 0) return 0;
  return Math.floor(n / g.bundle.size) * g.bundle.price + g.tiers[n % g.bundle.size];
}

// Prize card price: the Settings override if set, else the PRIZES default.
function cardsFor(itemId) {
  const o = state.settings.prizes[itemId];
  return o && Number.isFinite(o.cards) ? o.cards : ITEMS[itemId].cards;
}
const isPrize = itemId => ITEMS[itemId].cards != null;
const kindOf = itemId => (isPrize(itemId) ? 'trade' : 'sale');
// A prize line remembers its card price, so editing it later never rewrites past trades.
const newLine = (itemId, qty) => (isPrize(itemId) ? { item: itemId, qty, unit: cardsFor(itemId) } : { item: itemId, qty });

// Price of qty of one item bought on its own (group items use the tier price;
// prizes are priced in cards).
function linePrice(itemId, qty) {
  const it = ITEMS[itemId];
  if (!it || qty <= 0) return 0;
  if (it.cards != null) return cardsFor(itemId) * qty;
  return it.group ? groupPrice(it.group, qty) : it.price * qty;
}

// Tickets per line for one customer. Group items share the tier price: each
// line gets the extra tickets it adds on top of the lines before it, so the
// lines always add up to the customer's total.
function lineTixList(c) {
  const sofar = {};
  return c.lines.map(l => {
    const it = ITEMS[l.item];
    if (l.unit != null) return l.unit * l.qty;
    if (!it.group) return it.price * l.qty;
    const before = sofar[it.group] || 0;
    sofar[it.group] = before + l.qty;
    return groupPrice(it.group, before + l.qty) - groupPrice(it.group, before);
  });
}
const customerTotal = c => lineTixList(c).reduce((sum, t) => sum + t, 0);
const unitsOf = c => c.lines.reduce((sum, l) => sum + l.qty, 0);
const qtyOf = (c, itemId) => { const l = c && c.lines.find(x => x.item === itemId); return l ? l.qty : 0; };
const groupUnits = (c, groupId) => c ? c.lines.filter(l => ITEMS[l.item].group === groupId).reduce((s, l) => s + l.qty, 0) : 0;
const catUnits = (c, catId) => c ? c.lines.filter(l => ITEMS[l.item].cat === catId).reduce((s, l) => s + l.qty, 0) : 0;
function catTix(c, catId) {
  if (!c) return 0;
  const tix = lineTixList(c);
  return c.lines.reduce((s, l, i) => s + (ITEMS[l.item].cat === catId ? tix[i] : 0), 0);
}

/* ==========================================================================
   State, persistence, undo

let storageOK = true;
let otherTab = false;

function defaultState() {
  const cats = {};
  CATEGORIES.forEach(c => { cats[c.id] = c.defaultOn !== false; });
  return {
    settings: {
      station: 'Laptop 1', cats, demographics: true, battle: Object.assign({}, BATTLE_DEFAULTS), prizes: {},
      stock: Object.assign({}, STOCK_DEFAULTS),
      goals: Object.assign({}, GOAL_DEFAULTS), event: Object.assign({}, EVENT_DEFAULTS), showPace: true,
      cardEvery: BONUS_CARD_EVERY,
      laptopId: Math.random().toString(36).slice(2, 6),
    },
    customers: [], currentId: null, nextNo: 1, tradeId: null, nextTradeNo: 1,
    walkoffs: [], nextWalkoffNo: 1,
    backorders: [], nextBackorderNo: 1,
    queue: [], matches: [], matchId: null, lastMatchId: null, nextMatchNo: 1,
    lastExport: null,
  };
}

function hydrate(raw) {
  const base = defaultState();
  if (!raw) return base;
  const saved = JSON.parse(raw);
  const ss = saved.settings || {};
  saved.settings = Object.assign({}, base.settings, ss, {
    cats: Object.assign({}, base.settings.cats, ss.cats || {}),
    battle: Object.assign({}, base.settings.battle, ss.battle || {}, {
      outcomeCards: Object.assign({}, BATTLE_DEFAULTS.outcomeCards, (ss.battle && ss.battle.outcomeCards) || {}),
    }),
    prizes: Object.assign({}, ss.prizes || {}),
    goals: Object.assign({}, base.settings.goals, ss.goals || {}),
    stock: Object.assign({}, base.settings.stock, ss.stock || {}),
    event: Object.assign({}, base.settings.event, ss.event || {}),
  });
  const merged = Object.assign(base, saved);
  // Until someone picks a tie rule on this laptop, follow the current default.
  if (!merged.settings.battle.pvpTieSet) merged.settings.battle.pvpTie = BATTLE_DEFAULTS.pvpTie;
  // v1.7: weapons unlock once; rematch price follows the default until someone edits it.
  const bt = merged.settings.battle;
  bt.weaponPrices = Object.assign({}, BATTLE_DEFAULTS.weaponPrices, (ss.battle && ss.battle.weaponPrices) || {});
  if (!bt.rematchSet) bt.rematch = BATTLE_DEFAULTS.rematch;
  delete bt.weapon;
  // v1.7: the queue is paid matches; the old name-only queue (practice data) is dropped.
  merged.queue = [];
  merged.matches.forEach(m => {
    if (!m.paidAt) m.paidAt = m.startedAt;
    if (m.qpos == null) m.qpos = 0;
    if (m.status === 'playing' && m.goAt && m.runAt === undefined) { m.leftMs = (m.limitSec || bt.matchSeconds) * 1000; m.runAt = m.goAt; }
  });
  // An item removed or renamed in the config would otherwise break saved data
  // on this laptop: an old clicker design counts as "Other design"; anything
  // else that no longer exists (e.g. Plinko) is dropped.
  const fix = id => (ITEMS[id] ? id : (String(id).startsWith('clicker') ? 'clicker' : null));
  merged.customers.forEach(c => {
    c.lines.forEach(l => { l.item = fix(l.item); });
    c.lines = c.lines.filter(l => l.item);
  });
  merged.walkoffs.forEach(w => { w.item = fix(w.item); });
  merged.walkoffs = merged.walkoffs.filter(w => w.item);
  return merged;
}

function load() {
  try {
    return hydrate(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    storageOK = false;
    return defaultState();
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
}

// this laptop to its booth so nobody has to touch Settings on the day. Each

  battle: { cats: ['battle'], station: 'Balloon Battle' },
  prizes: { cats: ['prizes'], station: 'Prize Table' },
};

const STORAGE_KEY = preset ? `${STORAGE_BASE}_${boothParam}` : STORAGE_BASE;

function applyPreset() {
  if (!preset) return;
  Object.keys(state.settings.cats).forEach(id => { state.settings.cats[id] = preset.cats.includes(id); });
  if (state.settings.station === 'Laptop 1') state.settings.station = preset.station;

const blankPlayerDraft = () => ({ name: '', w: {}, age: null, gender: null });
const blankDraft = () => ({ mode: 'house', players: [blankPlayerDraft(), blankPlayerDraft()] });
const view = { screen: 'home', modal: null, pulse: null, pvpPops: [null, null], qDraft: blankDraft(), focusName: false, rmWho: 'both',
  combine: { files: [], plinko: '' } };
const undoStack = [];
const UNDO_LIMIT = 200;

function snapshot() {
  const snap = {};
  DATA_KEYS.forEach(k => { snap[k] = state[k]; });
  return JSON.stringify(snap);
}

// Every data change goes through commit() so it can be undone. fn returns the
// human description of the change, which the Undo button and toast show.
function commit(fn) {
  const snap = snapshot();
  const label = fn();
  if (!label) return null;
  undoStack.push({ snap, label });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  save();
  return label;
}

function undo() {
  const u = undoStack.pop();
  if (!u) { toast('Nothing to undo', 'info'); return; }
  Object.assign(state, JSON.parse(u.snap));
  view.pulse = null;
  view.pvpPops = [null, null];
  save();
  render();
  toast('Undid: ' + u.label, 'undo');
}

const now = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// Two kinds of "customer": a sale (paid in tickets) and a prize trade (paid in
// cards). Each kind has its own open record and numbering.
const curKey = kind => (kind === 'trade' ? 'tradeId' : 'currentId');
const kindOfCustomer = c => c.kind || 'sale';
const currentOf = kind => state.customers.find(c => c.id === state[curKey(kind)]) || null;
const current = () => currentOf('sale');
const activeKind = () => (view.screen === 'prizes' ? 'trade' : 'sale');
const unitWord = kind => (kind === 'trade' ? 'cards' : 'tix');
const recordWord = kind => (kind === 'trade' ? 'Trade' : 'Customer');
// Cash sales are full price and count toward the goal, but their money is in
// the cash box, not a ticket box.
const isCash = c => !!(c && c.cash);
function cashText(tix) {
  const d = tix * DOLLARS_PER_TICKET;
  return Number.isInteger(d) ? '$' + d : '$' + d.toFixed(2);
}
const cardEvery = () => state.settings.cardEvery || 0;
function bonusDue(c) {
  if (!c || kindOfCustomer(c) !== 'sale' || cardEvery() <= 0) return 0;
  return Math.floor(customerTotal(c) / cardEvery());
}
// Finished sales keep the count they were told to hand over.
const bonusOf = c => (c.closedAt ? (c.bonusCards || 0) : bonusDue(c));

function ensureCurrent(kind) {
  let c = currentOf(kind);
  if (!c) {
    c = {
      id: uid(), kind, no: kind === 'trade' ? state.nextTradeNo++ : state.nextNo++, station: state.settings.station,
      openedAt: now(), closedAt: null, lines: [], age: null, gender: null, voided: false,
    };
    state.customers.push(c);
    state[curKey(kind)] = c.id;
  }
  return c;
}

// Prize stock: starting count from Settings minus every trade line (open
// trades included). null = not tracked.
// Starting count for a stock key: a prize, a clicker design, or a copter part.
function stockStart(key) {
  if (ITEMS[key] && isPrize(key)) {
    const o = state.settings.prizes[key];
    return o && Number.isFinite(o.stock) ? o.stock : null;
  }
  const v = state.settings.stock[key];
  return Number.isFinite(v) ? v : null;
}
// Units of a stock key used so far: every non-voided sale or trade (open ones
// included) plus walk-offs.
function stockUsed(key) {
  const per = itemId => (PARTS_USED[itemId] ? (PARTS_USED[itemId][key] || 0) : (itemId === key ? 1 : 0));
  let used = 0;
  state.customers.forEach(c => { if (!c.voided) c.lines.forEach(l => { used += l.qty * per(l.item); }); });
  state.walkoffs.forEach(w => { if (!w.voided) used += w.qty * per(w.item); });
  return used;
}
const keyLeft = key => (stockStart(key) == null ? null : stockStart(key) - stockUsed(key));
// What an item's button shows: its own count, or for a copter item the
// scarcest tracked part it needs.
function stockInfo(itemId) {
  const keys = PARTS_USED[itemId] ? Object.keys(PARTS_USED[itemId]) : [itemId];
  let best = null;
  keys.forEach(k => {
    const left = keyLeft(k);
    if (left != null && (best == null || left < best.left)) best = { left, start: stockStart(k), key: k };
  });
  return best;
}
const stockLeft = itemId => { const i = stockInfo(itemId); return i ? i.left : null; };
const stockKeyName = key => (ITEMS[key] ? ITEMS[key].name : (COPTER_PARTS.find(pp => pp[0] === key) || [key, key])[1]);

/* ==========================================================================
   Sale actions
   ========================================================================== */
function stockWarning(itemId) {
  const info = stockInfo(itemId);
  if (!info || info.left >= 0) return;
  const what = stockKeyName(info.key);
  toast(isPrize(itemId) ? `Count says no ${what} left. Check the bin.`
    : `Count says no ${what} left. Check the bin, or tap Backorder.`, 'warn');
}

function addItem(itemId, n) {
  const it = ITEMS[itemId];
  const kind = kindOf(itemId);
  const before = currentOf(kind) ? customerTotal(currentOf(kind)) : 0;
  commit(() => {
    const c = ensureCurrent(kind);
    const line = c.lines.find(l => l.item === itemId);
    if (line) line.qty += n; else c.lines.push(newLine(itemId, n));
    return `+${n} ${it.name} (+${customerTotal(c) - before} ${unitWord(kind)})`;
  });
  view.pulse = itemId;
  render();
  stockWarning(itemId);
}

function removeOne(itemId) {
  const kind = kindOf(itemId);
  const c = currentOf(kind);
  if (!c) return;
  const it = ITEMS[itemId];
  const before = customerTotal(c);
  commit(() => {
    const line = c.lines.find(l => l.item === itemId);
    if (!line) return null;
    line.qty -= 1;
    if (line.qty <= 0) c.lines = c.lines.filter(l => l !== line);
    return `−1 ${it.name} (−${before - customerTotal(c)} ${unitWord(kind)})`;
  });
  view.pulse = itemId;
  render();
}

function setQty(itemId, q) {
  const it = ITEMS[itemId];
  const kind = kindOf(itemId);
  const old = qtyOf(currentOf(kind), itemId);
  if (q === old) { render(); return; }
  commit(() => {
    const c = ensureCurrent(kind);
    const line = c.lines.find(l => l.item === itemId);
    if (q <= 0) c.lines = c.lines.filter(l => l.item !== itemId);
    else if (line) line.qty = q;
    else c.lines.push(newLine(itemId, q));
    return `${it.name}: ${old} → ${q}`;
  });
  view.pulse = itemId;
  render();
  stockWarning(itemId);
}

function setDemo(field, val) {
  const c = currentOf(activeKind());
  if (!c || !c.lines.length) return;
  const list = field === 'age' ? AGES : GENDERS;
  const name = field === 'age' ? 'Age' : 'Gender';
  commit(() => {
    if (c[field] === val) { c[field] = null; return `${name} cleared`; }
    c[field] = val;
    return `${name}: ${list.find(x => x.id === val).label}`;
  });
  render();
}

function toggleCash() {
  const c = current();
  if (!c || !c.lines.length) return;
  commit(() => {
    c.cash = !c.cash;
    return c.cash ? `Customer #${c.no} marked cash` : `Customer #${c.no} back to tickets`;
  });
  render();
}

function finish(kind) {
  kind = kind || activeKind();
  const c = currentOf(kind);
  if (!c || !c.lines.length) return;
  const total = customerTotal(c);
  const word = recordWord(kind);
  const cards = bonusDue(c);
  const paid = isCash(c) ? `${cashText(total)} cash` : `${total} ${unitWord(kind)}`;
  commit(() => {
    c.closedAt = now();
    if (kind === 'sale') c.bonusCards = cards;
    state[curKey(kind)] = null;
    return `Finished ${word.toLowerCase()} #${c.no} (${paid})`;
  });
  view.screen = 'home';
  view.pulse = null;
  render();
  toast(`${word} #${c.no} saved · ${paid}${cards ? ` · give ${plural(cards, 'free Pokémon card')}` : ''}`, cards ? 'bonus' : 'ok');
}

function setVoided(id, voided) {
  const c = state.customers.find(x => x.id === id);
  if (!c) return;
  const label = commit(() => {
    c.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} ${recordWord(kindOfCustomer(c)).toLowerCase()} #${c.no}`;
  });
  render();
  toast(label + (voided ? ' · Undo brings it back' : ''), voided ? 'warn' : 'ok');
}

/* ---- Walk-offs: stock that left without tickets ----------------------- */
function openWalkoff(catId) {
  const cat = catById(catId);
  view.modal = { type: 'walkoff', cat: catId, item: cat.items[0].id, qty: 1, reason: 'demo' };
  render();
}

function saveWalkoff() {
  const m = view.modal;
  if (!m || m.type !== 'walkoff') return;
  const it = ITEMS[m.item];
  const reason = WALKOFF_REASONS.find(r => r.id === m.reason).label;
  const label = commit(() => {
    state.walkoffs.push({
      id: uid(), no: state.nextWalkoffNo++, at: now(), station: state.settings.station,
      item: m.item, qty: m.qty, reason: m.reason, voided: false,
    });
    return `Walk-off: ${m.qty} ${it.name} (${reason})`;
  });
  view.modal = null;
  render();
  toast('Logged ' + label.toLowerCase(), 'ok');
}

/* ---- Backorders: interest list when something runs out (no tickets) ---- */
function openBackorder(catId) {
  const cat = catById(catId);
  view.modal = { type: 'backorder', cat: catId, item: cat.items[0].id, qty: 1, name: '', contact: '', note: '' };
  render();
}

function saveBackorder() {
  const m = view.modal;
  if (!m || m.type !== 'backorder') return;
  if (!m.contact.trim()) { toast('Add a phone or email so someone can follow up', 'warn'); return; }
  const it = ITEMS[m.item];
  let no = 0;
  commit(() => {
    no = state.nextBackorderNo++;
    state.backorders.push({
      id: uid(), no, at: now(), station: state.settings.station, item: m.item, qty: m.qty,
      name: m.name.trim(), contact: m.contact.trim(), note: m.note.trim(), voided: false,
    });
    return `Backorder #${no}: ${m.qty} ${it.name}`;
  });
  view.modal = null;
  render();
  toast(`Backorder #${no} saved · ${m.qty} ${it.name}`, 'ok');
}

function setBackorderVoided(id, voided) {

/* ==========================================================================
   Balloon Battle
   ========================================================================== */
const bs = () => state.settings.battle;
const playingMatch = () => state.matches.find(m => m.id === state.matchId) || null;
const lastMatch = () => state.matches.find(m => m.id === state.lastMatchId) || null;
const matchTix = m => m.players.reduce((s, p) => s + p.tix, 0);
const matchCards = m => m.players.reduce((s, p) => s + (p.cards || 0), 0);
const matchTitle = m => m.mode === 'pvp' ? `${m.players[0].name} vs ${m.players[1].name}` : `${m.players[0].name} vs House`;
const weaponName = id => (WEAPONS.find(w => w.id === id) || { name: id }).name;
const weaponPrice = id => (bs().weaponPrices || {})[id] || 0;
// A match's tickets count from sign-up until it is refunded, paired into another
// sign-up, or voided.
const isPaid = m => !m.voided && m.status !== 'refunded' && m.status !== 'paired';
const queuedMatches = () => state.matches.filter(m => m.status === 'queued' && !m.voided).sort((a, b) => a.qpos - b.qpos);
const nextQpos = () => state.matches.reduce((mx, m) => Math.max(mx, m.qpos || 0), 0) + 1;
// A solo sign-up still looking for an opponent.
const isOpen = m => !!m.solo && m.mode === 'house' && m.status === 'queued';
const ageTag = p => (p.age ? ` (${labelOf(AGES, p.age)})` : '');

// Weapons a player has this match: bought now ({ id: tix paid }) or unlocked
// earlier (free). Saves from before v1.7 only have a count.
function weaponsOf(p) {
  if (!p.buy) return p.weapons ? [{ id: 'extra', name: 'Extra weapon', qty: p.weapons, tix: p.tix - p.base, have: false }] : [];
  return Object.keys(p.buy).map(id => ({ id, name: weaponName(id), qty: 1, tix: p.buy[id], have: false }))
    .concat((p.have || []).map(id => ({ id, name: weaponName(id), qty: 1, tix: 0, have: true })));
}
const weaponIds = p => weaponsOf(p).filter(w => w.id !== 'extra').map(w => w.id);
function weaponsText(p) {
  const list = weaponsOf(p);
  if (!list.length) return 'no weapons';
  return list.map(w => (w.id === 'extra' ? plural(w.qty, 'extra weapon') : `${w.name}${w.have ? ' (unlocked earlier)' : ''}`)).join(', ');
}
function weaponAsk() {
  return `Want to unlock ${WEAPONS.map(w => `${w.name.toLowerCase()} for ${plural(weaponPrice(w.id), 'ticket')}`).join(' or ')}? You keep it all day.`;
}

function cardsText(cards) {
  if (!cards) return '0 cards';
  const per = bs().cardsPerPop;
  if (per === 3 && cards % 3 === 0) return `${plural(cards / 3, 'bundle')} (${cards} cards)`;
  return plural(cards, 'card');
}

// Sign-up draft: weapon chips cycle none -> unlock (pay) -> already unlocked (free) -> none.
function cycleWeapon(w, id) {
  if (!w[id]) w[id] = 'buy';
  else if (w[id] === 'buy') w[id] = 'have';
  else delete w[id];
}
const draftPlayers = d => (d.mode === 'pvp' ? d.players : [d.players[0]]);
const boughtTix = w => Object.keys(w).filter(id => w[id] === 'buy').reduce((s, id) => s + weaponPrice(id), 0);
const draftTix = d => draftPlayers(d).reduce((s, pd) => s + bs().match + boughtTix(pd.w), 0);

function makePlayer(src, base) {
  const buy = {};
  const have = [];
  Object.keys(src.w || {}).forEach(id => {
    if (src.w[id] === 'buy') buy[id] = weaponPrice(id);
    else if (src.w[id] === 'have') have.push(id);
  });
  return {
    name: src.name, age: src.age || null, gender: src.gender || null, base, buy, have,
    tix: base + Object.values(buy).reduce((s, x) => s + x, 0),
    pops: null, won: null, cards: 0,
  };
}

function newMatch(mode, players, extra) {
  return Object.assign({
    id: uid(), no: state.nextMatchNo++, station: state.settings.station, mode, rematch: false, solo: false,
    status: 'queued', paidAt: now(), startedAt: null, goAt: null, runAt: null, leftMs: null, restarts: 0,
    endedAt: null, voided: false, limitSec: bs().matchSeconds, qpos: nextQpos(), players,
  }, extra || {});
}

const matchesText = n => `${n} match${n === 1 ? '' : 'es'}`;
const signupTitle = m => (isOpen(m) ? `${m.players[0].name} (solo, wants an opponent)` : matchTitle(m));

function collectToast(m, extra) {
  const parts = m.players.map(p => `${p.name} ${p.tix}`).join(' · ');
  const unlocks = m.players.flatMap(p => Object.keys(p.buy || {}).map(weaponName));
  toast(`Collect ${matchTix(m)} tix: ${parts}${unlocks.length ? ` · new unlock: ${unlocks.join(', ')}` : ''}${extra || ''}`, 'ok');
}

// Add the sign-up to the queue and collect its tickets. Asks about weapons
// first when a player has none (force skips the ask).
function queueAdd(force) {
  const d = view.qDraft;
  if (!force && draftPlayers(d).some(pd => !Object.keys(pd.w).length)) {
    view.modal = { type: 'upsell' };
    render();
    return;
  }
  let m = null;
  commit(() => {
    const no = state.nextMatchNo;
    const players = draftPlayers(d).map((pd, i) => makePlayer(Object.assign({}, pd, {
      name: pd.name.trim() || (i ? `Friend #${no}` : `Walk-up #${no}`),
    }), bs().match));
    m = newMatch(d.mode === 'pvp' ? 'pvp' : 'house', players, { solo: d.mode === 'solo' });
    state.matches.push(m);
    return `Signed up #${m.no}: ${signupTitle(m)} (${matchTix(m)} tix)`;
  });
  view.qDraft = blankDraft();
  if (view.modal && view.modal.type === 'upsell') view.modal = null;
  view.focusName = true;
  render();
  const pos = queuedMatches().indexOf(m);
  collectToast(m, ` · #${pos + 1} in line, ${waitText(pos)}`);
}

function queueRefund(id) {
  const m = state.matches.find(x => x.id === id);
  if (!m || m.status !== 'queued') return;
  commit(() => {
    m.status = 'refunded';
    m.endedAt = now();
    return `Refunded #${m.no} ${signupTitle(m)} (${matchTix(m)} tix)`;
  });
  render();
  toast(`Hand back ${matchTix(m)} tix: ${m.players.map(p => `${p.name} ${p.tix}`).join(' · ')}`, 'warn');
}

function queueDown(id) {
  const q = queuedMatches();
  const i = q.findIndex(m => m.id === id);
  if (i < 0 || i === q.length - 1) return;
  commit(() => {
    const a = q[i], b = q[i + 1];
    [a.qpos, b.qpos] = [b.qpos, a.qpos];
    return `Moved #${a.no} ${signupTitle(a)} down one`;
  });
  render();
}

// Matchmaking: the next solo behind this one who also wants an opponent.
function pairCandidate(m) {
  if (!isOpen(m)) return null;
  const q = queuedMatches();
  return q.slice(q.indexOf(m) + 1).find(isOpen) || null;
}

// Pair two solos into one vs Player match in the earlier spot. The later
// sign-up is closed as "paired" so its tickets are only counted once.
function pairUp(id) {
  const a = state.matches.find(x => x.id === id);
  const b = a && pairCandidate(a);
  if (!b) return;
  commit(() => {
    a.mode = 'pvp';
    a.players.push(JSON.parse(JSON.stringify(b.players[0])));
    a.pairedFrom = b.no;
    b.status = 'paired';
    b.pairedInto = a.no;
    b.endedAt = now();
    return `Paired ${a.players[0].name} (#${a.no}) with ${b.players[0].name} (#${b.no})`;
  });
  render();
  toast(`#${a.no} is now ${matchTitle(a)}`, 'ok');
}

function startQueued(id) {
  const cur = playingMatch();
  if (cur) { toast(`Finish match #${cur.no} first`, 'warn'); return; }
  const m = id ? state.matches.find(x => x.id === id) : queuedMatches()[0];
  if (!m || m.status !== 'queued') return;
  commit(() => {
    m.status = 'playing';
    m.startedAt = now();
    m.goAt = null; m.runAt = null; m.leftMs = null;
    m.limitSec = bs().matchSeconds;
    state.matchId = m.id;
    return `Called up match #${m.no}: ${matchTitle(m)}`;
  });
  view.pvpPops = [null, null];
  render();
}

// Clock: Ready until GO; pause / resume; restart goes back to Ready (free);
// the time left can be edited.
const clockLimitMs = m => (m.limitSec || bs().matchSeconds) * 1000;
function clockLeft(m) {
  const base = m.leftMs == null ? clockLimitMs(m) : m.leftMs;
  return m.runAt ? base - (Date.now() - Date.parse(m.runAt)) : base;
}
function timerText(m) {
  if (!m.goAt) return `Ready · ${fmtDur(clockLeft(m))}`;
  const left = clockLeft(m);
  if (left <= 0) return `Time! +${fmtDur(-left)}`;
  return fmtDur(left) + (m.runAt ? '' : ' · paused');
}
const timerClass = m => (!m.goAt ? 'ready' : (clockLeft(m) <= 0 ? 'over' : (m.runAt ? '' : 'paused')));

function clockAct(kind, value) {
  const m = playingMatch();
  if (!m || m.status !== 'playing') return;
  commit(() => {
    const left = clockLeft(m);
    if (kind === 'go') {
      if (!m.goAt) m.goAt = now();
      m.leftMs = left;
      m.runAt = now();
      return `Started the clock for match #${m.no}`;
    }
    if (kind === 'pause' && m.runAt) { m.leftMs = left; m.runAt = null; return `Paused match #${m.no} at ${fmtDur(left)}`; }
    if (kind === 'resume' && !m.runAt && m.goAt) { m.runAt = now(); return `Resumed match #${m.no}`; }
    if (kind === 'restart') {
      m.goAt = null; m.runAt = null; m.leftMs = null;
      m.restarts = (m.restarts || 0) + 1;
      return `Restarted match #${m.no} (back to Ready, no new tickets)`;
    }
    if (kind === 'set') {
      m.leftMs = value;
      if (m.runAt) m.runAt = now();
      return `Match #${m.no} clock set to ${fmtDur(value)}`;
    }
    return '';
  });
  render();
}

function endMatch() {
  const m = playingMatch();
  if (!m || m.status !== 'playing') return;
  commit(() => {
    if (m.runAt) { m.leftMs = clockLeft(m); m.runAt = null; }
    m.status = 'scoring';
    m.endedAt = now();
    return `Ended match #${m.no}`;
  });
  view.pvpPops = [null, null];
  render();
}

// Not ready after all: the match goes back to the front of the queue, tickets kept.
function backToQueue() {
  const m = playingMatch();
  if (!m || m.status !== 'playing') return;
  commit(() => {
    const q = queuedMatches();
    m.status = 'queued';
    m.startedAt = null; m.goAt = null; m.runAt = null; m.leftMs = null;
    m.qpos = q.length ? q[0].qpos - 1 : nextQpos();
    state.matchId = null;
    return `Match #${m.no} back to the front of the queue (tickets kept)`;
  });
  view.pvpPops = [null, null];
  render();
}

// Change weapons on a queued or current match; the toast says what to collect or hand back.
function openWeapons(id) {
  const m = state.matches.find(x => x.id === id);
  if (!m || !['queued', 'playing'].includes(m.status)) return;
  view.modal = {
    type: 'weapons', id,
    w: m.players.map(p => {
      const w = {};
      Object.keys(p.buy || {}).forEach(k => { w[k] = 'buy'; });
      (p.have || []).forEach(k => { w[k] = 'have'; });
      return w;
    }),
  };
  render();
}
function weaponsDraftTix(m, md) {
  return m.players.reduce((s, p, i) => s + p.base + Object.keys(md.w[i]).filter(id => md.w[i][id] === 'buy')
    .reduce((t, id) => t + (p.buy && p.buy[id] != null ? p.buy[id] : weaponPrice(id)), 0), 0);
}
function saveWeapons() {
  const md = view.modal;
  const m = md && state.matches.find(x => x.id === md.id);
  if (!m) return;
  const before = matchTix(m);
  commit(() => {
    m.players.forEach((p, i) => {
      const w = md.w[i];
      const buy = {};
      const have = [];
      Object.keys(w).forEach(id => {
        if (w[id] === 'buy') buy[id] = p.buy && p.buy[id] != null ? p.buy[id] : weaponPrice(id);
        else have.push(id);
      });
      p.buy = buy;
      p.have = have;
      p.tix = p.base + Object.values(buy).reduce((s, x) => s + x, 0);
    });
    return `Match #${m.no} weapons: ${m.players.map(p => `${p.name} ${weaponsText(p)}`).join(' · ')}`;
  });
  view.modal = null;
  render();
  const diff = matchTix(m) - before;
  toast(diff > 0 ? `Collect ${diff} more tix` : (diff < 0 ? `Hand back ${-diff} tix` : 'Weapons saved'), diff < 0 ? 'warn' : 'ok');
}

// Instant rematch: plays right away, once in a row, only while the line is short.
// Rematch: same players back of the line at the normal price. Weapons stay unlocked.
function rematchBlock(lm) {
  if (!lm || lm.status !== 'done' || lm.voided) return 'No match to rematch';
  if (playingMatch()) return 'A match is already running';
  if (bs().rematchOnce && lm.rematch) return 'Already had their instant rematch';
  const waiting = queuedMatches().length;
  if (waiting > bs().rematchMaxWaiting) return `${matchesText(waiting)} waiting: line is too long`;
  return '';
}
function rematchSources(lm, who) {
  const list = lm.mode !== 'pvp' || who === 'both' ? lm.players : [lm.players[Number(who)]];
  return list.map(p => {
    const w = {};
    weaponIds(p).forEach(id => { w[id] = 'have'; });
    return { name: p.name, age: p.age, gender: p.gender, w };
  });
}
function rematch(instant) {
  const lm = lastMatch();
  if (!lm || lm.status !== 'done' || lm.voided || lm.followUp) return;
  if (instant) {
    const why = rematchBlock(lm);
    if (why) { toast(why, 'warn'); return; }
  }
  const who = view.rmWho || 'both';
  let m = null;
  commit(() => {
    const src = rematchSources(lm, who);
    m = newMatch(src.length === 2 ? 'pvp' : 'house', src.map(x => makePlayer(x, instant ? bs().rematch : bs().match)),
      { rematch: !!instant, again: true });
    state.matches.push(m);
    lm.followUp = m.no;
    if (instant) {
      m.status = 'playing';
      m.startedAt = now();
      state.matchId = m.id;
      return `Instant rematch #${m.no}: ${matchTitle(m)} (${matchTix(m)} tix)`;
    }
    return `Rematch #${m.no} back in line: ${matchTitle(m)} (${matchTix(m)} tix)`;
  });
  view.rmWho = 'both';
  view.pvpPops = [null, null];
  render();
  if (instant) collectToast(m);
  else {
    const pos = queuedMatches().indexOf(m);
    collectToast(m, ` · #${pos + 1} in line, ${waitText(pos)}`);
  }
}

function finishScoring(m, label) {
  m.status = 'done';
  if (!m.endedAt) m.endedAt = now();
  state.matchId = null;
  state.lastMatchId = m.id;
  return label;
}

function scoreHouse(pops, ko) {
  const m = playingMatch();
  if (!m || m.status !== 'scoring' || m.mode !== 'house') return;
  const p = m.players[0];
  const survive = bs().scoring === 'survive';
  commit(() => {
    p.pops = pops;
    p.won = pops === BALLOONS;
    p.knockedOut = survive ? !!ko : null;
    p.cards = survive && ko ? (bs().consolation || 0) : pops * bs().cardsPerPop;
    p.outcome = null;
    return finishScoring(m, `Match #${m.no}: ${p.name} popped ${pops}${p.knockedOut ? ', knocked out' : ''} (${p.cards} cards)`);
  });
  render();
}

const outcomeCards = key => bs().outcomeCards[key] || 0;

// Most cards one match can pay, per ticket, for a given battle setup.
function worstCase(b) {
  const pvpTix = b.match * 2;
  let pvp, house;
  if (b.scoring === 'outcome') {
    const o = b.outcomeCards;
    pvp = Math.max(o.koWin + o.knockedOut, o.timeWin + o.survive, o.survive * 2);
    house = Math.max(o.koWin, o.timeWin, o.survive, o.knockedOut);
  } else {
    // Try every score; both popping 3 can't happen (the match ends at the first knockout).
    pvp = 0;
    for (let x = 0; x <= BALLOONS; x++) {
      for (let y = 0; y <= BALLOONS; y++) {
        if (x === BALLOONS && y === BALLOONS) continue;
        const r = pvpPayout([x, y], b);
        pvp = Math.max(pvp, r.cards[0] + r.cards[1]);
      }
    }
    house = Math.max(BALLOONS * b.cardsPerPop, b.consolation || 0);
  }
  return { pvp, pvpTix, house, houseTix: b.match };
}
const outcomeLabel = key => (OUTCOMES.find(o => o[0] === key) || [key, key])[1];

// Outcome scoring: one tap per match. vs House codes are the kid's outcome;
// vs Player codes are ko0 / ko1 (player 0 / 1 knocked the other out),
// time0 / time1 (ahead when time ran out) and tie.
function outcomeResult(m, code) {
  if (m.mode === 'house') return { outcomes: [code], win: code === 'koWin' || code === 'timeWin' ? 0 : null, tie: false };
  if (code === 'tie') return { outcomes: ['survive', 'survive'], win: null, tie: true };
  const w = Number(code.slice(-1));
  const ko = code.startsWith('ko');
  const outcomes = [];
  outcomes[w] = ko ? 'koWin' : 'timeWin';
  outcomes[1 - w] = ko ? 'knockedOut' : 'survive';
  return { outcomes, win: w, tie: false };
}

function scoreOutcome(code) {
  const m = playingMatch();
  if (!m || m.status !== 'scoring') return;
  const r = outcomeResult(m, code);
  commit(() => {
    m.players.forEach((p, i) => {
      p.outcome = r.outcomes[i];
      p.cards = outcomeCards(r.outcomes[i]);
      p.won = r.win === i;
      p.pops = null;
    });
    m.tie = r.tie;
    const what = m.mode === 'house' ? `${m.players[0].name}: ${outcomeLabel(r.outcomes[0]).toLowerCase()}`
      : (r.tie ? `${m.players[0].name} and ${m.players[1].name} tied on time`
        : `${m.players[r.win].name} ${r.outcomes[r.win] === 'koWin' ? 'knocked out' : 'beat on time'} ${m.players[1 - r.win].name}`);
    return finishScoring(m, `Match #${m.no}: ${what} (${matchCards(m)} cards)`);
  });
  render();
}

// Cards for a vs Player result. Survive pays each player per balloon they
// popped if they still had a balloon at the end (the other player popped
// fewer than 3). Winner-only pays the winner per balloon they popped (time can
// run out before 3); a tie pays per the tie setting.
function pvpPayout(pops, b = bs()) {
  const per = b.cardsPerPop;
  const tie = pops[0] === pops[1];
  const win = tie ? null : (pops[0] > pops[1] ? 0 : 1);
  const ko = pops.map((n, i) => pops[1 - i] >= BALLOONS);
  const cards = pops.map((n, i) => {
    if (b.scoring === 'survive') return ko[i] ? (b.consolation || 0) : n * per;
    if (b.pvpRule === 'both') return n * per;
    if (tie) return b.pvpTie === 'both' ? n * per : 0;
    return i === win ? n * per : (b.consolation || 0);
  });
  return { win, tie, cards, ko };
}

function scorePvp() {
  const m = playingMatch();
  const pops = view.pvpPops;
  if (!m || m.status !== 'scoring' || m.mode !== 'pvp' || pops[0] == null || pops[1] == null) return;
  const r = pvpPayout(pops);
  commit(() => {
    m.players.forEach((p, i) => {
      p.pops = pops[i];
      p.won = r.tie ? false : i === r.win;
      p.knockedOut = bs().scoring === 'survive' ? r.ko[i] : null;
      p.cards = r.cards[i];
      p.outcome = null;
    });
    m.tie = r.tie;
    const a = m.players[0], b = m.players[1];
    const what = r.tie ? `${a.name} and ${b.name} tied ${pops[0]}–${pops[1]}`
      : `${m.players[r.win].name} beat ${m.players[1 - r.win].name} ${Math.max(...pops)}–${Math.min(...pops)}`;
    return finishScoring(m, `Match #${m.no}: ${what} (${matchCards(m)} cards)`);
  });
  view.pvpPops = [null, null];
  render();
}

function setMatchVoided(id, voided) {
  const m = state.matches.find(x => x.id === id);
  if (!m || m.status !== 'done') return;
  const label = commit(() => {
    m.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} match #${m.no}`;
  });
  render();
  toast(label, voided ? 'warn' : 'ok');
}

function avg(list) { return list.reduce((s, x) => s + x, 0) / list.length; }

function cycleMinutes() {
  const starts = state.matches.filter(m => isPaid(m) && m.startedAt).map(m => Date.parse(m.startedAt)).sort((a, b) => a - b);
  const gaps = [];
  for (let i = 1; i < starts.length; i++) {
    const g = (starts[i] - starts[i - 1]) / 60000;
    if (g > 0.3 && g < 15) gaps.push(g);
  }
  const recent = gaps.slice(-6);
  return recent.length ? avg(recent) : bs().matchSeconds / 60 + (bs().turnaroundMin || 0);
}

// Minutes until the match at this queue position starts: what's left of the
// current match plus turnaround, then one match cycle per match ahead.
function waitMinutes(pos) {
  const m = playingMatch();
  const turn = bs().turnaroundMin || 0;
  let cur = 0;
  if (m) cur = m.status === 'playing' ? Math.max(0, clockLeft(m)) / 60000 + turn : turn;
  return cur + pos * cycleMinutes();
}
function waitText(pos) {
  const w = waitMinutes(pos);
  return w < 0.5 ? 'next up' : `~${Math.max(1, Math.round(w))} min`;
}

/* ==========================================================================
   Totals
   ========================================================================== */
function computeTotals() {
  const done = kind => state.customers.filter(c => kindOfCustomer(c) === kind && c.closedAt && !c.voided && c.lines.length);
  const sold = done('sale');
  const trades = done('trade');
  const byPrize = {};
  trades.forEach(c => {
    const cards = lineTixList(c);
    c.lines.forEach((l, i) => {
      const b = byPrize[l.item] || (byPrize[l.item] = { given: 0, cards: 0 });
      b.given += l.qty;
      b.cards += cards[i];
    });
  });
  const prizes = {
    trades: trades.length,
    given: Object.values(byPrize).reduce((s, b) => s + b.given, 0),
    cards: Object.values(byPrize).reduce((s, b) => s + b.cards, 0),
  };
  const byItem = {};
  const byBox = {};      // tickets that should be in each box
  const cashByCat = {};  // cash sales: count toward the goal, not in a box
  let cashTix = 0, bonusCards = 0;
  sold.forEach(c => {
    const tix = lineTixList(c);
    bonusCards += bonusOf(c);
    c.lines.forEach((l, i) => {
      const b = byItem[l.item] || (byItem[l.item] = { units: 0, tix: 0, walkoffs: 0 });
      const t = tix[i];
      const cat = ITEMS[l.item].cat;
      b.units += l.qty;
      b.tix += t;
      if (isCash(c)) { cashByCat[cat] = (cashByCat[cat] || 0) + t; cashTix += t; }
      else byBox[cat] = (byBox[cat] || 0) + t;
    });
  });
  state.walkoffs.filter(w => !w.voided).forEach(w => {
    const b = byItem[w.item] || (byItem[w.item] = { units: 0, tix: 0, walkoffs: 0 });
    b.walkoffs += w.qty;
  });
  // Battle tickets are collected at sign-up, so every paid match counts
  // (queued, playing or played); the match stats use played ones.
  const paid = state.matches.filter(isPaid);
  const matches = paid.filter(m => m.status === 'done');
  const refunds = state.matches.filter(m => m.status === 'refunded' && !m.voided);
  const battle = {
    matches: matches.length,
    queued: paid.filter(m => m.status === 'queued').length,
    house: matches.filter(m => m.mode === 'house').length,
    pvp: matches.filter(m => m.mode === 'pvp').length,
    rematches: matches.filter(m => m.rematch).length,
    again: matches.filter(m => m.again && !m.rematch).length,
    players: matches.reduce((s, m) => s + m.players.length, 0),
    weapons: paid.reduce((s, m) => s + m.players.reduce((t, p) => t + weaponsOf(p).filter(w => !w.have).reduce((u, w) => u + w.qty, 0), 0), 0),
    tix: paid.reduce((s, m) => s + matchTix(m), 0),
    cards: matches.reduce((s, m) => s + matchCards(m), 0),
    refunds: refunds.length,
    refundTix: refunds.reduce((s, m) => s + matchTix(m), 0),
    avgMin: null,
  };
  const timed = matches.filter(m => m.endedAt && m.startedAt);
  if (timed.length) battle.avgMin = avg(timed.map(m => (Date.parse(m.endedAt) - Date.parse(m.startedAt)) / 60000));
  if (battle.tix) byBox.battle = battle.tix;
  const tix = Object.values(byBox).reduce((s, x) => s + x, 0);
  const byGoal = Object.assign({}, byBox);
  Object.keys(cashByCat).forEach(k => { byGoal[k] = (byGoal[k] || 0) + cashByCat[k]; });
  const cashSales = sold.filter(isCash).length;
  return { sold, byItem, byBox, byGoal, cashTix, cashSales, bonusCards, battle, matches, paid, tix, trades, byPrize, prizes };
}

/* ==========================================================================
   CSV export (one row per item line / player; stack files from each laptop)
   ========================================================================== */
function pad(n) { return String(n).padStart(2, '0'); }
function localStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function labelOf(list, id) { const x = list.find(v => v.id === id); return x ? x.label : ''; }

function buildCSV() {
  const header = ['station', 'record', 'status', 'opened_at', 'closed_at', 'category', 'item', 'qty',
    'item_tickets', 'record_total_tickets', 'age', 'gender',
    'battle_mode', 'player', 'balloons_popped', 'won', 'cards_paid', 'walkoff_reason', 'cards_redeemed',
    'record_id', 'laptop_id', 'exported_at', 'battle_outcome', 'paid_with', 'bonus_cards'];
  const rows = [header];
  // record_id + exported_at let the Combine screen keep only the newest copy
  // of each record when early and late exports are mixed.
  const stamp = localStamp(now());
  const tail = (id, outcome) => [id, state.settings.laptopId, stamp, outcome || ''];
  const blankBattle = ['', '', '', '', ''];
  state.customers.forEach(c => {
    if (!c.lines.length) return;
    const trade = kindOfCustomer(c) === 'trade';
    const status = c.voided ? 'voided' : (c.closedAt ? (trade ? 'traded' : 'sold') : 'open');
    const total = customerTotal(c);
    const amounts = lineTixList(c);
    c.lines.forEach((l, i) => {
      const it = ITEMS[l.item];
      rows.push([c.station, (trade ? 'T' : 'S') + c.no, status, localStamp(c.openedAt), localStamp(c.closedAt),
        catById(it.cat).name, it.name, l.qty, trade ? 0 : amounts[i], trade ? 0 : total,
        labelOf(AGES, c.age), labelOf(GENDERS, c.gender)].concat(blankBattle, ['', trade ? amounts[i] : ''], tail(c.id),
        // bonus_cards sits on the sale's first row only, so summing the column counts each sale once.
        [trade ? '' : (isCash(c) ? 'cash' : 'tickets'), !trade && i === 0 ? bonusOf(c) : '']));
    });
  });
  state.walkoffs.forEach(w => {
    const it = ITEMS[w.item];
    rows.push([w.station, 'W' + w.no, w.voided ? 'voided' : 'walk-off', localStamp(w.at), localStamp(w.at),
      catById(it.cat).name, it.name, w.qty, 0, 0, '', ''].concat(blankBattle, [labelOf(WALKOFF_REASONS, w.reason), ''], tail(w.id)));
  });
  const MATCH_STATUS = { done: 'played', queued: 'queued', refunded: 'refunded', paired: 'paired' };
  state.matches.forEach(m => {
    const status = m.voided ? 'voided' : (MATCH_STATUS[m.status] || 'in progress');
    const total = matchTix(m);
    m.players.forEach((p, i) => {
      const common = [m.station, 'B' + m.no, status, localStamp(m.paidAt || m.startedAt), localStamp(m.endedAt), 'Balloon Battle'];
      const demo = [labelOf(AGES, p.age), labelOf(GENDERS, p.gender)];
      const mode = m.mode === 'pvp' ? 'vs player' : 'vs house';
      rows.push(common.concat([m.rematch ? 'Rematch' : 'Match', 1, p.base, total], demo,
        [mode, 'P' + (i + 1), p.pops == null ? '' : p.pops, p.won == null ? '' : (p.won ? 'yes' : 'no'), p.cards || 0, '', ''], tail(m.id, p.outcome ? outcomeLabel(p.outcome) : [m.tie ? 'Tie' : '', p.knockedOut ? 'Knocked out' : (p.knockedOut === false ? 'Survived' : '')].filter(Boolean).join(' / '))));
      weaponsOf(p).forEach(w => {
        rows.push(common.concat([w.have ? `${w.name} (unlocked earlier)` : w.name, w.qty, w.tix, total], demo, [mode, 'P' + (i + 1), '', '', '', '', ''], tail(m.id)));
      });
    });
  });
  rows.forEach(r => { while (r.length < header.length) r.push(''); });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

// ramathon_<kind>_<booth>_<station>_<laptop id>_<date>_<time>.csv
function exportName(kind) {
  const slug = v => String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
  const d = new Date();
  return `ramathon_${kind}_${slug(boothParam || 'all')}_${slug(state.settings.station)}_${state.settings.laptopId}_`
    + `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.csv`;
}

function downloadCSV(name, rows) {
  const csv = Array.isArray(rows) ? rows.map(r => r.map(csvCell).join(',')).join('\r\n') : rows;
  const bom = String.fromCharCode(0xfeff); // lets Excel read the file as UTF-8
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Downloaded ' + name, 'ok');
}

function exportCSV() {
  downloadCSV(exportName('sales'), buildCSV());
  state.lastExport = now();
  save();
  render();
}

/* ---- Stats (shown in Totals, exported as their own CSV) ----------------- */
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '-');
const avgText = (a, b, digits = 2) => (b ? (a / b).toFixed(digits) : '-');

function computeStats() {
  const t = computeTotals();
  const out = [];
  const add = (section, metric, value) => out.push([section, metric, value]);
  const sold = t.sold;
  if (sold.length) {
    const tix = sold.reduce((s, c) => s + customerTotal(c), 0);
    add('Sales', 'Customers', sold.length);
    add('Sales', 'Tickets', tix);
    add('Sales', 'Avg tix per customer', avgText(tix, sold.length));
    add('Sales', 'Avg items per customer', avgText(sold.reduce((s, c) => s + unitsOf(c), 0), sold.length));
    if (t.cashSales) add('Sales', 'Of which cash sales', `${t.cashSales} (${cashText(t.cashTix)})`);
    if (t.bonusCards || cardEvery()) add('Sales', 'Free Pokémon cards with purchase', t.bonusCards);
  }
  const clickerBuyers = sold.filter(c => groupUnits(c, 'clicker') > 0);
  if (clickerBuyers.length) {
    let n = 0, tix = 0, threes = 0, twos = 0, ones = 0;
    clickerBuyers.forEach(c => {
      const u = groupUnits(c, 'clicker');
      n += u; tix += groupPrice('clicker', u); threes += Math.floor(u / 3);
      if (u % 3 === 2) twos += 1;
      if (u % 3 === 1) ones += 1;
    });
    add('Clickers', 'Clickers sold', n);
    add('Clickers', 'Clicker tickets', tix);
    add('Clickers', 'Avg tix per clicker', avgText(tix, n));
    add('Clickers', 'Customers buying clickers', clickerBuyers.length);
    add('Clickers', 'Avg clickers per clicker customer', avgText(n, clickerBuyers.length));
    add('Clickers', '3 for 10 deals', threes);
    add('Clickers', '2 for 7 deals', twos);
    add('Clickers', '1 for 4 (singles)', ones);
  }
  const copterBuyers = sold.filter(c => catUnits(c, 'copters') > 0);
  if (copterBuyers.length) {
    const kits = copterBuyers.reduce((s, c) => s + qtyOf(c, 'kit'), 0);
    const tkits = copterBuyers.reduce((s, c) => s + qtyOf(c, 'kit_toroidal'), 0);
    const addOn = copterBuyers.filter(c => ['propeller', 'toroidal', 'ripcord'].some(id => qtyOf(c, id) > 0)).length;
    add('Copters', 'Copter customers', copterBuyers.length);
    add('Copters', 'Copter tickets', copterBuyers.reduce((s, c) => s + catTix(c, 'copters'), 0));
    add('Copters', 'Avg copter tix per copter customer', avgText(copterBuyers.reduce((s, c) => s + catTix(c, 'copters'), 0), copterBuyers.length));
    add('Copters', 'Kits: regular / toroidal', `${kits} / ${tkits}`);
    add('Copters', 'Toroidal upgrade rate', pct(tkits, kits + tkits));
    add('Copters', 'Add-on rate (extra prop, toroidal prop or ripcord)', pct(addOn, copterBuyers.length));
  }
  const b = t.battle;
  if (t.paid.length) {
    const paidPlayers = t.paid.flatMap(m => m.players);
    add('Battle', 'Matches played', b.matches);
    add('Battle', 'Paid, waiting in the queue', b.queued);
    add('Battle', 'Players', b.players);
    add('Battle', 'Tickets', b.tix);
    add('Battle', 'Avg tix per match', avgText(b.tix, t.paid.length));
    add('Battle', 'Avg tix per player', avgText(b.tix, paidPlayers.length));
    add('Battle', 'Weapon unlock rate (players who bought 1+)', pct(paidPlayers.filter(p => weaponsOf(p).some(w => !w.have)).length, paidPlayers.length));
    WEAPONS.forEach(w => {
      const bought = paidPlayers.flatMap(p => weaponsOf(p)).filter(x => x.id === w.id && !x.have);
      add('Battle', `${w.name} unlocks`, `${bought.length} (${bought.reduce((s, x) => s + x.tix, 0)} tix)`);
    });
    add('Battle', 'Weapons used, unlocked earlier (free)', paidPlayers.flatMap(p => weaponsOf(p)).filter(x => x.have).length);
    add('Battle', 'Instant rematch rate', pct(b.rematches, b.matches));
    add('Battle', 'Rematches back in line', b.again);
    add('Battle', 'Solo sign-ups paired up', t.paid.filter(m => m.pairedFrom).length);
    add('Battle', 'Refunds', `${b.refunds} (${b.refundTix} tix)`);
    add('Battle', 'Clock restarts', t.paid.reduce((s, m) => s + (m.restarts || 0), 0));
    const waits = t.paid.filter(m => m.startedAt && m.paidAt && !m.rematch).map(m => (Date.parse(m.startedAt) - Date.parse(m.paidAt)) / 60000);
    add('Battle', 'Avg wait, sign-up to start (minutes)', waits.length ? avg(waits).toFixed(1) : '-');
    add('Battle', 'vs Player share', pct(b.pvp, b.matches));
    add('Battle', 'Avg match minutes', b.avgMin == null ? '-' : b.avgMin.toFixed(1));
    add('Battle', 'Cards paid out', b.cards);
    add('Battle', 'Cards per ticket', avgText(b.cards, b.tix));
    const hs = payoutStats(m => m.mode === 'house');
    const ps = payoutStats(m => m.mode === 'pvp');
    if (hs.n) add('Battle', 'Cards per ticket vs House', hs.rate.toFixed(2));
    if (ps.n) add('Battle', 'Cards per ticket vs Player', ps.rate.toFixed(2));
    add('Battle', 'Scoring', scoringText());
  }
  if (t.prizes.trades) {
    const top = Object.keys(t.byPrize).sort((x, y) => t.byPrize[y].given - t.byPrize[x].given)[0];
    add('Prizes', 'Trades', t.prizes.trades);
    add('Prizes', 'Prizes given', t.prizes.given);
    add('Prizes', 'Cards redeemed', t.prizes.cards);
    add('Prizes', 'Avg cards per trade', avgText(t.prizes.cards, t.prizes.trades, 1));
    add('Prizes', 'Most popular prize', ITEMS[top].name);
    Object.keys(t.byPrize).forEach(id => add('Prizes', `Given: ${ITEMS[id].name}`, t.byPrize[id].given));
  }
  const bos = state.backorders.filter(x => !x.voided);
  if (bos.length) {
    add('Backorders', 'Requests', bos.length);
    add('Backorders', 'Items requested', bos.reduce((s, x) => s + x.qty, 0));
    const byItem = {};
    bos.forEach(x => { byItem[x.item] = (byItem[x.item] || 0) + x.qty; });
    Object.keys(byItem).forEach(id => add('Backorders', `Requested: ${ITEMS[id].name}`, byItem[id]));
  }
  const stockKeys = CATEGORIES.find(cat => cat.id === 'clickers').items.map(it => it.id).concat(COPTER_PARTS.map(pp => pp[0]));
  stockKeys.filter(k => stockStart(k) != null).forEach(k => add('Stock left', stockKeyName(k), `${keyLeft(k)} of ${stockStart(k)}`));
  const p = pace();
  p.rows.forEach(r => add('Goal', `${r.cat.name}: actual / goal`, `${r.actual} / ${r.goal}`));
  // Busiest stretches: tickets and transactions per 30 minutes.
  const buckets = {};
  const bump = (iso, tix) => {
    const d = new Date(iso);
    d.setMinutes(Math.floor(d.getMinutes() / STATS_BUCKET_MIN) * STATS_BUCKET_MIN, 0, 0);
    const k = d.getTime();
    const bk = buckets[k] || (buckets[k] = { n: 0, tix: 0 });
    bk.n += 1; bk.tix += tix;
  };
  sold.forEach(c => bump(c.closedAt, customerTotal(c)));
  t.paid.forEach(m => bump(m.paidAt || m.startedAt, matchTix(m)));
  t.trades.forEach(c => bump(c.closedAt, 0));
  const keys = Object.keys(buckets).map(Number).sort((x, y) => x - y);
  const label = k => `${fmtTime(new Date(k).toISOString())} to ${fmtTime(new Date(k + STATS_BUCKET_MIN * 60000).toISOString())}`;
  keys.forEach(k => add('By time', label(k), `${buckets[k].n} transactions · ${buckets[k].tix} tix`));
  if (keys.length) {
    const best = keys.reduce((x, y) => (buckets[y].tix > buckets[x].tix ? y : x));
    add('By time', 'Busiest 30 minutes', `${label(best)} (${buckets[best].tix} tix)`);
  }
  return out;
}

function statsTable() {
  const rows = computeStats();
  if (!rows.length) return '';
  let lastSection = '';
  const body = rows.map(([section, metric, value]) => {
    const head = section !== lastSection ? `<tr class="sec"><td colspan="2">${esc(section)}</td></tr>` : '';
    lastSection = section;
    return `${head}<tr><td>${esc(metric)}</td><td class="num">${esc(value)}</td></tr>`;
  }).join('');
  return `<h3>Stats</h3><table class="stats">${body}</table>`;
}

/* ---- Combine: add up the CSVs from all laptops, newest copy of each record ---- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

async function loadCombineFiles(fileList) {
  const files = [];
  for (const f of Array.from(fileList)) {
    const grid = parseCSV(await f.text());
    if (!grid.length) continue;
    const header = grid[0];
    if (!header.includes('category') || !header.includes('item_tickets')) {
      files.push({ name: f.name, skipped: 'not a sales CSV (stats or backorders files are skipped)' });
      continue;
    }
    const rows = grid.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] == null ? '' : r[i]])));
    files.push({ name: f.name, header, rows, exportedAt: rows.reduce((mx, r) => (r.exported_at > mx ? r.exported_at : mx), '') });
  }
  view.combine.files = view.combine.files.concat(files);
  render();
}

// Old category names from earlier versions map onto today's booths.
const CAT_BY_NAME = { 'Fidget Clickers': 'clickers', Clickers: 'clickers', 'Pull Copters': 'copters' };
CATEGORIES.forEach(cat => { CAT_BY_NAME[cat.name] = cat.id; });

function combineResult() {
  const files = view.combine.files.filter(f => f.rows);
  // For each record keep the rows from the newest file that has it.
  const best = {};
  files.forEach((f, fi) => f.rows.forEach(r => {
    if (!r.record_id) return;
    const key = `${r.laptop_id}|${r.record_id}`;
    const cur = best[key];
    if (!cur || f.exportedAt > files[cur].exportedAt) best[key] = fi;
  }));
  const kept = [];
  let legacy = 0;
  files.forEach((f, fi) => f.rows.forEach(r => {
    if (!r.record_id) { legacy += 1; kept.push(r); return; }
    if (best[`${r.laptop_id}|${r.record_id}`] === fi) kept.push(r);
  }));
  const counted = r => ['sold', 'played', 'in progress', 'queued', 'traded'].includes(r.status);
  const byCat = {};
  const prizes = {};
  let cardsPaid = 0, cardsRedeemed = 0, cashTix = 0, bonusCards = 0;
  const records = new Set();
  kept.forEach(r => {
    if (!counted(r)) return;
    const cat = CAT_BY_NAME[r.category] || r.category;
    byCat[cat] = (byCat[cat] || 0) + (Number(r.item_tickets) || 0);
    cardsPaid += Number(r.cards_paid) || 0;
    cardsRedeemed += Number(r.cards_redeemed) || 0;
    if (r.paid_with === 'cash') cashTix += Number(r.item_tickets) || 0;
    bonusCards += Number(r.bonus_cards) || 0;
    if (r.status === 'traded') prizes[r.item] = (prizes[r.item] || 0) + (Number(r.qty) || 0);
    if (r.record_id) records.add(`${r.laptop_id}|${r.record_id}`);
  });
  const laptops = new Set(kept.map(r => r.laptop_id).filter(Boolean));
  return { files, kept, legacy, byCat, prizes, cardsPaid, cardsRedeemed, cashTix, bonusCards, transactions: records.size, laptops: laptops.size,
    dropped: files.reduce((s, f) => s + f.rows.length, 0) - kept.length };
}

      </div>
      <table><thead><tr><th>Booth</th><th class="num">Tix</th><th class="num">Goal</th><th class="num">%</th></tr></thead>
      <tbody>${rows}<tr><td>Plinko (bucket)</td><td class="num">${plinko}</td><td class="num">${PLINKO_GOAL}</td><td class="num">${pct(plinko, PLINKO_GOAL)}</td></tr></tbody></table>
      ${r.cashTix ? `<p class="note">Cash sales: ${cashText(r.cashTix)}, counted in the event total and goal.</p>` : ''}
      ${r.cardsPaid || r.cardsRedeemed || r.bonusCards ? `<p class="note">Cards: Balloon Battle paid out ${r.cardsPaid}, Sales gave ${r.bonusCards} free with purchases, Prize Table took back ${r.cardsRedeemed}.</p>` : ''}
      ${prizeRows ? `<h3>Prizes, most popular first</h3><table><tbody>${prizeRows}</tbody></table>` : ''}
      <div class="row"><button class="btn go" data-act="combinedownload">Download combined CSV</button></div>` : ''}
  </div>`;
}

function downloadCombined() {
  const r = combineResult();
  if (!r.kept.length) return;
  // Widest header wins, so mixing older and newer exports keeps every column.
  const withIds = r.files.filter(f => f.header.includes('record_id'));
  const header = (withIds.length ? withIds : r.files).reduce((a, f) => (f.header.length > a.length ? f.header : a), []);
  const rows = [header].concat(r.kept.map(row => header.map(h => row[h] == null ? '' : row[h])));
  const d = new Date();
  downloadCSV(`ramathon_combined_${r.laptops}-laptops_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.csv`, rows);
}

function clearAll() {
  commit(() => {
    const fresh = defaultState();
    DATA_KEYS.forEach(k => { state[k] = fresh[k]; });
    return 'Deleted all data';
  });
  view.modal = null;
  view.screen = 'home';
  render();
  toast('All data deleted · Undo brings it back until you reload', 'warn');
}

const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
const money = n => '$' + n.toFixed(2);
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));

function render() {
