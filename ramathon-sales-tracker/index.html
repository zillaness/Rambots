<!doctype html>
<!--
  file: index.html (Ramathon sales tracker)
  version: 1.3
  author: Sam Cao
  created: 2026-10-16
  last_updated: 2026-10-16
  description: Huge-button, offline tracker for the Rambots Ram-a-thon booths: Clickers (per-design photo buttons) and Copters sales, Balloon Battle queue and matches, Prize Table card redemptions, walk-offs.
  ai_update: Update last_updated and version. Keep the filename index.html so volunteers' links never break. Append a changelog entry at the bottom.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ramathon Sales</title>
<style>
  :root {
    /* Rambots brand tokens (from src/styles.css) */
    --rb-red: #a31f36;
    --rb-red-700: #83182c;
    --rb-red-100: #f7e3e7;
    --rb-yellow: #f4a81c;
    --rb-yellow-100: #fef4de;
    --rb-ink: #1c1a1b;
    --rb-gray-700: #4a4446;
    --rb-gray-600: #635b5e;
    --rb-gray-500: #7c7477;
    --rb-gray-300: #cfc9cb;
    --rb-gray-200: #e5e1e2;
    --rb-gray-100: #f2eff0;
    --rb-gray-050: #faf8f8;
    --rb-paper: #ffffff;
    --rb-success: #2e7d4f;
    --rb-success-700: #1f5c39;
    --rb-font-sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
    --rb-shadow-sm: 0 1px 2px rgba(28, 26, 27, 0.08), 0 1px 3px rgba(28, 26, 27, 0.06);
    --rb-shadow-md: 0 4px 12px rgba(28, 26, 27, 0.10);
    --rb-shadow-lg: 0 12px 32px rgba(28, 26, 27, 0.14);

    --top-h: 76px;
    --panel-w: clamp(320px, 30vw, 460px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--rb-font-sans);
    color: var(--rb-ink);
    background: var(--rb-gray-100);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 4px solid var(--rb-yellow); outline-offset: 2px; }

  /* ---- Top bar ---------------------------------------------------------- */
  .top {
    height: var(--top-h);
    background: var(--rb-red);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .brand { font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: var(--rb-yellow); white-space: nowrap; }
  .brand span { color: #fff; font-weight: 500; letter-spacing: 0; }
  .station {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 20vw;
  }
  .spacer { flex: 1; }
  .tbtn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.65);
    color: #fff;
    border-radius: 12px;
    height: 54px;
    padding: 0 16px;
    font-size: 18px;
    font-weight: 700;
  }
  .undo {
    background: var(--rb-yellow);
    color: var(--rb-ink);
    border: 0;
    border-radius: 12px;
    height: 62px;
    width: 250px;
    padding: 4px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }
  .undo .u-main { font-size: 23px; font-weight: 700; }
  .undo .u-sub { font-size: 13px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Layout ----------------------------------------------------------- */
  .layout {
    display: grid;
    grid-template-columns: 1fr var(--panel-w);
    height: calc(100vh - var(--top-h));
    height: calc(100dvh - var(--top-h));
  }
  .main { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }

  /* ---- Home: one huge tile per booth ----------------------------------- */
  .home { flex: 1; display: grid; gap: 16px; grid-auto-flow: column; grid-auto-columns: 1fr; min-height: 0; }
  .cat {
    border: 0;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    box-shadow: var(--rb-shadow-md);
    position: relative;
    text-align: center;
  }
  .cat .c-name { font-size: clamp(30px, 4.6vw, 84px); font-weight: 700; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
  .cat .c-hint { font-size: clamp(15px, 1.7vw, 26px); font-weight: 500; }
  .cat .c-go { font-size: clamp(14px, 1.4vw, 20px); opacity: 0.85; }
  .theme-red { background: var(--rb-red); color: #fff; }
  .theme-yellow { background: var(--rb-yellow); color: var(--rb-ink); }
  .theme-ink { background: var(--rb-ink); color: #fff; }
  .theme-paper { background: #fff; color: var(--rb-red); box-shadow: inset 0 0 0 5px var(--rb-red), var(--rb-shadow-md); }
  .cat:active, .item:active, .start:active, .pop:active { transform: scale(0.985); }
  .badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: #fff;
    color: var(--rb-ink);
    border: 2px solid var(--rb-ink);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 18px;
    font-weight: 700;
  }

  /* ---- Category screen -------------------------------------------------- */
  .cat-head { display: flex; align-items: center; gap: 16px; }
  .back {
    height: 66px;
    padding: 0 26px;
    border-radius: 14px;
    border: 3px solid var(--rb-ink);
    background: #fff;
    font-size: 26px;
    font-weight: 700;
  }
  .cat-title { font-size: 32px; font-weight: 700; }
  .cat-tip { font-size: 15px; color: var(--rb-gray-600); text-align: right; }
  .walkoff-btn {
    height: 66px;
    padding: 0 18px;
    border-radius: 14px;
    border: 3px dashed var(--rb-gray-500);
    background: transparent;
    font-size: 18px;
    font-weight: 700;
    color: var(--rb-gray-700);
  }
  .items { flex: 1; display: grid; gap: 14px; min-height: 0; grid-auto-rows: 1fr; }
  .items.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .items.cols-1 { grid-template-columns: 1fr; }
  .tile { position: relative; min-height: 0; display: flex; }
  .item {
    flex: 1;
    min-height: 0;
    border-radius: 20px;
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 18px 62px;
    text-align: center;
    box-shadow: var(--rb-shadow-md);
    position: relative;
  }
  .item .i-name { font-size: clamp(24px, 2.7vw, 46px); font-weight: 700; line-height: 1.1; }
  .item .i-price { font-size: clamp(22px, 2.3vw, 38px); font-weight: 700; }
  .item .i-note { font-size: clamp(14px, 1.2vw, 19px); opacity: 0.88; }
  .items.cols-1 .i-name { font-size: clamp(40px, 6vw, 100px); }
  .items.cols-1 .i-price { font-size: clamp(26px, 3vw, 48px); }
  .items.cols-1 .i-note { font-size: clamp(16px, 1.6vw, 24px); }
  .style-primary { background: var(--rb-red); color: #fff; }
  .style-outline { background: #fff; color: var(--rb-red); box-shadow: inset 0 0 0 5px var(--rb-red), var(--rb-shadow-md); }
  .style-accent { background: var(--rb-yellow); color: var(--rb-ink); }
  .style-ink { background: var(--rb-ink); color: #fff; }
  .items.photos { grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .photo-item { padding: 8px 8px 10px; gap: 6px; justify-content: flex-start; background: var(--rb-yellow); color: var(--rb-ink); }
  .photo-item .ph {
    flex: 1;
    min-height: 0;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-none { font-size: clamp(36px, 4.5vw, 72px); font-weight: 700; color: var(--rb-gray-300); }
  .photo-item .i-name { font-size: clamp(16px, 1.6vw, 26px); line-height: 1.1; }
  .photo-item .badge { top: 10px; left: 10px; z-index: 1; }
  .photo-item .i-cards { font-size: clamp(16px, 1.6vw, 26px); font-weight: 700; color: var(--rb-red); }
  .prize-item { background: #fff; box-shadow: inset 0 0 0 4px var(--rb-red), var(--rb-shadow-md); }
  .stock {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 16px;
    font-weight: 700;
    background: #fff;
    color: var(--rb-ink);
    border: 2px solid var(--rb-ink);
  }
  .stock.low { background: var(--rb-red); color: #fff; border-color: var(--rb-red); }
  .stock.out { background: var(--rb-ink); color: #fff; }
  .group-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
    background: var(--rb-yellow-100);
    border: 2px solid var(--rb-yellow);
    border-radius: 12px;
    padding: 8px 12px;
  }
  .typeqty {
    position: absolute;
    right: 12px;
    bottom: 12px;
    height: 46px;
    padding: 0 16px;
    border-radius: 10px;
    border: 2px solid var(--rb-ink);
    background: #fff;
    color: var(--rb-ink);
    font-size: 17px;
    font-weight: 700;
  }

  /* ---- Right panel (current customer, or Battle queue) ----------------- */
  .panel {
    background: #fff;
    border-left: 1px solid var(--rb-gray-200);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: auto;
    padding: 16px;
    gap: 12px;
  }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .p-title { font-size: 24px; font-weight: 700; }
  .p-sub { color: var(--rb-gray-600); font-size: 15px; text-align: right; }
  .lines { flex: 1; overflow: auto; min-height: 70px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--rb-gray-500); font-size: 20px; text-align: center; margin: auto; padding: 16px; }
  .line {
    border: 2px solid var(--rb-gray-200);
    border-radius: 14px;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .line.pulse { animation: pulse 600ms ease-out; }
  @keyframes pulse { from { background: var(--rb-yellow-100); border-color: var(--rb-yellow); } to { background: #fff; } }
  .l-info { min-width: 0; }
  .l-name { font-size: 18px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .l-sub { font-size: 15px; color: var(--rb-gray-600); margin-top: 2px; }
  .l-sub b { color: var(--rb-red); font-size: 17px; }
  .l-ctl { display: flex; align-items: center; gap: 6px; }
  .step {
    width: 52px;
    height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-gray-300);
    background: var(--rb-gray-050);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }
  .step.sm { width: 46px; height: 46px; font-size: 24px; }
  .qty {
    min-width: 64px;
    height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-ink);
    background: #fff;
    font-size: 26px;
    font-weight: 700;
  }
  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px solid var(--rb-ink); padding-top: 10px; }
  .t-label { font-size: 22px; font-weight: 700; }
  .t-val { font-size: 46px; font-weight: 700; color: var(--rb-red); }
  .box-split { margin-top: -6px; display: flex; flex-direction: column; gap: 2px; font-size: 17px; color: var(--rb-gray-700); }
  .box-split div { display: flex; justify-content: space-between; }
  .box-split b { color: var(--rb-ink); }
  .demo { display: flex; flex-direction: column; gap: 8px; }
  .d-label { font-size: 14px; font-weight: 700; color: var(--rb-gray-600); text-transform: uppercase; letter-spacing: 0.04em; }
  .chips { display: grid; gap: 8px; }
  .chips.c2 { grid-template-columns: repeat(2, 1fr); }
  .chips.c3 { grid-template-columns: repeat(3, 1fr); }
  .chips.c4 { grid-template-columns: repeat(4, 1fr); }
  .chips.c5 { grid-template-columns: repeat(5, 1fr); }
  .chip {
    min-height: 50px;
    border-radius: 12px;
    border: 2px solid var(--rb-gray-300);
    background: #fff;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
    padding: 4px;
  }
  .chip small { display: block; font-size: 12px; font-weight: 500; color: var(--rb-gray-600); }
  .chip.on { background: var(--rb-ink); color: #fff; border-color: var(--rb-ink); }
  .chip.on small { color: #fff; }
  .chip.sm { min-height: 44px; font-size: 15px; }
  .done {
    min-height: 92px;
    border-radius: 16px;
    border: 0;
    background: var(--rb-success);
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
  }
  .done small { display: block; font-size: 14px; font-weight: 500; opacity: 0.9; }

  /* ---- Balloon Battle -------------------------------------------------- */
  .arena { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .now { background: #fff; border-radius: 20px; box-shadow: var(--rb-shadow-md); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .now.fill { flex: 1; min-height: 0; }
  .now-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .now-title { font-size: 28px; font-weight: 700; }
  .timer { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--rb-red); }
  .players { flex: 1; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); min-height: 0; }
  .pcard { border: 3px solid var(--rb-ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .pname { font-size: clamp(28px, 3.2vw, 50px); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  .ptix { font-size: 20px; color: var(--rb-gray-700); }
  .ptix b { color: var(--rb-red); }
  .wrow { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .wrow .wcount { font-size: 30px; min-width: 36px; text-align: center; }
  .huge {
    min-height: 96px;
    border-radius: 18px;
    border: 0;
    font-size: clamp(24px, 2.6vw, 36px);
    font-weight: 700;
    line-height: 1.15;
    padding: 10px 16px;
  }
  .huge small { display: block; font-size: 16px; font-weight: 500; opacity: 0.92; }
  .huge.go { background: var(--rb-success); color: #fff; }
  .huge.red { background: var(--rb-red); color: #fff; }
  .huge.yellow { background: var(--rb-yellow); color: var(--rb-ink); }
  .linkbtn { background: none; border: 0; color: var(--rb-gray-600); font-size: 16px; text-decoration: underline; align-self: center; padding: 8px 12px; }
  .prompt { font-size: clamp(24px, 2.6vw, 38px); font-weight: 700; text-align: center; }
  .pops { flex: 1; display: grid; gap: 14px; min-height: 0; }
  .pops.c2 { grid-template-columns: repeat(2, 1fr); }
  .pops.c3 { grid-template-columns: repeat(3, 1fr); }
  .pops.c4 { grid-template-columns: repeat(4, 1fr); }
  .pop {
    border-radius: 18px;
    border: 0;
    background: var(--rb-yellow);
    color: var(--rb-ink);
    font-size: clamp(48px, 7vw, 110px);
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 150px;
    line-height: 1;
    box-shadow: var(--rb-shadow-md);
  }
  .pop small { font-size: clamp(16px, 1.6vw, 24px); font-weight: 600; }
  .pop.win { background: var(--rb-red); color: #fff; font-size: clamp(32px, 4vw, 64px); }
  .result { background: var(--rb-yellow-100); border: 3px solid var(--rb-yellow); border-radius: 18px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .r-title { font-size: 18px; font-weight: 700; color: var(--rb-gray-700); }
  .r-line { font-size: clamp(22px, 2.2vw, 32px); font-weight: 700; }
  .r-line .give { color: var(--rb-red); }
  .r-line .none { color: var(--rb-gray-600); font-weight: 500; }
  .starts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
  .start {
    border-radius: 22px;
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    text-align: center;
    box-shadow: var(--rb-shadow-md);
    min-height: 140px;
  }
  .start .s-big { font-size: clamp(28px, 3.4vw, 56px); font-weight: 700; line-height: 1.05; }
  .start .s-sub { font-size: clamp(17px, 1.8vw, 26px); overflow-wrap: anywhere; }
  .qform { display: flex; flex-direction: column; gap: 8px; }
  .qform input {
    font: inherit;
    font-size: 24px;
    padding: 10px 14px;
    border: 3px solid var(--rb-ink);
    border-radius: 12px;
    width: 100%;
  }
  .qadd {
    min-height: 64px;
    border-radius: 14px;
    border: 0;
    background: var(--rb-ink);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }
  .qrow {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    border: 2px solid var(--rb-gray-200);
    border-radius: 14px;
    padding: 8px 10px;
  }
  .qrow.first { border-color: var(--rb-yellow); background: var(--rb-yellow-100); }
  .q-pos { font-size: 24px; font-weight: 700; min-width: 28px; text-align: center; }

  /* ---- Toast ------------------------------------------------------------ */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(var(--top-h) + 14px);
    transform: translate(-50%, -16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 60;
    font-size: 26px;
    font-weight: 700;
    padding: 18px 28px;
    border-radius: 16px;
    border: 4px solid var(--rb-ink);
    box-shadow: var(--rb-shadow-lg);
    width: max-content;
    max-width: min(92vw, 900px);
    text-align: center;
    background: #fff;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.undo { background: var(--rb-yellow); color: var(--rb-ink); }
  .toast.ok { background: var(--rb-success); color: #fff; border-color: var(--rb-success-700); }
  .toast.warn { background: var(--rb-red); color: #fff; border-color: var(--rb-red-700); }

  .banner {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 70;
    background: var(--rb-red);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 14px 18px;
    text-align: center;
  }

  /* ---- Modals ----------------------------------------------------------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 27, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 40;
  }
  .dialog {
    background: #fff;
    border-radius: 20px;
    width: min(860px, 100%);
    max-height: calc(100dvh - 32px);
    overflow: auto;
    padding: 24px;
    box-shadow: var(--rb-shadow-lg);
  }
  .dialog.narrow { width: min(560px, 100%); }
  .d-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .d-title { font-size: 28px; font-weight: 700; margin: 0; }
  .close {
    height: 54px;
    padding: 0 22px;
    border-radius: 12px;
    border: 2px solid var(--rb-ink);
    background: #fff;
    font-size: 20px;
    font-weight: 700;
  }
  .kp-display {
    font-size: 68px;
    font-weight: 700;
    text-align: center;
    border: 3px solid var(--rb-ink);
    border-radius: 16px;
    padding: 6px;
    min-height: 100px;
  }
  .kp-display.placeholder { color: var(--rb-gray-300); }
  .kp-price { text-align: center; font-size: 22px; color: var(--rb-gray-700); margin: 8px 0 14px; min-height: 28px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    height: 78px;
    border-radius: 14px;
    border: 2px solid var(--rb-gray-300);
    background: var(--rb-gray-050);
    font-size: 34px;
    font-weight: 700;
  }
  .key.small { font-size: 22px; }
  .row { display: flex; gap: 12px; margin-top: 14px; align-items: center; }
  .btn {
    flex: 1;
    min-height: 68px;
    border-radius: 14px;
    font-size: 23px;
    font-weight: 700;
    border: 2px solid var(--rb-ink);
    background: #fff;

</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="assertive"></div>

<script>
'use strict';

/* ==========================================================================
   Booths, items and prices. Edit this block to change sale prices or reuse
   the tracker at another event. Items in a price group (the clickers) are
   priced together by total quantity within one customer, so any mix of
   designs gets the tier price. Balloon Battle prices live in Settings so
   they can change on the day.
   ========================================================================== */
const PRICE_GROUPS = {
  // price(n) = floor(n / 3) * 10 + [0, 4, 7][n % 3]  ->  4, 7, 10, 14, 17, 20 ...
  clicker: { name: 'Clickers', unit: 'clicker', tiers: [0, 4, 7], bundle: { size: 3, price: 10 } },
};

// Clicker designs: [id, button label, photo file name in clicker_photos/ if not the id].
// Keep ids stable once sales exist; change the label or photo name instead.
const CLICKER_DESIGNS = [
  ['egg_tart', 'Egg tart'],
  ['hot_dog_bun', 'Hot dog bun'],
  ['smores', "S'mores"],
  ['chocolate_bar', 'Chocolate bar'],
  ['avocado', 'Avocado'],
  ['dumpling', 'Dumpling'],
  ['creeper', 'Creeper'],
  ['oreo', 'Oreo'],
  ['spam_musubi', 'Spam musubi', 'musubi'],
  ['salmon_nigiri', 'Salmon nigiri'],
  ['lego_brick', 'LEGO brick', 'lego'],
  ['wd40', 'WD-40'],
  ['burger', 'Burger'],
];
const PHOTO_DIR = 'clicker_photos/';

// Prize Table: [id, button label, cards]. Photos go in prize_photos/<id>.jpg.
// Placeholders until the real prize list and photos arrive. Card prices and
// starting stock can be changed per laptop in Settings.
const PRIZES = [
  ['small', 'Small prize', 3],
  ['medium', 'Medium prize', 6],
  ['grand', 'Grand prize', 9],
];
const PHOTO_EXTS = ['jpg', 'png', 'jpeg', 'webp', 'JPG', 'PNG', 'JPEG'];

const CATEGORIES = [
  {
    id: 'clickers', kind: 'sale', name: 'Clickers', theme: 'yellow', walkoffs: true, layout: 'photos',
    hint: '1 = 4 tix · 2 = 7 · 3 = 10',
    tip: 'Tap a design = +1 · mix any designs<br>1 = 4 · 2 = 7 · 3 = 10 · 4 = 14 · 5 = 17 · 6 = 20',
    items: CLICKER_DESIGNS.map(([id, name, photo]) => ({ id: 'clicker_' + id, name, photo: photo || id, group: 'clicker' }))
      // "clicker" keeps its v1.0 id so older saved sales still load.
      .concat([{ id: 'clicker', name: 'Other design', group: 'clicker' }]),
  },
  {
    id: 'copters', kind: 'sale', name: 'Copters', theme: 'red', walkoffs: true,
    hint: 'Full kit = 5 tix · add-ons 1 to 3',
    items: [
      { id: 'kit', name: 'Full kit', price: 5, style: 'primary', note: 'Launcher + propeller + ripcord' },
      { id: 'kit_toroidal', name: 'Kit w/ toroidal', price: 6, style: 'primary', note: 'Launcher + toroidal + ripcord' },
      { id: 'launcher', name: 'Launcher only', price: 3, style: 'outline', note: 'Rare: spares, group buys' },
      { id: 'propeller', name: 'Extra propeller', price: 1, style: 'accent' },
      { id: 'toroidal', name: 'Toroidal propeller', price: 2, style: 'accent' },
      { id: 'ripcord', name: 'Extra ripcord', price: 1, style: 'accent' },
    ],
  },
  { id: 'battle', kind: 'battle', name: 'Balloon Battle', theme: 'ink', defaultOn: false },
  {
    id: 'prizes', kind: 'prizes', name: 'Prize Table', theme: 'paper', defaultOn: false, layout: 'photos',
    hint: 'Trade Pokemon cards for prizes',
    tip: 'Tap a prize = +1<br>Collect the cards shown on the right',
    items: PRIZES.map(([id, name, cards]) => ({ id: 'prize_' + id, name, cards, photo: id, photoDir: 'prize_photos/' })),
  },
];

const BATTLE_DEFAULTS = {
  match: 5,          // tix per player per match
  rematch: 6,        // tix per player for an instant rematch (5 + 1 skip-the-line fee)
  weapon: 1,         // tix per extra weapon
  cardsPerPop: 3,    // Pokemon cards per balloon popped (cards come bundled in 3s)
  pvpRule: 'winner', // 'winner' = only the winner is paid; 'both' = both players paid per pop
};
const BALLOONS = 3;
const NET_PER_TICKET = 0.90;           // CCA keeps 10%
const PRIZE_DOLLARS_PER_CARD = 5 / 9;  // a 9-card prize costs about $5
const DEFAULT_CYCLE_MIN = 3;           // ~2 min match + ~1 min balloon reset

const AGES = [
  { id: 'kid', label: 'Kid', sub: '12 and under' },
  { id: 'teen', label: 'Teen', sub: '13 to 17' },
  { id: 'adult', label: 'Adult', sub: '18+' },
];
const GENDERS = [
  { id: 'm', label: 'Male' },
  { id: 'f', label: 'Female' },
];
const WALKOFF_REASONS = [
  { id: 'demo', label: 'Demo unit' },
  { id: 'giveaway', label: 'Giveaway' },
  { id: 'broken', label: 'Broken' },
  { id: 'other', label: 'Other' },
];

const STORAGE_BASE = 'rambots_ramathon_sales_v1';
const DATA_KEYS = ['customers', 'currentId', 'nextNo', 'tradeId', 'nextTradeNo', 'walkoffs', 'nextWalkoffNo',
  'queue', 'matches', 'matchId', 'lastMatchId', 'nextMatchNo'];

/* ==========================================================================
   Lookups and pricing
   ========================================================================== */
const ITEMS = {};
CATEGORIES.filter(c => c.items).forEach(cat => cat.items.forEach(it => { ITEMS[it.id] = Object.assign({ cat: cat.id }, it); }));
const catById = id => CATEGORIES.find(c => c.id === id);

function groupPrice(groupId, n) {
  const g = PRICE_GROUPS[groupId];
  if (n <= 0) return 0;
  return Math.floor(n / g.bundle.size) * g.bundle.price + g.tiers[n % g.bundle.size];
}

// Prize card price: the Settings override if set, else the PRIZES default.
function cardsFor(itemId) {
  const o = state.settings.prizes[itemId];
  return o && Number.isFinite(o.cards) ? o.cards : ITEMS[itemId].cards;
}
const isPrize = itemId => ITEMS[itemId].cards != null;
const kindOf = itemId => (isPrize(itemId) ? 'trade' : 'sale');
// A prize line remembers its card price, so editing it later never rewrites past trades.
const newLine = (itemId, qty) => (isPrize(itemId) ? { item: itemId, qty, unit: cardsFor(itemId) } : { item: itemId, qty });

// Price of qty of one item bought on its own (group items use the tier price;
// prizes are priced in cards).
function linePrice(itemId, qty) {
  const it = ITEMS[itemId];
  if (!it || qty <= 0) return 0;
  if (it.cards != null) return cardsFor(itemId) * qty;
  return it.group ? groupPrice(it.group, qty) : it.price * qty;
}

// Tickets per line for one customer. Group items share the tier price: each
// line gets the extra tickets it adds on top of the lines before it, so the
// lines always add up to the customer's total.
function lineTixList(c) {
  const sofar = {};
  return c.lines.map(l => {
    const it = ITEMS[l.item];
    if (l.unit != null) return l.unit * l.qty;
    if (!it.group) return it.price * l.qty;
    const before = sofar[it.group] || 0;
    sofar[it.group] = before + l.qty;
    return groupPrice(it.group, before + l.qty) - groupPrice(it.group, before);
  });
}
const customerTotal = c => lineTixList(c).reduce((sum, t) => sum + t, 0);
const unitsOf = c => c.lines.reduce((sum, l) => sum + l.qty, 0);
const qtyOf = (c, itemId) => { const l = c && c.lines.find(x => x.item === itemId); return l ? l.qty : 0; };
const groupUnits = (c, groupId) => c ? c.lines.filter(l => ITEMS[l.item].group === groupId).reduce((s, l) => s + l.qty, 0) : 0;
const catUnits = (c, catId) => c ? c.lines.filter(l => ITEMS[l.item].cat === catId).reduce((s, l) => s + l.qty, 0) : 0;
function catTix(c, catId) {
  if (!c) return 0;
  const tix = lineTixList(c);
  return c.lines.reduce((s, l, i) => s + (ITEMS[l.item].cat === catId ? tix[i] : 0), 0);
}

/* ==========================================================================
   State, persistence, undo
   ========================================================================== */
let storageOK = true;
let otherTab = false;

function defaultState() {
  const cats = {};
  CATEGORIES.forEach(c => { cats[c.id] = c.defaultOn !== false; });
  return {
    settings: { station: 'Laptop 1', cats, demographics: true, battle: Object.assign({}, BATTLE_DEFAULTS), prizes: {} },
    customers: [], currentId: null, nextNo: 1, tradeId: null, nextTradeNo: 1,
    walkoffs: [], nextWalkoffNo: 1,
    queue: [], matches: [], matchId: null, lastMatchId: null, nextMatchNo: 1,
    lastExport: null,
  };
}

function hydrate(raw) {
  const base = defaultState();
  if (!raw) return base;
  const saved = JSON.parse(raw);
  const ss = saved.settings || {};
  saved.settings = Object.assign({}, base.settings, ss, {
    cats: Object.assign({}, base.settings.cats, ss.cats || {}),
    battle: Object.assign({}, base.settings.battle, ss.battle || {}),
    prizes: Object.assign({}, ss.prizes || {}),
  });
  const merged = Object.assign(base, saved);
  // An item removed or renamed in the config would otherwise break saved data
  // on this laptop: an old clicker design counts as "Other design"; anything
  // else that no longer exists (e.g. Plinko) is dropped.
  const fix = id => (ITEMS[id] ? id : (String(id).startsWith('clicker') ? 'clicker' : null));
  merged.customers.forEach(c => {
    c.lines.forEach(l => { l.item = fix(l.item); });
    c.lines = c.lines.filter(l => l.item);
  });
  merged.walkoffs.forEach(w => { w.item = fix(w.item); });
  merged.walkoffs = merged.walkoffs.filter(w => w.item);
  return merged;
}

function load() {
  try {
    return hydrate(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    storageOK = false;
    return defaultState();
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
}

// A booth link (index.html?booth=sales, ?booth=battle or ?booth=prizes) locks
// this laptop to its booth so nobody has to touch Settings on the day. Each
// booth link keeps its own saved data, so two booth tabs never collide.
const BOOTH_PRESETS = {
  sales: { cats: ['clickers', 'copters'], station: 'Sales table' },
  battle: { cats: ['battle'], station: 'Balloon Battle' },
  prizes: { cats: ['prizes'], station: 'Prize Table' },
};
const boothParam = new URLSearchParams(location.search).get('booth');
const preset = BOOTH_PRESETS[boothParam] || null;
const STORAGE_KEY = preset ? `${STORAGE_BASE}_${boothParam}` : STORAGE_BASE;

function applyPreset() {
  if (!preset) return;
  Object.keys(state.settings.cats).forEach(id => { state.settings.cats[id] = preset.cats.includes(id); });
  if (state.settings.station === 'Laptop 1') state.settings.station = preset.station;
}

let state = load();
applyPreset();
save();

const blankDraft = () => ({ name: '', weapons: 0, age: null, gender: null });
const view = { screen: 'home', modal: null, pulse: null, pvpWinner: null, qDraft: blankDraft(), focusName: false };
const undoStack = [];
const UNDO_LIMIT = 200;

function snapshot() {
  const snap = {};
  DATA_KEYS.forEach(k => { snap[k] = state[k]; });
  return JSON.stringify(snap);
}

// Every data change goes through commit() so it can be undone. fn returns the
// human description of the change, which the Undo button and toast show.
function commit(fn) {
  const snap = snapshot();
  const label = fn();
  if (!label) return null;
  undoStack.push({ snap, label });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  save();
  return label;
}

function undo() {
  const u = undoStack.pop();
  if (!u) { toast('Nothing to undo', 'info'); return; }
  Object.assign(state, JSON.parse(u.snap));
  view.pulse = null;
  view.pvpWinner = null;
  save();
  render();
  toast('Undid: ' + u.label, 'undo');
}

const now = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// Two kinds of "customer": a sale (paid in tickets) and a prize trade (paid in
// cards). Each kind has its own open record and numbering.
const curKey = kind => (kind === 'trade' ? 'tradeId' : 'currentId');
const kindOfCustomer = c => c.kind || 'sale';
const currentOf = kind => state.customers.find(c => c.id === state[curKey(kind)]) || null;
const current = () => currentOf('sale');
const activeKind = () => (view.screen === 'prizes' ? 'trade' : 'sale');
const unitWord = kind => (kind === 'trade' ? 'cards' : 'tix');
const recordWord = kind => (kind === 'trade' ? 'Trade' : 'Customer');

function ensureCurrent(kind) {
  let c = currentOf(kind);
  if (!c) {
    c = {
      id: uid(), kind, no: kind === 'trade' ? state.nextTradeNo++ : state.nextNo++, station: state.settings.station,
      openedAt: now(), closedAt: null, lines: [], age: null, gender: null, voided: false,
    };
    state.customers.push(c);
    state[curKey(kind)] = c.id;
  }
  return c;
}

// Prize stock: starting count from Settings minus every trade line (open
// trades included). null = not tracked.
function stockStart(itemId) {
  const o = state.settings.prizes[itemId];
  return o && Number.isFinite(o.stock) ? o.stock : null;
}
function stockLeft(itemId) {
  const start = stockStart(itemId);
  if (start == null) return null;
  return start - state.customers.filter(c => kindOfCustomer(c) === 'trade' && !c.voided).reduce((s, c) => s + qtyOf(c, itemId), 0);
}

/* ==========================================================================
   Sale actions
   ========================================================================== */
function stockWarning(itemId) {
  if (!isPrize(itemId)) return;
  const left = stockLeft(itemId);
  if (left != null && left < 0) toast(`Count says no ${ITEMS[itemId].name} left. Check the bin.`, 'warn');
}

function addItem(itemId, n) {
  const it = ITEMS[itemId];
  const kind = kindOf(itemId);
  const before = currentOf(kind) ? customerTotal(currentOf(kind)) : 0;
  commit(() => {
    const c = ensureCurrent(kind);
    const line = c.lines.find(l => l.item === itemId);
    if (line) line.qty += n; else c.lines.push(newLine(itemId, n));
    return `+${n} ${it.name} (+${customerTotal(c) - before} ${unitWord(kind)})`;
  });
  view.pulse = itemId;
  render();
  stockWarning(itemId);
}

function removeOne(itemId) {
  const kind = kindOf(itemId);
  const c = currentOf(kind);
  if (!c) return;
  const it = ITEMS[itemId];
  const before = customerTotal(c);
  commit(() => {
    const line = c.lines.find(l => l.item === itemId);
    if (!line) return null;
    line.qty -= 1;
    if (line.qty <= 0) c.lines = c.lines.filter(l => l !== line);
    return `−1 ${it.name} (−${before - customerTotal(c)} ${unitWord(kind)})`;
  });
  view.pulse = itemId;
  render();
}

function setQty(itemId, q) {
  const it = ITEMS[itemId];
  const kind = kindOf(itemId);
  const old = qtyOf(currentOf(kind), itemId);
  if (q === old) { render(); return; }
  commit(() => {
    const c = ensureCurrent(kind);
    const line = c.lines.find(l => l.item === itemId);
    if (q <= 0) c.lines = c.lines.filter(l => l.item !== itemId);
    else if (line) line.qty = q;
    else c.lines.push(newLine(itemId, q));
    return `${it.name}: ${old} → ${q}`;
  });
  view.pulse = itemId;
  render();
  stockWarning(itemId);
}

function setDemo(field, val) {
  const c = currentOf(activeKind());
  if (!c || !c.lines.length) return;
  const list = field === 'age' ? AGES : GENDERS;
  const name = field === 'age' ? 'Age' : 'Gender';
  commit(() => {
    if (c[field] === val) { c[field] = null; return `${name} cleared`; }
    c[field] = val;
    return `${name}: ${list.find(x => x.id === val).label}`;
  });
  render();
}

function finish(kind) {
  kind = kind || activeKind();
  const c = currentOf(kind);
  if (!c || !c.lines.length) return;
  const total = customerTotal(c);
  const word = recordWord(kind);
  commit(() => {
    c.closedAt = now();
    state[curKey(kind)] = null;
    return `Finished ${word.toLowerCase()} #${c.no} (${total} ${unitWord(kind)})`;
  });
  view.screen = 'home';
  view.pulse = null;
  render();
  toast(`${word} #${c.no} saved · ${total} ${unitWord(kind)}`, 'ok');
}

function setVoided(id, voided) {
  const c = state.customers.find(x => x.id === id);
  if (!c) return;
  const label = commit(() => {
    c.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} ${recordWord(kindOfCustomer(c)).toLowerCase()} #${c.no}`;
  });
  render();
  toast(label + (voided ? ' · Undo brings it back' : ''), voided ? 'warn' : 'ok');
}

/* ---- Walk-offs: stock that left without tickets ----------------------- */
function openWalkoff(catId) {
  const cat = catById(catId);
  view.modal = { type: 'walkoff', cat: catId, item: cat.items[0].id, qty: 1, reason: 'demo' };
  render();
}

function saveWalkoff() {
  const m = view.modal;
  if (!m || m.type !== 'walkoff') return;
  const it = ITEMS[m.item];
  const reason = WALKOFF_REASONS.find(r => r.id === m.reason).label;
  const label = commit(() => {
    state.walkoffs.push({
      id: uid(), no: state.nextWalkoffNo++, at: now(), station: state.settings.station,
      item: m.item, qty: m.qty, reason: m.reason, voided: false,
    });
    return `Walk-off: ${m.qty} ${it.name} (${reason})`;
  });
  view.modal = null;
  render();
  toast('Logged ' + label.toLowerCase(), 'ok');
}

function setWalkoffVoided(id, voided) {
  const w = state.walkoffs.find(x => x.id === id);
  if (!w) return;
  const label = commit(() => {
    w.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} walk-off #${w.no}`;
  });
  render();
  toast(label, voided ? 'warn' : 'ok');
}

/* ==========================================================================
   Balloon Battle
   ========================================================================== */
const bs = () => state.settings.battle;
const playingMatch = () => state.matches.find(m => m.id === state.matchId) || null;
const lastMatch = () => state.matches.find(m => m.id === state.lastMatchId) || null;
const matchTix = m => m.players.reduce((s, p) => s + p.tix, 0);
const matchCards = m => m.players.reduce((s, p) => s + (p.cards || 0), 0);
const matchTitle = m => m.mode === 'pvp' ? `${m.players[0].name} vs ${m.players[1].name}` : `${m.players[0].name} vs House`;
const weaponsText = n => n ? plural(n, 'extra weapon') : 'no extra weapons';

function cardsText(cards) {
  if (!cards) return '0 cards';
  const per = bs().cardsPerPop;
  if (per === 3 && cards % 3 === 0) return `${plural(cards / 3, 'bundle')} (${cards} cards)`;
  return plural(cards, 'card');
}

function queueAdd() {
  const d = view.qDraft;
  const name = d.name.trim() || `Walk-up ${state.queue.length + 1}`;
  commit(() => {
    state.queue.push({ id: uid(), name, weapons: d.weapons, age: d.age, gender: d.gender, addedAt: now() });
    return `Queued ${name} (${weaponsText(d.weapons)})`;
  });
  view.qDraft = blankDraft();
  view.focusName = true;
  render();
}

function queueRemove(id) {
  const q = state.queue.find(x => x.id === id);
  if (!q) return;
  commit(() => {
    state.queue = state.queue.filter(x => x !== q);
    return `Removed ${q.name} from the queue`;
  });
  render();
}

function queueWeapons(id, delta) {
  const q = state.queue.find(x => x.id === id);
  if (!q) return;
  const next = Math.max(0, Math.min(9, q.weapons + delta));
  if (next === q.weapons) return;
  commit(() => {
    const old = q.weapons;
    q.weapons = next;
    return `${q.name}: ${old} → ${next} extra weapons`;
  });
  render();
}

function makePlayer(entry, base) {
  return {
    name: entry.name, weapons: entry.weapons || 0, age: entry.age || null, gender: entry.gender || null,
    base, tix: base + (entry.weapons || 0) * bs().weapon,
    pops: null, won: null, cards: 0, qid: entry.id || null, queuedAt: entry.addedAt || null,
  };
}

function collectToast(m) {
  const parts = m.players.map(p => `${p.name} ${p.tix}`).join(' · ');
  toast(`Collect ${matchTix(m)} tix: ${parts}`, 'ok');
}

function startMatch(mode) {
  if (playingMatch()) { toast('Finish the current match first', 'warn'); return; }
  const need = mode === 'pvp' ? 2 : 1;
  let entries = state.queue.slice(0, need);
  if (mode === 'house' && !entries.length) entries = [{ name: 'Walk-up', weapons: 0 }];
  if (entries.length < need) { toast('vs Player needs 2 people in the queue', 'warn'); return; }
  let m = null;
  commit(() => {
    const ids = entries.map(e => e.id).filter(Boolean);
    state.queue = state.queue.filter(q => !ids.includes(q.id));
    m = {
      id: uid(), no: state.nextMatchNo++, station: state.settings.station, mode, rematch: false,
      startedAt: now(), endedAt: null, status: 'playing', voided: false,
      players: entries.map(e => makePlayer(e, bs().match)),
    };
    state.matches.push(m);
    state.matchId = m.id;
    return `Started match #${m.no}: ${matchTitle(m)} (${matchTix(m)} tix)`;
  });
  view.pvpWinner = null;
  render();
  collectToast(m);
}

function rematch() {
  const lm = lastMatch();
  if (!lm || lm.status !== 'done' || lm.voided || playingMatch()) return;
  let m = null;
  commit(() => {
    m = {
      id: uid(), no: state.nextMatchNo++, station: state.settings.station, mode: lm.mode, rematch: true,
      startedAt: now(), endedAt: null, status: 'playing', voided: false,
      players: lm.players.map(p => makePlayer({ name: p.name, weapons: p.weapons, age: p.age, gender: p.gender }, bs().rematch)),
    };
    state.matches.push(m);
    state.matchId = m.id;
    return `Rematch #${m.no}: ${matchTitle(m)} (${matchTix(m)} tix)`;
  });
  view.pvpWinner = null;
  render();
  collectToast(m);
}

function matchWeapons(pi, delta) {
  const m = playingMatch();
  if (!m || m.status !== 'playing') return;
  const p = m.players[pi];
  const next = Math.max(0, Math.min(9, p.weapons + delta));
  if (next === p.weapons) return;
  commit(() => {
    const old = p.weapons;
    p.weapons = next;
    p.tix = p.base + next * bs().weapon;
    return `${p.name}: ${old} → ${next} extra weapons (${delta > 0 ? '+' : '−'}${bs().weapon} tix)`;
  });
  render();
}

function endMatch() {
  const m = playingMatch();
  if (!m || m.status !== 'playing') return;
  commit(() => {
    m.status = 'scoring';
    m.endedAt = now();
    return `Ended match #${m.no}`;
  });
  view.pvpWinner = null;
  render();
}

function cancelMatch() {
  const m = playingMatch();
  if (!m) return;
  commit(() => {
    state.matches = state.matches.filter(x => x !== m);
    state.matchId = null;
    // Put the players back at the front of the queue, in their original order.
    const back = m.players.map(p => ({
      id: p.qid || uid(), name: p.name, weapons: p.weapons, age: p.age, gender: p.gender, addedAt: p.queuedAt || m.startedAt,
    }));
    state.queue = back.concat(state.queue);
    if (state.nextMatchNo === m.no + 1) state.nextMatchNo = m.no; // reuse the number
    return `Cancelled match #${m.no} (no tix, players back in queue)`;
  });
  view.pvpWinner = null;
  render();
  toast(`Match #${m.no} cancelled · hand back ${matchTix(m)} tix`, 'warn');
}

function finishScoring(m, label) {
  m.status = 'done';
  if (!m.endedAt) m.endedAt = now();
  state.matchId = null;
  state.lastMatchId = m.id;
  return label;
}

function scoreHouse(pops) {
  const m = playingMatch();
  if (!m || m.status !== 'scoring' || m.mode !== 'house') return;
  const p = m.players[0];
  commit(() => {
    p.pops = pops;
    p.won = pops === BALLOONS;
    p.cards = pops * bs().cardsPerPop;
    return finishScoring(m, `Match #${m.no}: ${p.name} popped ${pops} (${p.cards} cards)`);
  });
  render();
}

function scorePvpLoser(pops) {
  const m = playingMatch();
  const w = view.pvpWinner;
  if (!m || m.status !== 'scoring' || m.mode !== 'pvp' || w == null) return;
  const winner = m.players[w];
  const loser = m.players[1 - w];
  commit(() => {
    winner.pops = BALLOONS;
    winner.won = true;
    winner.cards = BALLOONS * bs().cardsPerPop;
    loser.pops = pops;
    loser.won = false;
    loser.cards = bs().pvpRule === 'both' ? pops * bs().cardsPerPop : 0;
    return finishScoring(m, `Match #${m.no}: ${winner.name} beat ${loser.name} (${matchCards(m)} cards)`);
  });
  view.pvpWinner = null;
  render();
}

function setMatchVoided(id, voided) {
  const m = state.matches.find(x => x.id === id);
  if (!m || m.status !== 'done') return;
  const label = commit(() => {
    m.voided = voided;
    return `${voided ? 'Voided' : 'Restored'} match #${m.no}`;
  });
  render();
  toast(label, voided ? 'warn' : 'ok');
}

function avg(list) { return list.reduce((s, x) => s + x, 0) / list.length; }

function cycleMinutes() {
  const starts = state.matches.filter(m => !m.voided).map(m => Date.parse(m.startedAt)).sort((a, b) => a - b);
  const gaps = [];
  for (let i = 1; i < starts.length; i++) {
    const g = (starts[i] - starts[i - 1]) / 60000;
    if (g > 0.3 && g < 15) gaps.push(g);
  }
  const recent = gaps.slice(-6);
  return recent.length ? avg(recent) : DEFAULT_CYCLE_MIN;
}

function playersPerMatch() {
  const recent = state.matches.filter(m => !m.voided).slice(-6);
  return recent.length ? avg(recent.map(m => m.players.length)) : 1;
}

function waitText(index) {
  const ahead = Math.ceil((index + 1) / playersPerMatch()) - (playingMatch() ? 0 : 1);
  if (ahead <= 0) return 'next up';
  return `~${Math.max(1, Math.round(ahead * cycleMinutes()))} min`;
}

/* ==========================================================================
   Totals
   ========================================================================== */
function computeTotals() {
  const done = kind => state.customers.filter(c => kindOfCustomer(c) === kind && c.closedAt && !c.voided && c.lines.length);
  const sold = done('sale');
  const trades = done('trade');
  const byPrize = {};
  trades.forEach(c => {
    const cards = lineTixList(c);
    c.lines.forEach((l, i) => {
      const b = byPrize[l.item] || (byPrize[l.item] = { given: 0, cards: 0 });
      b.given += l.qty;
      b.cards += cards[i];
    });
  });
  const prizes = {
    trades: trades.length,
    given: Object.values(byPrize).reduce((s, b) => s + b.given, 0),
    cards: Object.values(byPrize).reduce((s, b) => s + b.cards, 0),
  };
  const byItem = {};
  const byBox = {};
  sold.forEach(c => {
    const tix = lineTixList(c);
    c.lines.forEach((l, i) => {
      const b = byItem[l.item] || (byItem[l.item] = { units: 0, tix: 0, walkoffs: 0 });
      const t = tix[i];
      b.units += l.qty;
      b.tix += t;
      byBox[ITEMS[l.item].cat] = (byBox[ITEMS[l.item].cat] || 0) + t;
    });
  });
  state.walkoffs.filter(w => !w.voided).forEach(w => {
    const b = byItem[w.item] || (byItem[w.item] = { units: 0, tix: 0, walkoffs: 0 });
    b.walkoffs += w.qty;
  });
  const matches = state.matches.filter(m => !m.voided);
  const battle = {
    matches: matches.length,
    house: matches.filter(m => m.mode === 'house').length,
    pvp: matches.filter(m => m.mode === 'pvp').length,
    rematches: matches.filter(m => m.rematch).length,
    players: matches.reduce((s, m) => s + m.players.length, 0),
    weapons: matches.reduce((s, m) => s + m.players.reduce((t, p) => t + p.weapons, 0), 0),
    tix: matches.reduce((s, m) => s + matchTix(m), 0),
    cards: matches.reduce((s, m) => s + matchCards(m), 0),
    avgMin: null,
  };
  const timed = matches.filter(m => m.status === 'done' && m.endedAt);
  if (timed.length) battle.avgMin = avg(timed.map(m => (Date.parse(m.endedAt) - Date.parse(m.startedAt)) / 60000));
  if (battle.tix) byBox.battle = battle.tix;
  const tix = Object.values(byBox).reduce((s, x) => s + x, 0);
  return { sold, byItem, byBox, battle, matches, tix, trades, byPrize, prizes };
}

/* ==========================================================================
   CSV export (one row per item line / player; stack files from each laptop)
   ========================================================================== */
function pad(n) { return String(n).padStart(2, '0'); }
function localStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function labelOf(list, id) { const x = list.find(v => v.id === id); return x ? x.label : ''; }

function buildCSV() {
  const header = ['station', 'record', 'status', 'opened_at', 'closed_at', 'category', 'item', 'qty',
    'item_tickets', 'record_total_tickets', 'age', 'gender',
    'battle_mode', 'player', 'balloons_popped', 'won', 'cards_paid', 'walkoff_reason', 'cards_redeemed'];
  const rows = [header];
  const blankBattle = ['', '', '', '', ''];
  state.customers.forEach(c => {
    if (!c.lines.length) return;
    const trade = kindOfCustomer(c) === 'trade';
    const status = c.voided ? 'voided' : (c.closedAt ? (trade ? 'traded' : 'sold') : 'open');
    const total = customerTotal(c);
    const amounts = lineTixList(c);
    c.lines.forEach((l, i) => {
      const it = ITEMS[l.item];
      rows.push([c.station, (trade ? 'T' : 'S') + c.no, status, localStamp(c.openedAt), localStamp(c.closedAt),
        catById(it.cat).name, it.name, l.qty, trade ? 0 : amounts[i], trade ? 0 : total,
        labelOf(AGES, c.age), labelOf(GENDERS, c.gender)].concat(blankBattle, ['', trade ? amounts[i] : '']));
    });
  });
  state.walkoffs.forEach(w => {
    const it = ITEMS[w.item];
    rows.push([w.station, 'W' + w.no, w.voided ? 'voided' : 'walk-off', localStamp(w.at), localStamp(w.at),
      catById(it.cat).name, it.name, w.qty, 0, 0, '', ''].concat(blankBattle, [labelOf(WALKOFF_REASONS, w.reason), '']));
  });
  state.matches.forEach(m => {
    const status = m.voided ? 'voided' : (m.status === 'done' ? 'played' : 'in progress');
    const total = matchTix(m);
    m.players.forEach((p, i) => {
      const common = [m.station, 'B' + m.no, status, localStamp(m.startedAt), localStamp(m.endedAt), 'Balloon Battle'];
      const demo = [labelOf(AGES, p.age), labelOf(GENDERS, p.gender)];
      const mode = m.mode === 'pvp' ? 'vs player' : 'vs house';
      rows.push(common.concat([m.rematch ? 'Rematch' : 'Match', 1, p.base, total], demo,
        [mode, 'P' + (i + 1), p.pops == null ? '' : p.pops, p.won == null ? '' : (p.won ? 'yes' : 'no'), p.cards || 0, '', '']));
      if (p.weapons) {
        rows.push(common.concat(['Extra weapon', p.weapons, p.tix - p.base, total], demo, [mode, 'P' + (i + 1), '', '', '', '', '']));
      }
    });
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

function exportCSV() {
  const csv = buildCSV();
  const slug = (state.settings.station || 'station').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const d = new Date();
  const name = `ramathon_sales_${slug}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  const bom = String.fromCharCode(0xfeff); // lets Excel read the file as UTF-8
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  state.lastExport = now();
  save();
  render();
  toast('Downloaded ' + name, 'ok');
}

function clearAll() {
  commit(() => {
    const fresh = defaultState();
    DATA_KEYS.forEach(k => { state[k] = fresh[k]; });
    return 'Deleted all data';
  });
  view.modal = null;
  view.screen = 'home';
  render();
  toast('All data deleted · Undo brings it back until you reload', 'warn');
}

/* ==========================================================================
   Rendering
   ========================================================================== */
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const enabledCats = () => CATEGORIES.filter(c => state.settings.cats[c.id]);
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
const money = n => '$' + n.toFixed(2);
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${pad(s % 60)}`;
}

function render() {
  const cats = enabledCats();
  if (cats.length === 1) view.screen = cats[0].id;
  else if (view.screen !== 'home' && !cats.some(c => c.id === view.screen)) view.screen = 'home';

  // Keep the cursor in a text field across re-renders.
  const ae = document.activeElement;
  const keep = ae && ae.tagName === 'INPUT' && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;

  const c = current();
  const multi = cats.length > 1;
  let main;
  let panel;
  if (view.screen === 'home') { main = homeView(cats, c); panel = panelView(c); }
  else if (view.screen === 'battle') { main = battleView(multi); panel = queuePanel(); }
  else {
    const cat = catById(view.screen);
    const kind = cat.kind === 'prizes' ? 'trade' : 'sale';
    const cc = currentOf(kind);
    main = catView(cat, cc, multi);
    panel = panelView(cc, kind);
  }

  app.innerHTML = topBar()
    + `<div class="layout"><main class="main">${main}</main>${panel}</div>`
    + modalView()
    + bannerView();
  view.pulse = null;

  const focusId = view.focusName ? 'q-name' : (keep && keep.id);
  view.focusName = false;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (keep && keep.id === focusId) { try { el.setSelectionRange(keep.s, keep.e); } catch (err) { /* number inputs */ } }
    }
  }
  tick();
}

function topBar() {
  const last = undoStack[undoStack.length - 1];
  return `<header class="top">
    <div class="brand">RAMBOTS <span>Ramathon Sales</span></div>
    <div class="station" title="Station name (change in Settings)">${esc(state.settings.station)}</div>
    <div class="spacer"></div>
    <button class="tbtn" data-act="open" data-modal="totals">Totals</button>
    <button class="tbtn" data-act="open" data-modal="history">History</button>
    <button class="tbtn" data-act="open" data-modal="settings">Settings</button>
    <button class="undo" data-act="undo" title="Undo (Ctrl+Z)" ${last ? '' : 'disabled'}>
      <span class="u-main">↶ Undo</span>
      <span class="u-sub">${last ? esc(last.label) : 'Nothing to undo'}</span>
    </button>
  </header>`;
}

function homeView(cats, c) {
  return `<div class="home">${cats.map(cat => {
    let badge = '';
    let hint = cat.hint;
    if (cat.kind === 'battle') {
      hint = `${bs().match} tix per player · rematch ${bs().rematch}`;
      if (playingMatch()) badge = 'Match in progress';
      else if (state.queue.length) badge = `${state.queue.length} in queue`;
    } else if (cat.kind === 'prizes') {
      const tr = currentOf('trade');
      if (tr && tr.lines.length) badge = `${customerTotal(tr)} cards in this trade`;
    } else {
      const n = catUnits(c, cat.id);
      if (n) badge = `${n} in this sale`;
    }
    return `<button class="cat theme-${cat.theme}" data-act="cat" data-cat="${cat.id}">
      ${badge ? `<span class="badge">${esc(badge)}</span>` : ''}
      <span class="c-name">${esc(cat.name)}</span>
      <span class="c-hint">${esc(hint)}</span>
      <span class="c-go">Tap to open</span>
    </button>`;
  }).join('')}</div>`;
}

function catView(cat, c, canBack) {
  const head = `<div class="cat-head">
      ${canBack ? '<button class="back" data-act="home">← Back</button>' : ''}
      <div class="cat-title">${esc(cat.name)}</div>
      <div class="spacer"></div>
      <div class="cat-tip">${cat.tip || 'Tap = +1<br>"Type qty" = punch in a number'}</div>
      ${cat.walkoffs ? `<button class="walkoff-btn" data-act="walkoff" data-cat="${cat.id}">Log walk-off</button>` : ''}
    </div>`;
  if (cat.layout === 'photos') {
    // One photo button per design; tap the number in the right panel to type a quantity.
    const cols = Math.min(5, Math.max(3, cat.items.length));
    return head + `<div class="items photos" style="grid-template-columns:repeat(${cols},1fr)">${cat.items.map(it => {
      const q = qtyOf(c, it.id);
      const prize = it.cards != null;
      return `<div class="tile">
        <button class="item photo-item${prize ? ' prize-item' : ''}" data-act="add" data-item="${it.id}">
          ${q ? `<span class="badge">×${q}</span>` : ''}
          ${prize ? stockPill(it.id) : ''}
          <span class="ph">${photoHtml(it)}</span>
          <span class="i-name">${esc(it.name)}</span>
          ${prize ? `<span class="i-cards">${cardsFor(it.id)} cards</span>` : ''}
        </button>
      </div>`;
    }).join('')}</div>`;
  }
  const cols = cat.items.length >= 3 ? 'cols-3' : 'cols-1';
  return head + `
    <div class="items ${cols}">${cat.items.map(it => {
      const q = qtyOf(c, it.id);
      const priceText = it.priceText || `${it.price} tix`;
      return `<div class="tile">
        <button class="item style-${it.style}" data-act="add" data-item="${it.id}">
          ${q ? `<span class="badge">×${q} in sale</span>` : ''}
          <span class="i-name">${esc(it.name)}</span>
          <span class="i-price">${esc(priceText)}</span>
          ${it.note ? `<span class="i-note">${esc(it.note)}</span>` : ''}
        </button>
        <button class="typeqty" data-act="keypad" data-item="${it.id}"># Type qty</button>
      </div>`;
    }).join('')}</div>`;
}

function stockPill(itemId) {
  const left = stockLeft(itemId);
  if (left == null) return '';
  const start = stockStart(itemId);
  const cls = left <= 0 ? ' out' : (left <= Math.max(2, Math.ceil(start * 0.2)) ? ' low' : '');
  return `<span class="stock${cls}">${left <= 0 ? 'None left' : `${left} left`}</span>`;
}

function panelView(c, kind) {
  kind = kind || 'sale';
  const unit = unitWord(kind);
  const word = recordWord(kind);
  const lines = c ? c.lines : [];
  const has = lines.length > 0;
  const total = c ? customerTotal(c) : 0;
  const units = c ? unitsOf(c) : 0;
  const boxes = has ? CATEGORIES.filter(cat => cat.kind === 'sale' && catTix(c, cat.id) > 0) : [];
  const split = boxes.length > 1
    ? `<div class="box-split">${boxes.map(cat => `<div><span>${esc(cat.name)} box</span><b>${catTix(c, cat.id)} tix</b></div>`).join('')}</div>`
    : '';
  // Group items (clickers) are priced together; show that as one summary line.
  const groupRows = has ? Object.keys(PRICE_GROUPS).map(gid => {
    const n = groupUnits(c, gid);
    if (!n) return '';
    const g = PRICE_GROUPS[gid];
    return `<div class="group-row"><span>${esc(g.name)} ×${n} together</span><b>${groupPrice(gid, n)} tix</b></div>`;
  }).join('') : '';
  return `<aside class="panel" aria-label="Current ${word.toLowerCase()}">
    <div class="p-head">
      <div class="p-title">${c ? `${word} #${c.no}` : `Next ${word.toLowerCase()}`}</div>
      <div class="p-sub">${has ? `${plural(units, kind === 'trade' ? 'prize' : 'item')} · tap a number to type` : ''}</div>
    </div>
    <div class="lines">${has ? lines.map(lineView).join('') : `<div class="empty">${kind === 'trade' ? 'Tap a prize to start a trade' : 'Tap an item to start a sale'}</div>`}</div>
    ${groupRows}
    <div class="total"><span class="t-label">Collect</span><span class="t-val">${total} ${unit}</span></div>
    ${split}
    ${state.settings.demographics ? demoView(c, has) : ''}
    <button class="done" data-act="finish" ${has ? '' : 'disabled'}>Done · Next ${word.toLowerCase()}<small>or press Enter</small></button>
  </aside>`;
}

// Design photos: try each extension in turn, remember which one worked, and
// fall back to a big letter when there is no photo yet.
const photoState = {};
const photoBase = it => (it.photoDir || PHOTO_DIR) + it.photo;
const photoUrl = (base, i) => `${base}.${PHOTO_EXTS[i]}`;
const photoPlaceholder = it => `<span class="ph-none" aria-hidden="true">${esc(it.photo ? it.name.charAt(0) : '?')}</span>`;

function photoHtml(it) {
  if (!it.photo) return photoPlaceholder(it);
  const base = photoBase(it);
  const s = photoState[base] || (photoState[base] = { i: 0, none: false });
  if (s.none) return photoPlaceholder(it);
  return `<img alt="" draggable="false" src="${photoUrl(base, s.i)}" data-photo="${base}">`;
}

document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.photo) return;
  const base = img.dataset.photo;
  const s = photoState[base];
  if (img.getAttribute('src') === photoUrl(base, s.i)) s.i += 1;
  if (s.i < PHOTO_EXTS.length) { img.src = photoUrl(base, s.i); return; }
  s.none = true;
  const it = Object.values(ITEMS).find(x => x.photo && photoBase(x) === base);
  img.outerHTML = photoPlaceholder(it);
}, true);

function lineView(l) {
  const it = ITEMS[l.item];
  return `<div class="line${view.pulse === l.item ? ' pulse' : ''}">
    <div class="l-info">
      <div class="l-name">${esc(it.name)}</div>
      <div class="l-sub">${it.group ? PRICE_GROUPS[it.group].unit
        : (l.unit != null ? `<b>${l.unit * l.qty} cards</b> · ${l.unit} each` : `<b>${linePrice(l.item, l.qty)} tix</b> · ${it.price} each`)}</div>
    </div>
    <div class="l-ctl">
      <button class="step" data-act="minus" data-item="${l.item}" aria-label="Remove one ${esc(it.name)}">−</button>
      <button class="qty" data-act="keypad" data-item="${l.item}" title="Tap to type a quantity">${l.qty}</button>
      <button class="step" data-act="add" data-item="${l.item}" aria-label="Add one ${esc(it.name)}">+</button>

  </div>`;
}

function demoView(c, enabled) {

/* ---- Balloon Battle screen -------------------------------------------- */
function battleView(canBack) {
  const head = `<div class="cat-head">
      ${canBack ? '<button class="back" data-act="home">← Back</button>' : ''}
      <div class="cat-title">Balloon Battle</div>
      <div class="spacer"></div>
      <div class="cat-tip">Tickets are collected when a match starts<br>${bs().match} per player · +${bs().weapon} per extra weapon · rematch ${bs().rematch}</div>
    </div>`;
  const m = playingMatch();
  let body;
  if (m && m.status === 'playing') body = playingView(m);
  else if (m && m.status === 'scoring') body = m.mode === 'house' ? scoreHouseView(m) : scorePvpView(m);
  else body = idleView();
  return head + `<div class="arena">${body}</div>`;
}

function playingView(m) {
  return `<div class="now fill">
    <div class="now-head">
      <span class="now-title">Match #${m.no} · ${m.mode === 'pvp' ? 'vs Player' : 'vs House'}${m.rematch ? ' · rematch' : ''}</span>
      <span class="timer" id="match-timer">0:00</span>
    </div>
    <div class="players">${m.players.map((p, i) => `<div class="pcard">
      <div class="pname">${esc(p.name)}</div>
      <div class="ptix">Collected <b>${p.tix} tix</b> (${p.base} + ${p.weapons} weapon${p.weapons === 1 ? '' : 's'})</div>
      <div class="wrow">Extra weapons
        <button class="step" data-act="mweapon" data-p="${i}" data-d="-1" aria-label="One fewer weapon">−</button>
        <span class="wcount">${p.weapons}</span>
        <button class="step" data-act="mweapon" data-p="${i}" data-d="1" aria-label="One more weapon">+</button>
      </div>
    </div>`).join('')}${m.mode === 'house' ? `<div class="pcard" style="border-style:dashed;color:var(--rb-gray-600)"><div class="pname">House bot</div><div class="ptix">Driven by the crew</div></div>` : ''}</div>
    <button class="huge go" data-act="endmatch">Match over · enter result<small>someone lost all ${BALLOONS} balloons</small></button>
    <button class="linkbtn" data-act="cancelmatch">Cancel match (hand tickets back, players return to the front of the queue)</button>
  </div>`;
}

function scoreHouseView(m) {
  const p = m.players[0];
  const per = bs().cardsPerPop;
  const opts = [];
  for (let n = 0; n <= BALLOONS; n++) opts.push(n);
  return `<div class="now fill">
    <div class="now-head"><span class="now-title">Match #${m.no} result</span></div>
    <div class="prompt">How many House balloons did ${esc(p.name)} pop?</div>
    <div class="pops c4">${opts.map(n => `<button class="pop" data-act="scorehouse" data-n="${n}">${n}<small>${n ? cardsText(n * per) : 'no cards'}</small></button>`).join('')}</div>
  </div>`;
}

function scorePvpView(m) {
  const w = view.pvpWinner;
  if (w == null) {
    return `<div class="now fill">
      <div class="now-head"><span class="now-title">Match #${m.no} result</span></div>
      <div class="prompt">Who won?</div>
      <div class="pops c2">${m.players.map((p, i) => `<button class="pop win" data-act="pvpwinner" data-p="${i}">${esc(p.name)}<small>won</small></button>`).join('')}</div>
    </div>`;
  }
  const winner = m.players[w];
  const loser = m.players[1 - w];
  const per = bs().cardsPerPop;
  const both = bs().pvpRule === 'both';
  const opts = [];
  for (let n = 0; n < BALLOONS; n++) opts.push(n);
  return `<div class="now fill">
    <div class="now-head"><span class="now-title">Match #${m.no} result · ${esc(winner.name)} won</span></div>
    <div class="prompt">How many of ${esc(winner.name)}'s balloons did ${esc(loser.name)} pop?</div>
    <div class="pops c3">${opts.map(n => `<button class="pop" data-act="pvploser" data-n="${n}">${n}<small>${esc(loser.name)}: ${both && n ? cardsText(n * per) : '0 cards'}</small></button>`).join('')}</div>
    <p class="note" style="text-align:center">${both ? 'Payout rule: both players paid per balloon.' : 'Payout rule: winner only. The count is still logged.'}</p>
    <button class="linkbtn" data-act="pvpwinner" data-p="">Wrong winner? Pick again</button>
  </div>`;
}

function idleView() {
  const lm = lastMatch();
  let result = '';
  if (lm && lm.status === 'done' && !lm.voided) {
    const lines = lm.players.map(p => {
      const what = lm.mode === 'pvp' ? (p.won ? 'won' : `popped ${p.pops}`) : `popped ${p.pops}`;
      const give = p.cards ? `<span class="give">give ${cardsText(p.cards)}</span>` : '<span class="none">0 cards</span>';
      return `<div class="r-line">${esc(p.name)} ${what} → ${give}</div>`;
    }).join('');
    const waiting = state.queue.length;
    const rmTix = lm.players.map(p => bs().rematch + p.weapons * bs().weapon);
    result = `<div class="result">
      <div class="r-title">Match #${lm.no} result · ${esc(matchTitle(lm))}</div>
      ${lines}
      <button class="huge yellow" data-act="rematch">Instant rematch · ${rmTix.join(' + ')} tix<small>${waiting ? `${plural(waiting, 'person')} waiting in the queue` : 'nobody waiting'}</small></button>
    </div>`;
  }
  const q = state.queue;
  const houseSub = q.length ? `${esc(q[0].name)} · ${weaponsText(q[0].weapons)}` : 'Walk-up (queue is empty)';
  const pvpSub = q.length >= 2 ? `${esc(q[0].name)} vs ${esc(q[1].name)}` : 'Needs 2 people in the queue';
  return `${result}
    <div class="starts">
      <button class="start theme-red" data-act="startmatch" data-mode="house">
        <span class="s-big">Start vs House</span><span class="s-sub">${houseSub}</span>
      </button>
      <button class="start theme-ink" data-act="startmatch" data-mode="pvp" ${q.length >= 2 ? '' : 'disabled'}>
        <span class="s-big">Start vs Player</span><span class="s-sub">${pvpSub}</span>
      </button>
    </div>`;
}

function bannerView() {

/* ---- Modals ------------------------------------------------------------ */
function modalView() {
  const m = view.modal;
  if (!m) return '';
  let inner = '';
  if (m.type === 'keypad') inner = keypadView(m);
  else if (m.type === 'totals') inner = totalsView();
  else if (m.type === 'history') inner = historyView();
  else if (m.type === 'settings') inner = settingsView();
  else if (m.type === 'confirmClear') inner = confirmClearView();
  else if (m.type === 'walkoff') inner = walkoffView(m);
  return `<div class="overlay" data-act="overlay">${inner}</div>`;
}

function dialogHead(title) {
  return `<div class="d-head"><h2 class="d-title">${title}</h2><button class="close" data-act="close">Close</button></div>`;
}

function keypadView(m) {
  const it = ITEMS[m.item];
  const kind = kindOf(m.item);
  const where = kind === 'trade' ? 'trade' : 'sale';
  const cur = qtyOf(currentOf(kind), m.item);
  const q = m.value === '' ? null : parseInt(m.value, 10);
  let price;
  if (q == null) price = `Currently ${cur} in this ${where}`;
  else if (q === 0) price = `Removes it from this ${where}`;
  else if (it.cards != null) {
    const line = currentOf(kind) && currentOf(kind).lines.find(l => l.item === m.item);
    price = `= ${(line ? line.unit : cardsFor(m.item)) * q} cards`;
  } else if (it.group) {
    const n = groupUnits(current(), it.group) - cur + q;
    price = `${n} ${PRICE_GROUPS[it.group].unit}${n === 1 ? '' : 's'} together = ${groupPrice(it.group, n)} tix`;
  } else price = `= ${linePrice(m.item, q)} tix`;
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
  return `<div class="dialog narrow" role="dialog" aria-label="Type quantity">
    ${dialogHead('How many ' + esc(it.name) + '?')}
    <div class="kp-display${q == null ? ' placeholder' : ''}">${q == null ? cur : q}</div>
    <div class="kp-price">${esc(price)}</div>
    <div class="keypad">${keys.map(k => {
      const label = k === 'clear' ? 'Clear' : (k === 'back' ? '⌫' : k);
      return `<button class="key${k === 'clear' ? ' small' : ''}" data-act="key" data-key="${k}">${label}</button>`;
    }).join('')}</div>
    <div class="row">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="kpset" ${q == null ? 'disabled' : ''}>Set to ${q == null ? '...' : q}</button>
    </div>
  </div>`;
}

function walkoffView(m) {

  return `<div class="dialog narrow" role="dialog" aria-label="Log walk-off">
    ${dialogHead('Log a walk-off')}
    <p class="note">Stock that left without tickets. Logged at 0 tix so that before − after − walk-offs = sold.</p>
    <div class="field">
      <div class="f-label">What</div>
      <div class="toggles">${cat.items.map(it => `<button class="toggle" data-act="woitem" data-item="${it.id}" aria-pressed="${m.item === it.id}">${esc(it.name)}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="f-label">How many</div>
      <div class="wrow">
        <button class="step" data-act="woqty" data-d="-1" aria-label="One fewer">−</button>
        <span class="wcount">${m.qty}</span>
        <button class="step" data-act="woqty" data-d="1" aria-label="One more">+</button>
      </div>
    </div>
    <div class="field">
      <div class="f-label">Why</div>
      <div class="toggles">${WALKOFF_REASONS.map(r => `<button class="toggle" data-act="woreason" data-val="${r.id}" aria-pressed="${m.reason === r.id}">${r.label}</button>`).join('')}</div>
    </div>
    <div class="row">

      <button class="btn go" data-act="wosave">Log ${m.qty} walk-off${m.qty === 1 ? '' : 's'}</button>
