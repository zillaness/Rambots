// Pace against the goal: a straight line from 0 at the start to the goal at
// the end. Each laptop paces only the booths it runs.
function eventWindow() {
  const e = state.settings.event;
  const start = new Date(`${e.date}T${e.start}:00`).getTime();
  const end = new Date(`${e.date}T${e.end}:00`).getTime();
  return { start, end, ok: Number.isFinite(start) && Number.isFinite(end) && end > start };
}

function pace() {
  const w = eventWindow();
  const t = computeTotals();
  const nowMs = Date.now();
  const frac = w.ok ? Math.min(1, Math.max(0, (nowMs - w.start) / (w.end - w.start))) : 0;
  const rows = enabledCats().filter(cat => cat.kind !== 'prizes').map(cat => {
    const goal = state.settings.goals[cat.id] || 0;
    const actual = t.byGoal[cat.id] || 0;
    return { cat, goal, actual, target: goal * frac, diff: actual - goal * frac };
  });
  const goal = rows.reduce((s, r) => s + r.goal, 0);
  const actual = rows.reduce((s, r) => s + r.actual, 0);
  const target = goal * frac;
  const minsLeft = w.ok ? Math.max(0, (w.end - nowMs) / 60000) : 0;
  const phase = !w.ok ? 'unset' : (nowMs < w.start ? 'before' : (nowMs > w.end ? 'after' : 'during'));
  return { rows, goal, actual, target, diff: actual - target, minsLeft, need: minsLeft > 0 ? Math.max(0, goal - actual) / minsLeft : 0, phase, w };
}

function paceChip() {
  if (!state.settings.showPace) return '';
  const p = pace();
  const clock = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  let main = clock;
  let sub = '';
  let cls = '';
  const which = p.rows.filter(r => r.goal).map(r => r.cat.name).join(' + ');
  if (p.goal && p.phase === 'before') { sub = `Starts ${fmtTime(new Date(p.w.start).toISOString())} · ${which} goal ${p.goal} tix`; }
  else if (p.goal && p.phase === 'after') {
    main = `Ended · ${p.actual} of ${p.goal} tix`;
    sub = p.actual >= p.goal ? 'Goal reached' : `${p.goal - p.actual} short`;
    cls = p.actual >= p.goal ? ' ahead' : ' behind';
  } else if (p.goal && p.phase === 'during') {
    const d = Math.round(p.diff);
    main = `${clock} · ${d >= 0 ? `+${d} ahead` : `${-d} behind`}`;
    sub = `${p.actual} of ${p.goal} · target ${Math.round(p.target)} by now`;
    cls = d >= 0 ? ' ahead' : ' behind';
  } else if (p.phase === 'during' || p.phase === 'before') {
    sub = `Event ${state.settings.event.start} to ${state.settings.event.end}`;
  }
  return `<button class="pace${cls}" id="pace-chip" data-act="open" data-modal="pace" title="Pace against the goal">
    <span class="pc-main">${esc(main)}</span>${sub ? `<span class="pc-sub">${esc(sub)}</span>` : ''}</button>`;
}

function paceView() {
  const p = pace();
  const fmt = n => Math.round(n);
  const rows = p.rows.map(r => `<tr><td>${esc(r.cat.name)}</td><td class="num">${r.goal}</td><td class="num">${fmt(r.target)}</td><td class="num">${r.actual}</td>
    <td class="num ${r.diff >= 0 ? 'good' : 'bad'}">${r.diff >= 0 ? '+' : ''}${fmt(r.diff)}</td></tr>`).join('');
  const phaseText = { unset: 'Set the event date and hours in Settings.', before: 'The event has not started yet.', after: 'The event is over.', during: `${Math.round(p.minsLeft)} minutes left. To finish on goal: ${p.need.toFixed(1)} tix per minute (${Math.round(p.need * 60)} per hour).` }[p.phase];
  return `<div class="dialog" role="dialog" aria-label="Pace">
    ${dialogHead('Pace · ' + esc(state.settings.station))}
    <p class="note" style="font-size:18px">${phaseText}</p>
    ${p.rows.length ? `<table><thead><tr><th>Booth</th><th class="num">Goal</th><th class="num">Target by now</th><th class="num">Actual</th><th class="num">+/−</th></tr></thead>
    <tbody>${rows}<tr class="sub"><td>This laptop</td><td class="num">${p.goal}</td><td class="num">${fmt(p.target)}</td><td class="num">${p.actual}</td><td class="num ${p.diff >= 0 ? 'good' : 'bad'}">${p.diff >= 0 ? '+' : ''}${fmt(p.diff)}</td></tr></tbody></table>` : '<p class="note">This laptop has no ticket booths, so there is no ticket goal here.</p>'}
    <p class="note">Target = where a steady pace from ${esc(state.settings.event.start)} to ${esc(state.settings.event.end)} would be right now. Each laptop only counts its own booths; finished sales and started battle matches count. ${esc(PLINKO_GOAL_NOTE)} Goals and hours are in Settings.</p>
  </div>`;
}

// "3 for 10 ×2 + 1 for 4": how a tier-priced count breaks into deals.
function comboText(gid, n) {
  const g = PRICE_GROUPS[gid];
  const size = g.bundle.size;
  const k = Math.floor(n / size);
  const r = n % size;
  const parts = [];
  if (k) parts.push(`${size} for ${g.bundle.price}${k > 1 ? ` ×${k}` : ''}`);
  if (r) parts.push(`${r} for ${g.tiers[r]}`);
  return parts.join(' + ');
}

// Upsell prompts while a copter kit is in the cart.
function copterAsk(c) {
  const kits = qtyOf(c, 'kit');
  const anyCopter = kits + qtyOf(c, 'kit_toroidal') + qtyOf(c, 'launcher');
  if (!anyCopter) return '';
  // Don't offer what the stock count says is gone.
  const has = key => { const left = keyLeft(key); return left == null || left > 0; };
  const canUpgrade = kits && has('part_toroidal');
  const canProp = has('part_propeller');
  const canTorProp = has('part_toroidal');
  if (!canUpgrade && !canProp && !canTorProp) return '';
  const diff = ITEMS.kit_toroidal.price - ITEMS.kit.price;
  const title = canUpgrade ? 'Ask: toroidal upgrade?' : 'Ask: extra propellers?';
  return `<div class="ask">
    <div class="ask-title"><span>${title}</span>${canUpgrade ? `<button class="whybtn" data-act="why" aria-expanded="${!!view.why}">${view.why ? 'Hide' : 'Why toroidal?'}</button>` : ''}</div>
    ${canUpgrade && view.why ? `<div class="ask-text">${esc(TOROIDAL_PITCH)}</div>` : ''}
    <div class="ask-row">
      ${canUpgrade ? `<button class="askbtn" data-act="upgrade">Toroidal kit +${diff}</button>` : ''}
      ${canProp ? `<button class="askbtn" data-act="add" data-item="propeller">+ Prop ${ITEMS.propeller.price}</button>` : ''}
      ${canTorProp ? `<button class="askbtn" data-act="add" data-item="toroidal">+ Toroidal prop ${ITEMS.toroidal.price}</button>` : ''}
    </div>
  </div>`;
}

function upgradeKit() {
  const c = current();
  if (!c || !qtyOf(c, 'kit')) return;
  const diff = ITEMS.kit_toroidal.price - ITEMS.kit.price;
  commit(() => {
    const kit = c.lines.find(l => l.item === 'kit');
    kit.qty -= 1;
    if (kit.qty <= 0) c.lines = c.lines.filter(l => l !== kit);
    const tk = c.lines.find(l => l.item === 'kit_toroidal');
    if (tk) tk.qty += 1; else c.lines.push(newLine('kit_toroidal', 1));
    return `Upgraded 1 Full kit to toroidal (+${diff} tix)`;
  });
  view.pulse = 'kit_toroidal';
  render();
}

function stockPill(itemId) {
  const info = stockInfo(itemId);
  if (!info) return '';
  const { left, start } = info;
  const cls = left <= 0 ? ' out' : (left <= Math.max(2, Math.ceil(start * 0.2)) ? ' low' : '');
  return `<span class="stock${cls}">${left <= 0 ? 'None left' : `${left} left`}</span>`;
}

function panelView(c, kind) {
  kind = kind || 'sale';
  const unit = unitWord(kind);
  const word = recordWord(kind);
  const lines = c ? c.lines : [];
  const has = lines.length > 0;
  const total = c ? customerTotal(c) : 0;
  const units = c ? unitsOf(c) : 0;
  const boxes = has ? CATEGORIES.filter(cat => cat.kind === 'sale' && catTix(c, cat.id) > 0) : [];
  const split = boxes.length > 1
    ? `<div class="box-split">${boxes.map(cat => `<div><span>${esc(cat.name)} box</span><b>${catTix(c, cat.id)} tix</b></div>`).join('')}</div>`
    : '';
  // Group items (clickers) are priced together; show that as one summary line.
  const groupRows = has ? Object.keys(PRICE_GROUPS).map(gid => {
    const n = groupUnits(c, gid);
    if (!n) return '';
    const g = PRICE_GROUPS[gid];
    const price = groupPrice(gid, n);
    const extra = groupPrice(gid, n + 1) - price;
    const cardToo = kind === 'sale' && cardEvery() > 0 && Math.floor((total + extra) / cardEvery()) > Math.floor(total / cardEvery());
    const nudge = extra < groupPrice(gid, 1)
      ? `<div class="g-nudge">Ask: 1 more is only +${extra} tix (${n + 1} for ${groupPrice(gid, n + 1)})${cardToo ? ' + a free card' : ''}</div>` : '';
    return `<div class="group-row">
      <div class="g-top"><span>${esc(g.name)} ×${n} <small>${comboText(gid, n)} · ${(price / n).toFixed(2)} each</small></span><b>${price} tix</b></div>
      ${nudge}
    </div>`;
  }).join('') : '';
  const sale = kind === 'sale';
  const cash = sale && isCash(c);
  const ask = sale && has ? copterAsk(c) : '';
  // When "1 more clicker" also earns the next free card, say it once there.
  const cardNudged = sale && has && cardEvery() > 0 && Object.keys(PRICE_GROUPS).some(gid => {
    const n = groupUnits(c, gid);
    const extra = groupPrice(gid, n + 1) - groupPrice(gid, n);
    return n && extra < groupPrice(gid, 1) && Math.floor((total + extra) / cardEvery()) > bonusDue(c);
  });
  const cashBtn = sale ? `<button class="cashbtn${cash ? ' on' : ''}" data-act="cash" aria-pressed="${cash}" aria-label="Cash sale"
      title="${cash ? 'Cash sale · tap to switch back to tickets' : 'Mark as cash sale'}" ${has ? '' : 'disabled'}>${CASH_ICON}</button>` : '';
  return `<aside class="panel" aria-label="Current ${word.toLowerCase()}">
    <div class="p-head">
      <div class="p-title">${c ? `${word} #${c.no}` : `Next ${word.toLowerCase()}`}</div>
      <div class="p-right">
        <div class="p-sub">${has ? `${plural(units, kind === 'trade' ? 'prize' : 'item')} · tap a number to type` : ''}</div>
        ${cashBtn}
      </div>
    </div>
    <div class="lines">${has ? lines.map(lineView).join('') : `<div class="empty">${kind === 'trade' ? 'Tap a prize to start a trade' : 'Tap an item to start a sale'}</div>`}</div>
    ${groupRows}
    ${ask}
    <div class="total"><span class="t-label">${cash ? 'Collect cash' : 'Collect'}</span><span class="t-val${cash ? ' cash' : ''}">${cash ? cashText(total) : `${total} ${unit}`}</span></div>
    ${cash ? '' : split}
    ${sale ? bonusView(c, cardNudged) : ''}
    ${state.settings.demographics ? demoView(c, has) : ''}
    <button class="done" data-act="finish" ${has ? '' : 'disabled'}>Done · Next ${word.toLowerCase()}<small>or press Enter</small></button>
  </aside>`;
}

// Free-card reminder under the total: how many cards to hand over, and an Ask
// when a few more tix would earn the next one.
function bonusView(c, nudged) {
  const every = cardEvery();
  if (!c || !c.lines.length || every <= 0) return '';
  const total = customerTotal(c);
  const due = bonusDue(c);
  const short = (due + 1) * every - total;
  const ask = !nudged && short <= BONUS_NUDGE_TIX
    ? `<div class="g-nudge" id="bonus-ask">Ask: ${short} more tix = ${due ? 'another' : 'a'} free Pokémon card</div>` : '';
  if (!due) return ask;
  // The best prize the free cards cover on their own, so the crew can say it.
  const covers = CATEGORIES.find(cat => cat.id === 'prizes').items
    .filter(it => cardsFor(it.id) <= due).sort((a, b) => cardsFor(b.id) - cardsFor(a.id))[0];
  return `<div class="bonus" id="bonus"><span class="bonus-title">Give ${plural(due, 'free Pokémon card')}</span>
    <span class="bonus-text">${covers ? `= a free ${esc(covers.name)}` : 'win more at Plinko or Battle'}</span></div>${ask}`;
}

// Design photos: try each extension in turn, remember which one worked, and
// fall back to a big letter when there is no photo yet.
const photoState = {};
const photoBase = it => (it.photoDir || PHOTO_DIR) + it.photo;
const photoUrl = (base, i) => `${base}.${PHOTO_EXTS[i]}`;
const photoPlaceholder = it => `<span class="ph-none" aria-hidden="true">${esc(it.letter || (it.photo ? it.name.charAt(0) : '?'))}</span>`;

function photoHtml(it) {
  if (!it.photo) return photoPlaceholder(it);
  const base = photoBase(it);
  const s = photoState[base] || (photoState[base] = { i: 0, none: false });
  if (s.none) return photoPlaceholder(it);
  return `<img alt="" draggable="false" src="${photoUrl(base, s.i)}" data-photo="${base}">`;
}

document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.photo) return;
  const base = img.dataset.photo;
  const s = photoState[base];
  if (img.getAttribute('src') === photoUrl(base, s.i)) s.i += 1;
  if (s.i < PHOTO_EXTS.length) { img.src = photoUrl(base, s.i); return; }
  s.none = true;
  const it = Object.values(ITEMS).find(x => x.photo && photoBase(x) === base);
  img.outerHTML = photoPlaceholder(it);
}, true);

function lineView(l) {
  const it = ITEMS[l.item];
  return `<div class="line${view.pulse === l.item ? ' pulse' : ''}">
    <div class="l-info">
      <div class="l-name">${esc(it.name)}</div>
      <div class="l-sub">${it.group ? PRICE_GROUPS[it.group].unit
        : (l.unit != null ? `<b>${l.unit * l.qty} cards</b> · ${l.unit} each` : `<b>${linePrice(l.item, l.qty)} tix</b> · ${it.price} each`)}</div>
    </div>
    <div class="l-ctl">
      <button class="step" data-act="minus" data-item="${l.item}" aria-label="Remove one ${esc(it.name)}">−</button>
      <button class="qty" data-act="keypad" data-item="${l.item}" title="Tap to type a quantity">${l.qty}</button>
      <button class="step" data-act="add" data-item="${l.item}" aria-label="Add one ${esc(it.name)}">+</button>
    </div>
  </div>`;

/* ---- Balloon Battle screen -------------------------------------------- */
// Running cards-per-ticket so the crew knows when to tighten the house.
function payoutStats(filter) {
  const ms = state.matches.filter(m => !m.voided && m.status === 'done' && filter(m));
  const tix = ms.reduce((s, m) => s + matchTix(m), 0);
  const cards = ms.reduce((s, m) => s + matchCards(m), 0);
  return { n: ms.length, tix, cards, rate: tix ? cards / tix : null };
}
function payoutBar() {
  const all = payoutStats(() => true);
  if (!all.n) return '';
  const house = payoutStats(m => m.mode === 'house');
  const pvp = payoutStats(m => m.mode === 'pvp');
  const cls = r => (r == null ? '' : (r > 1 ? 'bad' : (r >= 0.9 ? 'warn' : 'good')));
  const cell = (label, st) => (st.n ? `<span class="pb ${cls(st.rate)}">${label} <b>${st.rate.toFixed(2)}</b> <small>${st.cards} cards / ${st.tix} tix</small></span>` : '');
  const hint = house.rate != null && house.rate > 1 ? 'House is paying too much: tighten up.'
    : (all.rate > 1 ? 'Over 1 card per ticket: tighten the house.' : (all.rate >= 0.9 ? 'Close to the 1 card per ticket limit.' : 'Under 1 card per ticket.'));
  return `<div class="payout-bar">${cell('All', all)}${cell('vs House', house)}${cell('vs Player', pvp)}<span class="pb-hint">${esc(hint)}</span></div>`;
}

function scoringText() {
  const b = bs();
  if (b.scoring === 'outcome') return `by outcome ${OUTCOMES.map(o => b.outcomeCards[o[0]]).join(' / ')}`;
  if (b.scoring === 'survive') return `${b.cardsPerPop} per balloon, must survive to the end${b.consolation ? ` + ${b.consolation} if knocked out` : ''}`;
  return `${b.cardsPerPop} per balloon, ${b.pvpRule === 'both' ? 'everyone' : 'winner only'}${b.consolation ? ` + ${b.consolation} for the loser` : ''}`;
}

// What volunteers say and what the kids see, built from the current settings.
function rulesLines() {
  const b = bs();
  const mins = b.matchSeconds % 60 ? `${Math.floor(b.matchSeconds / 60)} min ${b.matchSeconds % 60} s` : plural(b.matchSeconds / 60, 'minute');
  const lines = [
    `${b.match} tickets each to play. Unlock a weapon: ${WEAPONS.map(w => `${w.name.toLowerCase()} +${weaponPrice(w.id)}`).join(', ')}. Pay once and it stays unlocked for your next matches.`,
    `Each robot has ${BALLOONS} balloons. Pop the other robot's balloons!`,
    `The match lasts ${mins}, or until a robot loses all ${BALLOONS} balloons.`,
  ];
  if (b.scoring === 'outcome') {
    const o = b.outcomeCards;
    lines.push(`Knock out all ${BALLOONS} balloons before time: ${o.koWin} Pokémon cards.`);
    lines.push(`Ahead when time runs out: ${o.timeWin} cards.`);
    lines.push(`Still have a balloon at the end: ${o.survive} cards.`);
    if (o.knockedOut) lines.push(`Knocked out: ${plural(o.knockedOut, 'card')} for playing.`);
    lines.push('Tie when time runs out: both survived, so both get ' + o.survive + ' cards.');
  } else if (b.scoring === 'survive') {
    lines.push(`Every balloon you pop wins ${plural(b.cardsPerPop, 'Pokémon card')} (up to ${BALLOONS * b.cardsPerPop}).`);
    lines.push('But you only keep them if your robot still has a balloon when the match ends!');
    lines.push(`Lose all ${BALLOONS} balloons: ${b.consolation ? `${plural(b.consolation, 'card')} for playing` : 'no cards'}. Pop all ${BALLOONS} of theirs and you win right away.`);
  } else if (b.pvpRule === 'both') {
    lines.push(`Every balloon you pop wins ${plural(b.cardsPerPop, 'Pokémon card')}.`);
  } else {
    lines.push(`vs our robot: ${plural(b.cardsPerPop, 'Pokémon card')} for every balloon you pop (up to ${BALLOONS * b.cardsPerPop}).`);
    lines.push(`vs a friend: the winner gets ${b.cardsPerPop} cards for every balloon they popped${b.consolation ? `, and the other player gets ${plural(b.consolation, 'card')}` : ''}.`);
    lines.push(b.pvpTie === 'both' ? 'Tie when time runs out: each player gets cards for the balloons they popped.' : 'Tie when time runs out: no cards.');
  }
  lines.push(`Go again: Rematch puts you back in line for ${b.match} tickets. Instant rematch plays right away for ${b.rematch}${b.rematchOnce ? ', once,' : ''} when the line is short.`);
  lines.push('Trade your cards for prizes at the Prize Table.');
  return lines;
}

      <div class="pvp-name">${esc(p.name)} popped</div>
      <div class="pops c4">${opts.map(n => `<button class="pop sm${pops[i] === n ? ' on' : ''}" data-act="pvppop" data-p="${i}" data-n="${n}">${n}</button>`).join('')}</div>
    </div>`).join('');
  let preview = 'Tap how many balloons each player popped.';
  if (pops[0] != null && pops[1] != null) {
    const r = pvpPayout(pops);
    const who = r.tie ? `Tie ${pops[0]}–${pops[1]}` : `${m.players[r.win].name} wins ${Math.max(...pops)}–${Math.min(...pops)}`;
    const koText = i => (bs().scoring === 'survive' && r.ko[i] ? ' (knocked out)' : '');
    preview = `${who} · ` + m.players.map((p, i) => `${p.name}${koText(i)}: ${r.cards[i] ? cardsText(r.cards[i]) : '0 cards'}`).join(' · ');
  }
  const con = bs().consolation || 0;
  const rule = bs().scoring === 'survive' ? `${bs().cardsPerPop} cards per balloon popped, if you still have a balloon at the end. Popping all ${BALLOONS} knocks the other player out (${con ? plural(con, 'card') : 'no cards'}).`
    : bs().pvpRule === 'both' ? `Both players paid ${bs().cardsPerPop} per balloon.`
    : `Winner only, ${bs().cardsPerPop} cards per balloon the winner popped${bs().consolation ? `, loser gets ${plural(bs().consolation, 'card')}` : ''}. Tie: ${bs().pvpTie === 'both' ? 'each paid for their own balloons' : 'no cards'}.`;
  return `<div class="now fill">
    <div class="now-head"><span class="now-title">Match #${m.no} result</span></div>
    ${rows}
    <div class="pvp-preview">${esc(preview)}</div>
    <button class="huge go" data-act="pvpsave" ${pops[0] == null || pops[1] == null ? 'disabled' : ''}>Save result</button>
    <p class="note" style="text-align:center">${esc(rule)}</p>
  </div>`;
}

function bannerView() {
  if (!storageOK) return '<div class="banner">NOT SAVING: this browser is blocking storage. Close this window and open the tracker in a normal (not private) window.</div>';
  if (otherTab) return '<div class="banner">This booth is open in another tab or window. Close the extra one. Undo history was cleared to protect its sales.</div>';
  return '';
}

/* ---- Modals ------------------------------------------------------------ */
function modalView() {
  const m = view.modal;
  if (!m) return '';
  let inner = '';
  if (m.type === 'keypad') inner = keypadView(m);
  else if (m.type === 'totals') inner = totalsView();
  else if (m.type === 'history') inner = historyView();
  else if (m.type === 'settings') inner = settingsView();
  else if (m.type === 'confirmClear') inner = confirmClearView();
  else if (m.type === 'walkoff') inner = walkoffView(m);
  else if (m.type === 'backorder') inner = backorderView(m);
  else if (m.type === 'pace') inner = paceView();
  else if (m.type === 'combine') inner = combineView();
  else if (m.type === 'rules') inner = rulesView();
  else if (m.type === 'upsell') inner = upsellView();
  else if (m.type === 'weapons') inner = weaponsView(m);
  else if (m.type === 'clock') inner = clockView(m);
  return `<div class="overlay" data-act="overlay">${inner}</div>`;
}

function dialogHead(title) {
  return `<div class="d-head"><h2 class="d-title">${title}</h2><button class="close" data-act="close">Close</button></div>`;
}

function keypadView(m) {
  const it = ITEMS[m.item];
  const kind = kindOf(m.item);
  const where = kind === 'trade' ? 'trade' : 'sale';
  const cur = qtyOf(currentOf(kind), m.item);
  const q = m.value === '' ? null : parseInt(m.value, 10);
  let price;
  if (q == null) price = `Currently ${cur} in this ${where}`;
  else if (q === 0) price = `Removes it from this ${where}`;
  else if (it.cards != null) {
    const line = currentOf(kind) && currentOf(kind).lines.find(l => l.item === m.item);
    price = `= ${(line ? line.unit : cardsFor(m.item)) * q} cards`;
  } else if (it.group) {
    const n = groupUnits(current(), it.group) - cur + q;
    price = `${n} ${PRICE_GROUPS[it.group].unit}${n === 1 ? '' : 's'} together = ${groupPrice(it.group, n)} tix`;
  } else price = `= ${linePrice(m.item, q)} tix`;
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
  return `<div class="dialog narrow" role="dialog" aria-label="Type quantity">
    ${dialogHead('How many ' + esc(it.name) + '?')}
    <div class="kp-display${q == null ? ' placeholder' : ''}">${q == null ? cur : q}</div>
    <div class="kp-price">${esc(price)}</div>
    <div class="keypad">${keys.map(k => {
      const label = k === 'clear' ? 'Clear' : (k === 'back' ? '⌫' : k);
      return `<button class="key${k === 'clear' ? ' small' : ''}" data-act="key" data-key="${k}">${label}</button>`;
    }).join('')}</div>
    <div class="row">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="kpset" ${q == null ? 'disabled' : ''}>Set to ${q == null ? '...' : q}</button>
    </div>
  </div>`;
}

function backorderView(m) {
  const cat = catById(m.cat);
  const field = (id, label, val, ph, type) => `<div class="field"><label for="${id}">${label}</label>
    <input id="${id}" type="${type || 'text'}" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="80" autocomplete="off"></div>`;
  return `<div class="dialog narrow" role="dialog" aria-label="Backorder">
    ${dialogHead('Backorder')}
    <p class="note">For when something is sold out. No tickets now; someone follows up after the event. Contact info stays on this laptop and only goes in the backorders file.</p>
    <div class="field">
      <div class="f-label">What</div>
      <div class="toggles">${cat.items.map(it => `<button class="toggle" data-act="boitem" data-item="${it.id}" aria-pressed="${m.item === it.id}">${esc(it.name)}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="f-label">How many</div>
      <div class="wrow">
        <button class="step" data-act="boqty" data-d="-1" aria-label="One fewer">−</button>
        <span class="wcount">${m.qty}</span>
        <button class="step" data-act="boqty" data-d="1" aria-label="One more">+</button>
      </div>
    </div>
    ${field('bo-name', "Parent's name", m.name, 'e.g. Sam (Alex\'s dad)')}
    ${field('bo-contact', 'Phone or email (required)', m.contact, 'phone or email')}
    ${field('bo-note', 'Note (optional)', m.note, 'e.g. any color is fine')}
    <div class="row">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="bosave">Save backorder</button>
    </div>
  </div>`;
}

function walkoffView(m) {
  const cat = catById(m.cat);
  return `<div class="dialog narrow" role="dialog" aria-label="Log walk-off">
    ${dialogHead('Log a walk-off')}
    <p class="note">Stock that left without tickets. Logged at 0 tix so that before − after − walk-offs = sold.</p>
    <div class="field">
      <div class="f-label">What</div>
      <div class="toggles">${cat.items.map(it => `<button class="toggle" data-act="woitem" data-item="${it.id}" aria-pressed="${m.item === it.id}">${esc(it.name)}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="f-label">How many</div>
      <div class="wrow">
        <button class="step" data-act="woqty" data-d="-1" aria-label="One fewer">−</button>
        <span class="wcount">${m.qty}</span>
        <button class="step" data-act="woqty" data-d="1" aria-label="One more">+</button>
      </div>
    </div>
    <div class="field">
      <div class="f-label">Why</div>
      <div class="toggles">${WALKOFF_REASONS.map(r => `<button class="toggle" data-act="woreason" data-val="${r.id}" aria-pressed="${m.reason === r.id}">${r.label}</button>`).join('')}</div>
    </div>
    <div class="row">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="wosave">Log ${m.qty} walk-off${m.qty === 1 ? '' : 's'}</button>
    </div>

}

function totalsView() {
  const t = computeTotals();
  const open = current();
  const playing = playingMatch();
  const boxRows = CATEGORIES.filter(cat => t.byBox[cat.id]).map(cat =>
    `<tr><td>${esc(cat.name)} box</td><td class="num">${t.byBox[cat.id]}</td><td class="num">${money(t.byBox[cat.id] * NET_PER_TICKET)}</td></tr>`).join('');

  const itemRows = CATEGORIES.filter(cat => cat.kind === 'sale').map(cat => {
    const rows = cat.items.filter(it => t.byItem[it.id]);
    if (!rows.length) return '';
    let u = 0, tx = 0, w = 0;
    const body = rows.map(it => {
      const b = t.byItem[it.id]; u += b.units; tx += b.tix; w += b.walkoffs;
      const left = stockLeft(it.id);
      return `<tr><td>${esc(it.name)}</td><td class="num">${b.units}</td><td class="num">${b.walkoffs || ''}</td><td class="num">${b.tix}</td><td class="num">${left == null ? '' : left}</td></tr>`;
    }).join('');
    return body + `<tr class="sub"><td>${esc(cat.name)} total</td><td class="num">${u}</td><td class="num">${w || ''}</td><td class="num">${tx}</td><td></td></tr>`;
  }).join('');

  const pz = t.prizes;
  const prizeRows = Object.keys(t.byPrize).sort((a, b2) => t.byPrize[b2].given - t.byPrize[a].given).map(id => {
    const r = t.byPrize[id];
    const left = stockLeft(id);
    return `<tr><td>${esc(ITEMS[id].name)}</td><td class="num">${r.given}</td><td class="num">${r.cards}</td><td class="num">${left == null ? '' : left}</td></tr>`;
  }).join('');
  const prizeBlock = pz.trades ? `<h3>Prize Table</h3>
    <div class="big-stats">
      <div class="stat"><div class="s-val">${pz.given}</div><div class="s-label">Prizes given (${plural(pz.trades, 'trade')})</div></div>
      <div class="stat"><div class="s-val">${pz.cards}</div><div class="s-label">Cards redeemed (≈ ${money(pz.cards * PRIZE_DOLLARS_PER_CARD)} in prizes)</div></div>
      <div class="stat"><div class="s-val">${(pz.cards / pz.trades).toFixed(1)}</div><div class="s-label">Average cards per trade</div></div>
    </div>
    <table><thead><tr><th>Prize (most popular first)</th><th class="num">Given</th><th class="num">Cards</th><th class="num">Left</th></tr></thead><tbody>${prizeRows}</tbody></table>
    ${t.battle.cards ? `<p class="note">On this laptop: Balloon Battle paid out ${t.battle.cards} cards; ${pz.cards} redeemed.</p>` : ''}` : '';

  const partRows = COPTER_PARTS.filter(([key]) => stockStart(key) != null).map(([key, name]) =>
    `<tr><td>${esc(name)}</td><td class="num">${stockStart(key)}</td><td class="num">${stockUsed(key)}</td><td class="num">${keyLeft(key)}</td></tr>`).join('');

  const b = t.battle;
  const battleBlock = t.paid.length ? `<h3>Balloon Battle</h3>
    <div class="big-stats">
      <div class="stat"><div class="s-val">${b.matches}</div><div class="s-label">Matches (${b.house} vs House · ${b.pvp} vs Player · ${b.rematches} rematches)</div></div>
      <div class="stat"><div class="s-val">${b.cards}</div><div class="s-label">Cards paid out (≈ ${money(b.cards * PRIZE_DOLLARS_PER_CARD)} in prizes)</div></div>
      <div class="stat"><div class="s-val">${b.tix ? (b.cards / b.tix).toFixed(2) : '0'}</div><div class="s-label">Cards per ticket (target about 1)</div></div>
      <div class="stat"><div class="s-val">${b.avgMin == null ? '-' : b.avgMin.toFixed(1)}</div><div class="s-label">Average match, minutes</div></div>
    </div>
    <p class="note">${plural(b.players, 'player')} played · ${matchesText(b.queued)} paid and waiting · ${plural(b.weapons, 'weapon unlock')} · ${b.refunds ? `${plural(b.refunds, 'refund')} (${b.refundTix} tix handed back) · ` : ''}${b.tix} tix (≈ ${money(b.tix * NET_PER_TICKET)} after CCA's 10%) vs ≈ ${money(b.cards * PRIZE_DOLLARS_PER_CARD)} in prizes.</p>` : '';

  // Prize-only laptops have no tickets; leave the ticket figures out there.
  const hasTix = t.tix > 0 || t.sold.length > 0 || b.players > 0 || enabledCats().some(cat => cat.kind !== 'prizes');

  // Demographics: sale units and battle players per age / gender group.
  const usedSale = CATEGORIES.filter(cat => cat.kind === 'sale' && cat.items.some(it => t.byItem[it.id] && t.byItem[it.id].units));
  const battlePlayers = t.paid.flatMap(m => m.players);
  const demoTable = (title, list, field) => {
    const groups = list.map(o => ({ id: o.id, label: o.label })).concat([{ id: null, label: 'Not tagged' }]);
    const body = groups.map(g => {
      const cs = t.sold.filter(c => (c[field] || null) === g.id);
      const ps = battlePlayers.filter(p => (p[field] || null) === g.id);
      const ts = t.trades.filter(c => (c[field] || null) === g.id);
      if (!cs.length && !ps.length && !ts.length) return '';
      const cells = usedSale.map(cat => `<td class="num">${cs.reduce((s, c) => s + catUnits(c, cat.id), 0)}</td>`).join('');
      const battleCell = t.paid.length ? `<td class="num">${ps.length}</td>` : '';
      const prizeCell = pz.trades ? `<td class="num">${ts.reduce((s, c) => s + unitsOf(c), 0)}</td>` : '';
      const tix = cs.reduce((s, c) => s + customerTotal(c), 0) + ps.reduce((s, p) => s + p.tix, 0);
      return `<tr><td>${esc(g.label)}</td>${cells}${battleCell}${prizeCell}${hasTix ? `<td class="num">${tix}</td>` : ''}</tr>`;
    }).join('');
    if (!body) return '';
    return `<h3>${title}</h3><table><thead><tr><th>${title}</th>${usedSale.map(cat => `<th class="num">${esc(cat.name)} units</th>`).join('')}${t.paid.length ? '<th class="num">Battle players</th>' : ''}${pz.trades ? '<th class="num">Prizes</th>' : ''}${hasTix ? '<th class="num">Tix</th>' : ''}</tr></thead><tbody>${body}</tbody></table>`;
  };

  const pending = [];
  if (open && open.lines.length) pending.push(`customer #${open.no} still open (${customerTotal(open)} tix, not counted yet)`);
  if (playing) pending.push(`match #${playing.no} in progress (its ${matchTix(playing)} tix are counted)`);
  if (b.queued) pending.push(`${plural(b.queued, 'sign-up')} waiting in the battle queue (their tix are counted)`);
  const openTrade = currentOf('trade');
  if (openTrade && openTrade.lines.length) pending.push(`trade #${openTrade.no} still open (${customerTotal(openTrade)} cards, not counted yet)`);

  return `<div class="dialog" role="dialog" aria-label="Totals">
    ${dialogHead('Totals · ' + esc(state.settings.station))}
    ${hasTix ? `<div class="big-stats">
      <div class="stat"><div class="s-val">${t.tix}</div><div class="s-label">Tickets that should be in the boxes</div></div>
      <div class="stat"><div class="s-val">${money(t.tix * NET_PER_TICKET)}</div><div class="s-label">To Rambots after CCA's 10%</div></div>
      <div class="stat"><div class="s-val">${t.sold.length + b.players}</div><div class="s-label">Customers + battle players</div></div>
      ${t.cashTix ? `<div class="stat"><div class="s-val">${cashText(t.cashTix)}</div><div class="s-label">Cash sales (${t.cashSales}) · in the goal, not in the boxes</div></div>` : ''}
    </div>` : ''}
    ${pending.length ? `<p class="note">Note: ${pending.join('; ')}.</p>` : ''}
    ${boxRows ? `<h3>Per ticket box</h3><table><thead><tr><th>Box</th><th class="num">Tix</th><th class="num">After 10%</th></tr></thead><tbody>${boxRows}</tbody></table>` : (pz.trades ? '' : '<p class="note">Nothing sold yet.</p>')}
    ${itemRows ? `<h3>Items</h3><table><thead><tr><th>Item</th><th class="num">Sold</th><th class="num">Walk-offs</th><th class="num">Tix</th><th class="num">Left</th></tr></thead><tbody>${itemRows}</tbody></table>
      ${partRows ? `<h3>Copter parts left</h3><table><thead><tr><th>Part</th><th class="num">Start</th><th class="num">Used</th><th class="num">Left</th></tr></thead><tbody>${partRows}</tbody></table>` : ''}
      <p class="note">Inventory check: before − after − walk-offs should equal sold.${t.bonusCards ? ` Free Pokémon cards handed out with purchases: ${t.bonusCards} (≈ ${money(t.bonusCards * PRIZE_DOLLARS_PER_CARD)}).` : ''}</p>` : ''}
    ${battleBlock}
    ${prizeBlock}
    ${demoTable('Age', AGES, 'age')}
    ${demoTable('Gender', GENDERS, 'gender')}
    ${statsTable()}
    <p class="note">Last export: ${state.lastExport ? fmtTime(state.lastExport) : 'never'}. Export every hour or so as a backup.</p>
    <div class="row">
      <button class="btn go" data-act="export">Sales CSV</button>
      <button class="btn" data-act="exportstats">Stats CSV</button>
      <button class="btn" data-act="exportbackorders" ${state.backorders.length ? '' : 'disabled'}>Backorders CSV</button>
    </div>
    <div class="row"><button class="btn" data-act="open" data-modal="combine">Combine laptops' CSVs</button></div>
  </div>`;
}

function historyView() {
  const entries = [];
  state.customers.filter(c => c.lines.length).forEach(c => entries.push({ t: c.closedAt || c.openedAt, kind: 'sale', c }));
  state.matches.forEach(m => entries.push({ t: m.paidAt || m.startedAt, kind: 'match', m }));
  state.backorders.forEach(b => entries.push({ t: b.at, kind: 'backorder', b }));
  state.walkoffs.forEach(w => entries.push({ t: w.at, kind: 'walkoff', w }));
  entries.sort((a, b) => Date.parse(b.t) - Date.parse(a.t));

  const rows = entries.map(e => {
    if (e.kind === 'sale') {
      const c = e.c;
      const items = c.lines.map(l => `${ITEMS[l.item].name} ×${l.qty}`).join(', ');
      const tags = [labelOf(AGES, c.age), labelOf(GENDERS, c.gender)].filter(Boolean).join(' · ');
      const isOpen = !c.closedAt;
      const btn = isOpen ? '<span class="note">in progress</span>'
        : (c.voided ? `<button class="btn slim" data-act="restore" data-id="${c.id}">Restore</button>`
          : `<button class="btn slim" data-act="void" data-id="${c.id}">Void</button>`);
      return `<div class="h-row${c.voided ? ' voided' : ''}${isOpen ? ' open' : ''}">
        <div class="h-main">
          <div class="h-top">${kindOfCustomer(c) === 'trade' ? 'Trade' : 'Sale'} #${c.no} · ${fmtTime(c.closedAt || c.openedAt)}${tags ? ' · ' + esc(tags) : ''}${isCash(c) ? ' · cash' : ''}${bonusOf(c) ? ` · ${plural(bonusOf(c), 'free card')}` : ''}${c.voided ? ' · VOIDED' : ''}</div>
          <div class="h-items">${esc(items)}</div>
        </div>
        <div class="h-tix">${isCash(c) ? `${cashText(customerTotal(c))} cash` : `${customerTotal(c)} ${unitWord(kindOfCustomer(c))}`}</div>
        ${btn}
      </div>`;
    }
    if (e.kind === 'backorder') {
      const b = e.b;
      const btn = b.voided ? `<button class="btn slim" data-act="borestore" data-id="${b.id}">Restore</button>`
        : `<button class="btn slim" data-act="bovoid" data-id="${b.id}">Void</button>`;
      return `<div class="h-row${b.voided ? ' voided' : ''}">
        <div class="h-main">
          <div class="h-top">Backorder #${b.no} · ${fmtTime(b.at)}${b.voided ? ' · VOIDED' : ''}</div>
          <div class="h-items">${esc(ITEMS[b.item].name)} ×${b.qty} · ${esc(b.name || 'no name')} · ${esc(b.contact)}${b.note ? ' · ' + esc(b.note) : ''}</div>
        </div>
        <div class="h-tix">0 tix</div>
        ${btn}
      </div>`;
    }
    if (e.kind === 'match') {
      const m = e.m;
      const who = m.players.map(p => {
        const res = p.outcome ? ` ${outcomeLabel(p.outcome).toLowerCase()}`
          : (p.pops == null ? '' : ` popped ${p.pops}${m.mode === 'pvp' && p.won ? ', won' : ''}${m.tie ? ', tie' : ''}`);
        return `${p.name} (${weaponsText(p)})${res}${p.cards ? `, ${p.cards} cards` : ''}`;
      }).join(' · ');
      const isOpen = m.status !== 'done';
      const note = { queued: 'in queue', refunded: 'refunded', paired: `paired into #${m.pairedInto}` }[m.status] || 'in progress';
      const btn = isOpen ? `<span class="note">${note}</span>`
        : (m.voided ? `<button class="btn slim" data-act="mrestore" data-id="${m.id}">Restore</button>`
          : `<button class="btn slim" data-act="mvoid" data-id="${m.id}">Void</button>`);
      return `<div class="h-row${m.voided ? ' voided' : ''}${isOpen ? ' open' : ''}">
        <div class="h-main">
          <div class="h-top">Battle #${m.no} · ${fmtTime(m.paidAt || m.startedAt)} · ${m.mode === 'pvp' ? 'vs Player' : 'vs House'}${m.rematch ? ' · instant rematch' : (m.again ? ' · rematch' : '')}${m.restarts ? ` · ${plural(m.restarts, 'restart')}` : ''}${m.voided ? ' · VOIDED' : ''}${m.status === 'refunded' ? ' · REFUNDED' : ''}</div>
          <div class="h-items">${esc(who)}</div>
        </div>
        <div class="h-tix">${isPaid(m) ? matchTix(m) : 0} tix</div>
        ${btn}
      </div>`;
    }
    const w = e.w;
    const btn = w.voided ? `<button class="btn slim" data-act="worestore" data-id="${w.id}">Restore</button>`
      : `<button class="btn slim" data-act="wovoid" data-id="${w.id}">Void</button>`;
    return `<div class="h-row${w.voided ? ' voided' : ''}">
      <div class="h-main">
        <div class="h-top">Walk-off #${w.no} · ${fmtTime(w.at)} · ${esc(labelOf(WALKOFF_REASONS, w.reason))}${w.voided ? ' · VOIDED' : ''}</div>
        <div class="h-items">${esc(ITEMS[w.item].name)} ×${w.qty}</div>
      </div>
      <div class="h-tix">0 tix</div>
      ${btn}
    </div>`;
  }).join('');
  return `<div class="dialog" role="dialog" aria-label="History">
    ${dialogHead('History')}
    <p class="note">Newest first. Void removes a record from the totals (Undo or Restore brings it back).</p>
    <div class="hist">${rows || '<p class="note">Nothing yet.</p>'}</div>
  </div>`;
}

function settingsView() {
  const s = state.settings;
  const b = s.battle;
  const n = state.customers.filter(c => c.lines.length).length + state.matches.length + state.walkoffs.length + state.backorders.length;

  return `<div class="dialog" role="dialog" aria-label="Settings">

      <p class="note">This laptop's goal: <b>${pace().goal} tix</b> (${esc(pace().rows.filter(r => r.goal).map(r => `${r.cat.name} ${r.goal}`).join(' + ') || 'no ticket booths on')}). Each laptop only paces the booths turned on above. ${esc(PLINKO_GOAL_NOTE)}</p>

    <div class="field">

      <div class="toggles">${SCORING_PRESETS.map(pr => {

      <div class="nums">

      <div class="nums" style="margin-top:8px">
        ${COPTER_PARTS.map(([key, name]) => `<label>${esc(name)}<input type="number" id="stock-${key}" min="0" max="9999" value="${stockStart(key) == null ? '' : stockStart(key)}" placeholder="not tracked"></label>`).join('')}

    </div>
    <div class="field">
      <div class="f-label">Prize Table: cards per prize and starting stock (blank = don't track stock)</div>
      <table><thead><tr><th>Prize</th><th class="num">Cards</th><th class="num">Starting stock</th><th class="num">Left now</th></tr></thead><tbody>
      ${CATEGORIES.find(cat => cat.id === 'prizes').items.map(it => {
        const st = stockStart(it.id);
        const left = stockLeft(it.id);
        return `<tr><td>${esc(it.name)}</td>
          <td class="num"><input class="mini" type="number" id="pz-cards-${it.id}" min="0" max="999" value="${cardsFor(it.id)}"></td>
          <td class="num"><input class="mini" type="number" id="pz-stock-${it.id}" min="0" max="9999" value="${st == null ? '' : st}" placeholder="not tracked"></td>

      }).join('')}
      </tbody></table>
      <p class="note">Card price changes apply to new trades only.</p>
    </div>
    <div class="field">
      <div class="f-label">Data on this laptop</div>
      <p class="note">${plural(n, 'record')} saved. Last export: ${state.lastExport ? fmtTime(state.lastExport) : 'never'}. Laptop ID ${esc(state.settings.laptopId)} goes in every file name and row.</p>
      <div class="row">
        <button class="btn go" data-act="export">Sales CSV</button>
        <button class="btn" data-act="exportstats">Stats CSV</button>
        <button class="btn" data-act="exportbackorders" ${state.backorders.length ? '' : 'disabled'}>Backorders CSV</button>
      </div>
      <div class="row">
        <button class="btn" data-act="open" data-modal="combine">Combine laptops' CSVs</button>
        <button class="btn danger" data-act="clearask" ${n ? '' : 'disabled'}>Delete all data</button>

}

function confirmClearView() {
  const n = state.customers.filter(c => c.lines.length).length + state.matches.length + state.walkoffs.length + state.backorders.length;
  return `<div class="dialog narrow" role="dialog" aria-label="Confirm delete">
    ${dialogHead('Delete all data?')}
    <p class="note" style="font-size:19px">This removes all ${plural(n, 'record')} (sales, trades, battles and the battle queue, walk-offs, backorders) from this booth on this laptop. Download the CSV first. Undo can bring them back only until the page is reloaded.</p>
    <div class="row">
      <button class="btn" data-act="open" data-modal="settings">Cancel</button>
      <button class="btn danger" data-act="clear">Delete all ${n}</button>
    </div>
  </div>`;
}

/* ==========================================================================
   Toast and match timer
   ========================================================================== */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (kind || 'info');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast ' + (kind || 'info'); }, kind === 'undo' || kind === 'bonus' ? 4500 : 3200);
}

let lastPaceTick = 0;
function tick() {
  const el = document.getElementById('match-timer');
  const m = playingMatch();
  if (el && m && m.status === 'playing') {
    // Counts down once GO is tapped; paused holds; past zero shows overtime.
    el.textContent = timerText(m);
    el.className = 'timer ' + timerClass(m);
  }
  if (view.screen === 'battle') queuedMatches().forEach((x, i) => {
    const w = document.getElementById('qw-' + x.id);
    if (w) w.textContent = waitText(i);
  });
  // Refresh the pace chip every 15 s without re-rendering the page.
  if (Date.now() - lastPaceTick > 15000) {
    lastPaceTick = Date.now();
    const chip = document.getElementById('pace-chip');
    if (chip) chip.outerHTML = paceChip();
  }
}
setInterval(tick, 1000);

/* ==========================================================================
   Input handling
   ========================================================================== */
function keypadPress(k) {
  const m = view.modal;
  if (!m || m.type !== 'keypad') return;
  if (k === 'back') m.value = m.value.slice(0, -1);
  else if (k === 'clear') m.value = '';
  else if (m.value.length < 3) m.value = (m.value + k).replace(/^0+(?=\d)/, '');
  render();
}

function keypadSet() {
  const m = view.modal;
  if (!m || m.type !== 'keypad' || m.value === '') return;
  const q = parseInt(m.value, 10);
  view.modal = null;
  setQty(m.item, q);
}

const actions = {
  undo,
  home: () => { view.screen = 'home'; render(); },
  cat: d => { view.screen = d.cat; render(); },
  add: d => addItem(d.item, 1),
  minus: d => removeOne(d.item),
  keypad: d => { view.modal = { type: 'keypad', item: d.item, value: '' }; render(); },
  key: d => keypadPress(d.key),
  kpset: keypadSet,
  finish: () => finish(),
  cash: toggleCash,
  why: () => { view.why = !view.why; render(); },
  demo: d => setDemo(d.field, d.val),
  open: d => { view.modal = { type: d.modal }; render(); },
  close: () => { view.modal = null; render(); },
  overlay: () => { view.modal = null; render(); },
  void: d => setVoided(d.id, true),
  restore: d => setVoided(d.id, false),
  mvoid: d => setMatchVoided(d.id, true),
  mrestore: d => setMatchVoided(d.id, false),
  wovoid: d => setWalkoffVoided(d.id, true),
  worestore: d => setWalkoffVoided(d.id, false),
  export: exportCSV,
  clearask: () => { view.modal = { type: 'confirmClear' }; render(); },
  clear: clearAll,
  togglecat: d => {
    const cats = state.settings.cats;
    if (cats[d.cat] && enabledCats().length === 1) { toast('Keep at least one booth on', 'warn'); return; }
    cats[d.cat] = !cats[d.cat];
    save();
    render();
  },
  toggledemo: () => { state.settings.demographics = !state.settings.demographics; save(); render(); },
  pvprule: d => { state.settings.battle.pvpRule = d.val; save(); render(); },
  // Walk-offs
  walkoff: d => openWalkoff(d.cat),
  backorder: d => openBackorder(d.cat),
  boitem: d => { view.modal.item = d.item; render(); },
  boqty: d => { view.modal.qty = Math.max(1, Math.min(99, view.modal.qty + Number(d.d))); render(); },
  bosave: saveBackorder,
  bovoid: d => setBackorderVoided(d.id, true),
  borestore: d => setBackorderVoided(d.id, false),
  upgrade: upgradeKit,
  exportstats: () => exportStats(),
  exportbackorders: () => exportBackorders(),
  pacetoggle: () => { state.settings.showPace = !state.settings.showPace; save(); render(); },
  combineclear: () => { view.combine = { files: [], plinko: view.combine.plinko }; render(); },
  combinedownload: downloadCombined,
  woitem: d => { view.modal.item = d.item; render(); },
  woqty: d => { view.modal.qty = Math.max(1, Math.min(99, view.modal.qty + Number(d.d))); render(); },
  woreason: d => { view.modal.reason = d.val; render(); },
  wosave: saveWalkoff,
  // Balloon Battle
  qmode: d => { view.qDraft.mode = d.val; render(); },
  qweap: d => { cycleWeapon(view.qDraft.players[Number(d.p)].w, d.w); render(); },
  qdemo: d => {
    const pd = view.qDraft.players[Number(d.p)];
    pd[d.field] = pd[d.field] === d.val ? null : d.val;
    render();
  },
  qadd: () => queueAdd(false),
  qaddgo: () => queueAdd(true),
  qstart: d => startQueued(d.id),
  qdown: d => queueDown(d.id),
  qrefund: d => queueRefund(d.id),
  pair: d => pairUp(d.id),
  mweapons: d => openWeapons(d.id),
  mweap: d => { cycleWeapon(view.modal.w[Number(d.p)], d.w); render(); },
  mweapsave: saveWeapons,
  gomatch: () => clockAct('go'),
  pausematch: () => clockAct('pause'),
  resumematch: () => clockAct('resume'),
  restartmatch: () => clockAct('restart'),
  editclock: () => {
    const m = playingMatch();
    if (!m) return;
    view.modal = { type: 'clock', sec: Math.max(0, Math.round(clockLeft(m) / 1000)) };
    render();
  },
  clockadj: d => { view.modal.sec = Math.max(0, Math.min(3600, view.modal.sec + Number(d.d))); render(); },
  clockfull: () => { const m = playingMatch(); if (m) { view.modal.sec = clockLimitMs(m) / 1000; render(); } },
  clocksave: () => { const sec = view.modal.sec; view.modal = null; clockAct('set', sec * 1000); },
  backqueue: backToQueue,
  endmatch: endMatch,
  rmwho: d => { view.rmWho = d.val; render(); },
  rmonce: d => { state.settings.battle.rematchOnce = d.val === '1'; save(); render(); },
  scorehouse: d => scoreHouse(Number(d.n), d.ko === '1'),
  pvppop: d => { view.pvpPops[Number(d.p)] = Number(d.n); render(); },
  pvpsave: scorePvp,
  outcome: d => scoreOutcome(d.code),
  scoringpreset: d => {
    const pr = SCORING_PRESETS.find(x => x.id === d.id);
    Object.assign(state.settings.battle, JSON.parse(JSON.stringify(pr.set)));
    if (pr.set.pvpTie) state.settings.battle.pvpTieSet = true;
    save(); render(); toast(`Scoring: ${pr.label}`, 'ok');
  },
  scoringmode: d => { state.settings.battle.scoring = d.val; save(); render(); },
  pvptie: d => { state.settings.battle.pvpTie = d.val; state.settings.battle.pvpTieSet = true; save(); render(); },
  rematch: d => rematch(d.instant === '1'),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.act === 'overlay' && e.target !== el) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el.dataset);
  // Drop focus so a stray Enter/Space never re-fires the last button.
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
});

document.addEventListener('input', e => {
  if (/^q-name-[01]$/.test(e.target.id)) view.qDraft.players[Number(e.target.id.slice(-1))].name = e.target.value;
  const bo = { 'bo-name': 'name', 'bo-contact': 'contact', 'bo-note': 'note' }[e.target.id];
  if (bo && view.modal && view.modal.type === 'backorder') view.modal[bo] = e.target.value;
});

const BATTLE_FIELDS = { 'set-match': 'match', 'set-rematch': 'rematch', 'set-cpp': 'cardsPerPop', 'set-rmwait': 'rematchMaxWaiting' };
document.addEventListener('change', e => {
  if (e.target.id === 'combine-files') {
    loadCombineFiles(e.target.files);
    return;
  }
  if (e.target.id === 'combine-plinko') {
    view.combine.plinko = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'station-input') {
    state.settings.station = e.target.value.trim() || 'Station';
    const c = current();
    if (c && !c.closedAt) c.station = state.settings.station;
    save();
    render();
    toast('Station name saved', 'ok');
  } else if (/^stock-/.test(e.target.id)) {
    const key = e.target.id.slice(6);
    const raw = e.target.value.trim();
    const v = parseInt(raw, 10);
    if (raw === '') delete state.settings.stock[key];
    else if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    else state.settings.stock[key] = v;
    save();
    render();
    toast('Stock saved', 'ok');
  } else if (e.target.id === 'bonus-every') {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    state.settings.cardEvery = v;
    save();
    render();
    toast(v ? `1 free card per ${v} tix · applies to new sales` : 'Free cards with purchase are off', 'ok');
  } else if (/^goal-/.test(e.target.id)) {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    state.settings.goals[e.target.id.slice(5)] = v;
    save();
    render();
    toast('Goal saved', 'ok');
  } else if (['ev-date', 'ev-start', 'ev-end'].includes(e.target.id)) {
    const key = { 'ev-date': 'date', 'ev-start': 'start', 'ev-end': 'end' }[e.target.id];
    if (!e.target.value) { render(); return; }
    state.settings.event[key] = e.target.value;
    save();
    render();
    toast(eventWindow().ok ? 'Event time saved' : 'End must be after start', eventWindow().ok ? 'ok' : 'warn');
  } else if (/^pz-(cards|stock)-/.test(e.target.id)) {
    const [, what, itemId] = e.target.id.match(/^pz-(cards|stock)-(.+)$/);
    const raw = e.target.value.trim();
    const v = parseInt(raw, 10);
    const o = state.settings.prizes[itemId] || (state.settings.prizes[itemId] = {});
    if (what === 'stock' && raw === '') o.stock = null;
    else if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    else o[what] = v;
    save();
    render();
    toast(what === 'cards' ? 'Saved · applies to new trades' : 'Starting stock saved', 'ok');
  } else if (e.target.id === 'set-length') {
    const v = parseFloat(e.target.value);
    if (!Number.isFinite(v) || v < 0.25) { render(); toast('Enter minutes, e.g. 2 or 1.5', 'warn'); return; }
    state.settings.battle.matchSeconds = Math.round(v * 60);
    save();
    render();
    toast(`Match length ${fmtDur(state.settings.battle.matchSeconds * 1000)} · applies to new matches`, 'ok');
  } else if (/^oc-/.test(e.target.id) || e.target.id === 'set-consolation') {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    if (e.target.id === 'set-consolation') state.settings.battle.consolation = v;
    else state.settings.battle.outcomeCards[e.target.id.slice(3)] = v;
    save();
    render();
    toast('Scoring saved', 'ok');
  } else if (/^set-wp-/.test(e.target.id)) {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    state.settings.battle.weaponPrices[e.target.id.slice(7)] = v;
    save();
    render();
    toast('Weapon price saved · applies to new unlocks', 'ok');
  } else if (e.target.id === 'set-turn') {
    const v = parseFloat(e.target.value);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter minutes, e.g. 2', 'warn'); return; }
    state.settings.battle.turnaroundMin = v;
    save();
    render();
    toast('Turnaround saved · wait times updated', 'ok');
  } else if (BATTLE_FIELDS[e.target.id]) {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 0) { render(); toast('Enter a whole number', 'warn'); return; }
    state.settings.battle[BATTLE_FIELDS[e.target.id]] = v;
    if (e.target.id === 'set-rematch') state.settings.battle.rematchSet = true;
    save();
    render();
    toast('Saved · applies to new matches', 'ok');
  }
});

document.addEventListener('keydown', e => {
  const inField = e.target.matches && e.target.matches('input, textarea, select');
  const m = view.modal;

  if (m && m.type === 'keypad') {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keypadPress(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); keypadPress('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); keypadSet(); }
    else if (e.key === 'Escape') { e.preventDefault(); actions.close(); }
    return;
  }
  if (inField) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.target.id === 'q-name-0' && view.qDraft.mode === 'pvp') {
        const next = document.getElementById('q-name-1');
        if (next) next.focus();
      } else if (/^q-name-[01]$/.test(e.target.id)) queueAdd(false);
      else e.target.blur();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      e.target.blur(); // saves the field first (change event)
      if (view.modal) actions.close();
    }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (m) actions.close();
    else if (view.screen !== 'home') actions.home();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    // Enter finishes a sale; Space does nothing (stops accidental re-clicks).
    e.preventDefault();
    if (e.key === 'Enter' && !m && view.screen !== 'battle') finish();
    if (e.key === 'Enter' && m && m.type === 'upsell') queueAdd(true);
  }
});

// Two tabs of the same booth link would overwrite each other. Follow the other
// tab's saves and warn loudly. (Different booth links use separate storage.)
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try {
    state = hydrate(e.newValue);
    applyPreset();
    // This tab's undo snapshots predate the other tab's changes; undoing one
    // would erase them, so drop the history.
    undoStack.length = 0;
    otherTab = true;
    render();
  } catch (err) { /* ignore malformed */ }
});

// Hosted (GitHub Pages): cache the page so a refresh with no wifi still opens
// it, and ask the browser not to evict saved sales under storage pressure.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* still works online */ });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

render();
</script>
